        It cannot be used to send or receive funds.

        '
      enum:
      - UK.OBIE.IBAN
      - UK.OBIE.SortCodeAccountNumber
      - US.RoutingNumberAccountNumber
      - US.BranchCodeAccountNumber
      - UK.Revolut.InternalAccountId
      example: UK.OBIE.IBAN
    OBStandingOrder4:
      required:
      - AccountId
      - Frequency
      type: object
      properties:
        AccountId:
          $ref: '#/components/schemas/AccountId'
        StandingOrderId:
          maxLength: 40
          minLength: 1
          type: string
          description: 'The unique and immutable ID to identify the standing order resource.

            This ID has no meaning to the account owner.'
        Frequency:
          maxLength: 35
          minLength: 1
          type: string
          description: 'The frequency of the standing order:

            - `EvryDay`: Every day

            - `IntrvlWkDay`: Only one week interval is supported (01) and any day within the week (01 to 07)

            - `IntrvlMnthDay`: Only one month interval is supported (01) and any day within the month (1 to 31)


            Example values:

            - `EvryDay`

            - `IntrvlWkDay:01:0[1-7]`

            - `IntrvlMnthDay:01:(0[1-9]|[12][0-9]|3[01])`'
        Reference:
          maxLength: 35
          minLength: 1
          type: string
          description: 'The unique reference that the creditor assigns to refer to the payment transaction.


            If available, the initiating party should provide this reference in the structured remittance information to enable reconciliation by the creditor upon receipt of the amount of money.


            If the business context requires the use of a creditor reference or a payment remit identification, and only one identifier can be passed through the end-to-end chain, the creditor''s reference or payment remittance identification should be quoted in the end-to-end transaction identification.'
        FirstPaymentAmount:
          required:
          - Amount
          - Currency
          type: object
          properties:
            Amount:
              $ref: '#/components/schemas/OBActiveCurrencyAndAmount_SimpleType'
            Currency:
              pattern: ^[A-Z]{3,3}$
              type: string
              description: '[ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code in upper case.'
          description: The amount of the first standing order payment.
        FirstPaymentDateTime:
          type: string
          description: 'The date the first payment for a standing order schedule is made.


            All dates in the JSON payloads are represented in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date-time format.

            All date-time fields in responses must include the timezone.


            For example: `2017-04-05T10:43:07+00:00`.'
          format: date-time
        NextPaymentAmount:
          required:
          - Amount
          - Currency
          type: object
          properties:
            Amount:
              $ref: '#/components/schemas/OBActiveCurrencyAndAmount_SimpleType'
            Currency:
              pattern: ^[A-Z]{3,3}$
              type: string
              description: '[ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code in upper case.'
          description: The amount of the next standing order payment.
        StandingOrderStatusCode:
          $ref: '#/components/schemas/OBExternalStandingOrderStatus1Code'
        CreditorAccount:
          $ref: '#/components/schemas/OBCashAccount5'
      description: A list of standing orders.
    Links:
      required:
      - Self
      type: object
      properties:
        Self:
          type: string
          description: The absolute URI to the resource.
          format: uri
        Next:
          type: string
          description: The absolute URI to the next pagination resource.
          format: uri
        Prev:
          type: string
          description: The absolute URI to the previous pagination resource.
          format: uri
      description: Links relevant to the payload.
    OBReadDirectDebit1:
      required:
      - Data
      - Links
      - Meta
      type: object
      properties:
