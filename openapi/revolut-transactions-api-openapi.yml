            Issuer:
              maxLength: 35
              minLength: 1
              type: string
              description: The identification of the issuer of the proprietary bank transaction code.
          description: A list of elements to fully identify a proprietary bank transaction code.
        SupplementaryData:
          description: Additional information that cannot be captured in the structured fields and/or any other specific block.
          allOf:
          - $ref: '#/components/schemas/OBSupplementaryData1'
          - type: object
            properties:
              StartedDate:
                readOnly: true
                type: string
                format: date-time
                example: '2017-04-05T10:43:07.275221Z'
                description: 'The date and time the transaction started in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.


                  Returned if it is different from `BookingDateTime`.


                  For example, if the transaction was an offline card transaction made during a flight and would be booked at a later time or date, this field indicates the actual date and time the transaction took place, as provided by the merchant.'
        TransactionInformation:
          $ref: '#/components/schemas/TransactionInformation'
        Balance:
