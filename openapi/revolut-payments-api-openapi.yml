          description: The type of payment method used to pay for the order.
        subtype:
          type: string
          enum:
          - revolut_account
          - card
          description: Indicates whether the customer used their card or Revolut account via Revolut Pay.
        id:
          type: string
          format: uuid
          description: 'ID of the saved payment method.


            :::note

            The `id` parameter is only returned if the payment method is saved.

            :::'
      required:
      - type
      - subtype
    Capture-Deadline:
      type: string
      format: date-time
      description: 'The date and time by which the payment must be captured.


        After this deadline, the authorised funds may be automatically released by the card issuer.'
    Payment-Retrieval-v3:
      type: object
      description: 'Represents a payment for an order.


        For pre-authorised payments, the `authorised_amount` field tracks the currently authorised amount, which may differ from `amount` during incremental authorisation processing.'
      properties:
        order_id:
          type: string
          format: uuid
          description: The ID of the associated order.
        id:
          $ref: '#/components/schemas/Payment-Id'
        state:
          $ref: '#/components/schemas/Payment-State-v2'
        decline_reason:
          $ref: '#/components/schemas/Decline-Reason-v2'
        bank_message:
          $ref: '#/components/schemas/Bank-Message'
        created_at:
          $ref: '#/components/schemas/Payment-Created'
        updated_at:
          $ref: '#/components/schemas/Payment-Updated'
        token:
          $ref: '#/components/schemas/Payment-Token'
        amount:
          $ref: '#/components/schemas/Payment-Amount'
        authorised_amount:
          $ref: '#/components/schemas/Payment-Authorised-Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        settled_amount:
          $ref: '#/components/schemas/Payment-Settled-Amount'
        settled_currency:
          $ref: '#/components/schemas/Payment-Settled-Currency'
        payment_method:
          $ref: '#/components/schemas/Payment-Method-v2'
        authentication_challenge:
          $ref: '#/components/schemas/Authentication-Challenge-v2'
        billing_address:
          $ref: '#/components/schemas/Address-v2'
        risk_level:
          $ref: '#/components/schemas/Payment-Risk-Level'
        fees:
          $ref: '#/components/schemas/Fees'
        payer:
          $ref: '#/components/schemas/Payer'
      required:
      - id
      - state
      - created_at
      - updated_at
      - amount
    Terminal-Hardware-Id:
      type: string
      description: 'The hardware identifier of the Revolut Terminal device used to process the payment.


        :::note

        Only present for card-present transactions processed via Revolut Terminal.

        :::'
    Three-Ds-Fingerprint-v2:
      title: three_ds_fingerprint
      type: object
      description: Information about the 3DS fingerprint challenge.
      properties:
        type:
          $ref: '#/components/schemas/Authentication-Challenge-Type'
        fingerprint_html:
          type: string
          format: byte
          description: 'Base64-encoded HTML string for the 3DS fingerprint challenge. This HTML is fully

            constructed by Revolut — no modifications are needed.


            Decode this value using a `base64` decoder and render the resulting HTML in your

            front-end application. Revolut automatically moves the payment to the full 3DS

            challenge if the fingerprint is not handled within 15 seconds.'
      required:
      - type
      - fingerprint_html
    Payment-Settled-Amount:
      type: integer
      description: The amount of the settled payment (minor currency unit). For example, `7034` stands for €70.34.
    Revolut-Pay:
      discriminator:
        propertyName: subtype
        mapping:
          revolut_pay_account: '#/components/schemas/RPay-Account'
          revolut_pay_card: '#/components/schemas/RPay-Card'
      oneOf:
      - $ref: '#/components/schemas/RPay-Account'
      - $ref: '#/components/schemas/RPay-Card'
    Authentication-Challenge-Type:
      type: string
      enum:
      - three_ds
      - three_ds_fingerprint
      description: Type of the authentication challenge the payment triggers.
    Google-Pay:
      type: object
      description: Object containing details of a card used via Google Pay.
      properties:
        id:
          type: string
          format: uuid
          description: 'ID of the saved payment method.


            :::note

            The `id` parameter is only returned when the payment method is saved.

            :::'
        type:
          $ref: '#/components/schemas/Payment-Method-Type'
        card_brand:
          type: string
          description: The type of the card.
          enum:
          - visa
          - mastercard
          - american_express
        funding:
          type: string
          description: The type of card funding.
          enum:
          - credit
          - debit
          - prepaid
        card_country_code:
          type: string
          description: The 2-letter country code of the country where the card was issued.
        card_bin:
          type: string
          description: The BIN of the card.
          minLength: 6
          maxLength: 6
        card_last_four:
          type: string
          description: The last four digits of the card number.
          minLength: 4
          maxLength: 4
        card_expiry:
          type: string
          format: MM/YY
          description: The expiry date of the card in the format of MM/YY.
        cardholder_name:
          type: string
          description: The name of the cardholder.
        checks:
          $ref: '#/components/schemas/Card-Checks-v2'
        authorisation_code:
          $ref: '#/components/schemas/Authorisation-Code'
        arn:
          $ref: '#/components/schemas/Arn'
        capture_deadline:
          $ref: '#/components/schemas/Capture-Deadline'
        terminal_hardware_id:
          $ref: '#/components/schemas/Terminal-Hardware-Id'
        fingerprint:
          $ref: '#/components/schemas/Fingerprint'
        network_transaction_id:
          $ref: '#/components/schemas/Network-Transaction-Id'
      required:
      - type
    Phone:
      type: string
      description: The phone number of the customer in [E.164 format](https://en.wikipedia.org/wiki/E.164).
    Payment-Amount:
      type: integer
      format: int64
      minimum: 0
      description: 'The payment amount in minor units (e.g., cents). The value of this field depends on the payment type and state.


        | Payment type | State | Amount value |

        |--------------|-------|--------------|

        | Standard payment | Any | Total payment amount |

        | Pre-authorised payment | `authorisation_started` | New amount being authorised (during increment processing) |

        | Pre-authorised payment | `authorised` | Currently authorised amount (equals `authorised_amount`) |


        :::info

        For pre-authorised payments, see the `authorised_amount` field for tracking the currently authorised amount separately.

        :::'
      example: 600
    Bank-Message:
      type: string
      description: The reason for a `failed` or `declined` payment, sent by the financial institution processing the payment.
  examples:
    Res-Payment-Authentication-Challenge-Fingerprint:
      summary: Payment with 3DS fingerprint challenge
      value:
        id: d4aa447c-b9ef-4a0b-86ac-59bc4e8d590e
        order_id: b2da1805-94c3-4f66-8bae-4fc927d33990
        state: authentication_challenge
        created_at: '2026-03-12T10:00:00.000000Z'
        updated_at: '2026-03-12T10:00:05.000000Z'
        token: 3f7a9b2c-1d4e-5f6a-7b8c-9d0e1f2a3b4c
        amount: 1000
        currency: GBP
        settled_amount: 1000
        settled_currency: GBP
        risk_level: low
        fees: []
        payment_method:
          type: card
          card_brand: visa
          funding: credit
          card_country_code: GB
