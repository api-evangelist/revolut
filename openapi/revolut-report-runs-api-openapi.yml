            - payout_total_amount
            - payout_date
          description: "Names of the columns to be included in the report.\n\nIf the `columns` parameter is not defined in the request, all available columns will be included in the report. An empty array will return an error.\n\nAvailable columns:\n\n  | Column name | Description |\n  | ----------- | ----------- |\n  | `created_date` | Date and time the transaction was created. |\n  | `completed_date` | Date and time the transaction was completed. |\n  | `payout_affected_date` | Date and time the payout was affected by this transaction. |\n  | `affected_payout_amount` | Boolean flag indicating whether this transaction contributed to the payout amount (`true`) or not (`false`). Despite the name, this is not a monetary value. |\n  | `transaction_id` | Unique identifier of the transaction. |\n  | `order_id` | Unique identifier of the order associated with the transaction. |\n  | `dispute_id` | Unique identifier of the dispute associated with a chargeback or chargeback reversal transaction. Empty for rows not related to a dispute. |\n  | `merchant_order_reference` | Merchant's order reference. The value of the `merchant_order_data.reference` field set when the order was created. |\n  | `type` | Type of the payout-related ledger event the row represents. For the full list of returned values, see [Download report file](https://developer.revolut.com/docs/api/merchant#download-report-file). |\n  | `related_icpp_charge_id` | Unique identifier of the IC++ charge related to the transaction, if applicable. |\n  | `transaction_amount` | Amount of the transaction in the transaction currency. |\n  | `transaction_currency` | The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code of the transaction. |\n  | `billing_amount` | Amount of the transaction in the billing currency. |\n  | `billing_currency` | The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code of the billing amount. |\n  | `state` | State of the transaction, for example: `COMPLETED`. |\n  | `original_transaction_id` | Unique identifier of the original transaction. For refunds, references the transaction being refunded. |\n  | `original_transaction_amount` | Amount of the original transaction. |\n  | `original_transaction_currency` | The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code of the original transaction. |\n  | `original_order_id` | Unique identifier of the original order. For refunds, references the order being refunded. |\n  | `original_order_channel` | Channel through which the original order was created. |\n  | `original_merchant_order_reference` | Merchant's order reference for the original order. The value of the `merchant_order_data.reference` field set when the original order was created. |\n  | `fee_amount` | Total fee amount charged for the transaction. |\n  | `fee_currency` | The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code of the fee. |\n  | `settlement_amount` | Total amount settled on the merchant's account. |\n  | `settlement_currency` | The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code of the settled amount. |\n  | `location_id` | Unique identifier of the location associated with the transaction. |\n  | `location_name` | Name of the location associated with the transaction. |\n  | `submerchant_id` | Unique identifier of the submerchant associated with the transaction. |\n  | `payout_transfer_reference` | Reference of the bank transfer for this payout. This value is the same across all rows in the report, as each report covers a single payout. |\n  | `payout_total_amount` | Total amount of this payout. This value is the same across all rows in the report, as each report covers a single payout. |\n  | `payout_date` | Date and time the payout covered by this report was created. This value is the same across all rows in the report, as each report covers a single payout. |"
          example:
          - transaction_id
          - type
          - transaction_amount
          - transaction_currency
    Report-Run-Csv-Payout:
      title: Payout statement report CSV
      type: object
      description: 'CSV output for `payout_statement_report` report type. Contains all transactions that contributed to a specific payout.


        The first row is a header row with column names. Subsequent rows contain transaction data, one row per transaction.


        :::note

        The actual response is a raw `text/csv` string. The object schema below is a documentation convention only: OpenAPI''s schema language (JSON Schema) describes JSON data shapes and has no native construct for typed CSV columns, so each property here corresponds to a CSV column header rather than a JSON field.

        :::'
      properties:
        created_date:
          type: string
          format: date-time
          description: Date and time the transaction was created.
        completed_date:
          type: string
          format: date-time
          description: Date and time the transaction was completed.
        payout_affected_date:
          type: string
          format: date-time
          description: Date and time the payout was affected by this transaction.
        affected_payout_amount:
          type: boolean
          description: 'Indicates whether this transaction contributed to the payout amount (`true`) or not (`false`).


            Note: despite the name implying a monetary amount, this field is a boolean flag. A rename is planned for a future API version.'
        transaction_id:
          type: string
          format: uuid
          description: Unique identifier of the ledger transaction in the core settlement system. Matches `transaction_id` in the settlement report for the same event. Use `order_id` to cross-reference with the payments report.
        order_id:
          type: string
          format: uuid
          description: Unique identifier of the order associated with this transaction. Use `order_id` to cross-reference with the payments report or settlement report.
        dispute_id:
          type: string
          format: uuid
          description: Unique identifier of the dispute associated with a chargeback or chargeback reversal transaction. Empty for rows not related to a dispute.
        merchant_order_reference:
          type: string
          description: Merchant's order reference. The value of the `merchant_order_data.reference` field set when the order was created.
        type:
          type: string
          description: 'Type of the transaction.


            | Value | Description |

            | ----- | ----------- |

            | `Settlement` | Settlement of a payment into the merchant balance. |

            | `Refund` | Refund entry reducing the merchant balance. |

            | `External transfer money return` | Return of an external transfer entry. |

            | `Topup` | Balance top-up entry. |

            | `Topup Return` | Reversal of a top-up entry. |

            | `Customer dispute - withdrawal` | Chargeback or dispute withdrawal from the merchant balance. |

            | `Customer dispute - won` | Reversal of a previous dispute withdrawal. |

            | `Transfer from linked pocket` | Transfer from a linked balance pocket. |

            | `Automatic negative balance recovery` | Automatic recovery entry for a negative balance. |

            | `Payout` | Payout-related ledger entry. |

            | `Payout to an external account` | Transfer of payout funds to an external account. |

            | `Transfer from linked pocket with FX` | Transfer from a linked pocket involving FX conversion. |

            | `Payout with FX` | Payout-related entry involving FX conversion. |

            | `Money reserve block` | Reserve block entry withholding funds. |

            | `Money reserve unblock` | Release of previously blocked reserve funds. |

            | `IC++ post-billing fee` | IC++ fee charged after billing. |

            | `Fee refund` | Reversal of a previously charged fee. |

            | `Unrecognised transaction` | Transaction that does not map to a more specific category. |'
          enum:
          - Settlement
          - Refund
          - External transfer money return
          - Topup
          - Topup Return
          - Customer dispute - withdrawal
          - Customer dispute - won
          - Transfer from linked pocket
          - Automatic negative balance recovery
          - Payout
          - Payout to an external account
          - Transfer from linked pocket with FX
          - Payout with FX
          - Money reserve block
          - Money reserve unblock
          - IC++ post-billing fee
          - Fee refund
          - Unrecognised transaction
        related_icpp_charge_id:
          type: string
          format: uuid
          description: Unique identifier of the IC++ charge related to the transaction, if applicable.
        transaction_amount:
          type: number
          description: Amount of the transaction in the transaction currency.
        transaction_currency:
          type: string
          description: The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code of the transaction.
          example: GBP
        billing_amount:
          type: number
          description: Amount of the transaction in the billing currency.
        billing_currency:
          type: string
          description: The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code of the billing amount.
          example: GBP
        state:
          type: string
          description: State of the transaction.
          example: COMPLETED
        original_transaction_id:
          type: string
          format: uuid
          description: "For refunds and chargebacks, the ledger transaction ID of the original payment that this transaction reverses. Corresponds to `transaction_id` on the original settlement row. \n\n:::note\nPopulated only for reversal-type rows — for example, when `type` is `Refund` or `Customer dispute - withdrawal`.\n:::"
        original_transaction_amount:
          type: number
          description: Amount of the original transaction.
        original_transaction_currency:
          type: string
          description: The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code of the original transaction.
          example: GBP
        original_order_id:
          type: string
          format: uuid
          description: For refunds and chargebacks, the order ID of the original payment that this transaction reverses. Refunds and chargebacks create their own order in the system, so `order_id` refers to the refund or chargeback order while `original_order_id` points back to the original payment's order. For settlement transactions, matches `order_id`.
        original_order_channel:
          type: string
          description: 'Channel through which the original order was created.


            The value depends on the original order source and integration. It may reflect platform-specific or externally provided values, so the set of returned values should not be treated as a fixed enum.'
          example: API
        original_merchant_order_reference:
          type: string
          description: Merchant's order reference for the original order. The value of the `merchant_order_data.reference` field set when the original order was created.
        fee_amount:
          type: number
          description: Total fee amount charged for the transaction.
        fee_currency:
          type: string
          description: The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code of the fee.
          example: GBP
        settlement_amount:
          type: number
          description: Total amount settled on the merchant's account.
        settlement_currency:
          type: string
          description: The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code of the settled amount.
          example: GBP
        location_id:
          type: string
          format: uuid
          description: Unique identifier of the location associated with the transaction.
        location_name:
          type: string
          description: Name of the location associated with the transaction.
        submerchant_id:
          type: string
          format: uuid
          description: Unique identifier of the submerchant associated with the transaction.
        payout_transfer_reference:
          type: string
          description: Reference of the bank transfer for this payout. This value is the same across all rows in the report, as each report covers a single payout.
        payout_total_amount:
          type: number
          description: Total amount of this payout. This value is the same across all rows in the report, as each report covers a single payout.
        payout_date:
          type: string
          format: date-time
          description: Date and time the payout covered by this report was created, in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) UTC date-time format. This value is the same across all rows in the report, as each report covers a single payout.
