    Report-Run-Payments-Report:
      title: Payments report
      type: object
      description: A payments report contains all the query information for generating reports of payments associated with a Merchant account, including failed and declined payments.
      properties:
        filter:
          $ref: '#/components/schemas/Report-Run-Payments-Filter'
        format:
          $ref: '#/components/schemas/Report-Run-Format'
        type:
          $ref: '#/components/schemas/Report-Run-Type'
        options:
          $ref: '#/components/schemas/Report-Run-Payments-Options'
      required:
      - filter
      - format
      - type
    Report-Run-Entity-Types:
      type: array
      items:
        type: string
        enum:
        - payment
        - refund
        - dispute
      description: 'Select source entity families to be included in the report.


        | Value | Description |

        | ----- | ----------- |

        | `payment` | Include rows originating from payment settlement activity. |

        | `refund` | Include rows originating from refund activity. |

        | `dispute` | Include rows originating from dispute and chargeback activity. |


        :::note

        These values are filter input categories. They do not map 1:1 to the CSV `type` output column. For example, a settlement report filtered with `payment`, `refund`, and `dispute` can still return CSV `type` values such as `SETTLEMENT`, `REFUND`, `CHARGEBACK`, and `CHARGEBACK_REVERSAL`.

        :::'
    Report-Run-Payout-Report:
      title: Payout statement report
      type: object
      description: A payout statement report contains all the query information for generating reports of a selected payout associated with a Merchant account.
      properties:
        filter:
          $ref: '#/components/schemas/Report-Run-Payout-Filter'
        format:
          $ref: '#/components/schemas/Report-Run-Format'
        type:
          $ref: '#/components/schemas/Report-Run-Type'
        options:
          $ref: '#/components/schemas/Report-Run-Payout-Options'
      required:
      - filter
      - format
      - type
    Report-Run-Type:
      type: string
      description: "Type of the report.\n\n  | Report type | Description |\n  | -------------- | ----------- |\n  | `settlement_report` | All settled transactions associated with a Merchant account, with a configurable set of columns. |\n  | `custom_report` | Settled and processing transactions associated with a Merchant account, with a configurable set of columns. |\n  | `payments_report` | Payments report provides details of all payments associated with a Merchant account, including failed and declined payments. Supports filtering by `from` and `to` creation timestamps, and optionally by `entity_states`. |\n  | `payout_statement_report`    | Payout statement Reports provide a detailed breakdown of all transactions contributing to a specific payout amount. It requires the additional parameter `filter.payout_id`, which should be obtained from the payout ID retrieved via the [payout list endpoint](https://developer.revolut.com/docs/api/merchant#retrieve-payout-list) or from [webhook events](https://developer.revolut.com/docs/api/merchant#create-webhook#callbacks). |\n  | `icpp_fee_breakdown_report`  | IC++ fee breakdown reports provide a detailed breakdown of fees for each IC++ transaction related to a payout. It requires the additional parameter `filter.icpp_charge_id`, which should be obtained from the `related_icpp_charge_id` column in the Payout statement report. A separate report should be generated for each IC++ transaction. |"
      enum:
      - settlement_report
      - custom_report
      - payments_report
      - payout_statement_report
      - icpp_fee_breakdown_report
      example: settlement_report
    Report-Run:
      title: ReportRunDetails
      type: object
      description: The `ReportRunDetails` object contains all information associated with a specific report run, identified by the `report_run_id`.
      properties:
        report_run_id:
          type: string
          format: uuid
          description: Unique ID used for accessing report details. Use this to check report generation status.
        status:
          type: string
          description: 'Current status of the report run.


            | Value | Description |

            | ----- | ----------- |

            | `processing` | Report generation is still in progress. |

            | `completed` | Report generation finished successfully and the file is available to download for 24 hours via `file_url`. |

            | `failed` | Report generation failed and no report file is available. |

            | `expired` | Report generation previously completed, but the 24-hour file availability window has elapsed and the file can no longer be downloaded. |'
          enum:
          - processing
          - completed
          - failed
          - expired
        file_url:
          type: string
          description: Use this link to download the report file. Available only when `status` is `completed`, and only for 24 hours after report generation finishes.
      required:
      - report_run_id
      - status
    Icpp-Charge-Id:
      type: string
      format: uuid
      description: 'Permanent ID of of the IC++ fee related to a payout transaction.


        This ID can be obtained from the `related_icpp_charge_id` column of a payout statement report.'
    Report-Run-Custom-Report:
      title: Custom report
      type: object
      description: A custom report contains all the query information for generating reports of selected transactions associated with a Merchant account.
      properties:
        filter:
          $ref: '#/components/schemas/Report-Run-Filter'
        format:
          $ref: '#/components/schemas/Report-Run-Format'
        type:
          $ref: '#/components/schemas/Report-Run-Type'
        options:
          $ref: '#/components/schemas/Report-Run-Custom-Options'
      required:
      - filter
      - format
      - type
    Report-Run-Timezone:
      type: string
      description: 'Defaults to `ETC/UTC`. Defines the output timezone for all timestamps displayed in the report.


        Has no effect on `from` or `to` parameters.'
      example: Europe/London
    Report-Run-Currency:
      type: string
      description: 'Select transactions with specific currencies to include in the report. Provide [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code in upper case.


        :::info

        For more information about the supported currencies, see: [Help Center](https://help.revolut.com/business/help/merchant-accounts/payments/in-which-currencies-can-i-accept-payments/).

        :::'
      example: GBP
      minLength: 3
      maxLength: 3
    Report-Run-To:
      type: string
      format: date-time
      description: 'This parameter specifies the end boundary for filtering report data. It accepts ETC/UTC date and time in [ISO 8601 format](https://en.wikipedia.org/wiki/ISO_8601) and includes all matching records before this timestamp (exclusive).


        Combined with the `from` parameter, this determines the timeframe for the report, including all matching records between the two values.


        For example, setting the `to` parameter to `2021-12-31T23:59:59Z` will include all matching records in the report up to, but not including, the last second of December 31, 2021, UTC.'
    Report-Run-Payout-Filter:
      type: object
      description: Filtering parameters to be applied to the report.
      properties:
        payout_id:
          $ref: '#/components/schemas/Payout-Id'
      required:
      - payout_id
    Report-Run-From:
      type: string
      format: date-time
      description: 'This parameter specifies the start boundary for filtering report data. It accepts ETC/UTC date and time in [ISO 8601 format](https://en.wikipedia.org/wiki/ISO_8601) and includes all matching records on or after this timestamp.


        Combined with the `to` parameter, this determines the report''s timeframe, including all matching records between the two values.


        For example, by setting the `from` parameter to `2021-01-01T00:00:00Z`, the report will include matching records from the first second of January 1, 2021, UTC, and onwards.'
    Report-Run-Payments-Options:
      type: object
      description: Further options to customise the report.
      properties:
        timezone:
          $ref: '#/components/schemas/Report-Run-Timezone'
        columns:
          type: array
          items:
            type: string
            enum:
            - payment_id
            - type
            - description
            - original_payment_id
            - order_id
            - state
            - reason
            - amount
            - currency
            - surcharge_amount
            - tip_amount
            - refunded_amount
            - created_date
            - captured_date
            - merchant_order_ext_ref
            - payment_method
            - location_id
            - customer_id
            - customer_card_number
            - customer_card_country
            - customer_card_brand
            - customer_card_type
            - customer_card_category
            - customer_email
            - fee_amount
            - fee_currency
          description: "Names of the columns to be included in the report.\n\nIf the `columns` parameter is not defined in the request, all available columns will be included in the report. An empty array will return an error.\n\nAvailable columns:\n\n  | Column name | Description |\n  | ----------- | ----------- |\n  | `payment_id` | Unique identifier of the payment. |\n  | `type` | Category of the payment row, indicating whether the row represents a payment attempt or a refund. For the full list of returned values, see [Download report file](https://developer.revolut.com/docs/api/merchant#download-report-file). |\n  | `description` | Description of the payment. |\n  | `original_payment_id` | For refunds, the unique identifier of the original payment. |\n  | `order_id` | Unique identifier of the order associated with the payment. |\n  | `state` | Lifecycle state of the payment. For the full list of returned values, see [Download report file](https://developer.revolut.com/docs/api/merchant#download-report-file). |\n  | `reason` | Reason for a failed or declined payment, for example: `Insufficient Funds`. |\n  | `amount` | Total amount of the payment. |\n  | `currency` | The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code of the payment. |\n  | `surcharge_amount` | Surcharge amount applied to the payment, if any. |\n  | `tip_amount` | Tip amount included in the payment, if any. |\n  | `refunded_amount` | Amount refunded for the payment. |\n  | `created_date` | Date and time the payment was created. |\n  | `captured_date` | Date and time the payment was captured. Empty when the payment has not been captured. |\n  | `merchant_order_ext_ref` | Merchant's order reference. The value of the `merchant_order_data.reference` field set when the order was created. |\n  | `payment_method` | Payment method used, for example: `CARD` or `PAY_WITH_REVOLUT`. |\n  | `location_id` | Unique identifier of the location where the payment was made. |\n  | `customer_id` | Unique identifier of the customer. |\n  | `customer_card_number` | Masked card number used for the payment. |\n  | `customer_card_country` | Country of the card used for the payment, as an [ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) code. |\n  | `customer_card_brand` | Card brand used for the payment, for example: `VISA` or `MASTERCARD_DEBIT`. |\n  | `customer_card_type` | Card funding type of the card used for the payment. For the full list of returned values, see [Download report file](https://developer.revolut.com/docs/api/merchant#download-report-file). |\n  | `customer_card_category` | Card commercial category. Values: `consumer` (personal card) and `commercial` (business or corporate card). |\n  | `customer_email` | Email address of the customer. |\n  | `fee_amount` | Total fee amount charged for the payment. |\n  | `fee_currency` | The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code of the fee. |"
          example:
          - payment_id
          - type
          - state
          - amount
          - currency
    Report-Run-Entity-States:
      type: array
      items:
        type: string
        enum:
        - completed
        - processing
        - cancelled
        - reverted
      description: 'Select transactions by state to be included in the report.


        | Value | Description |

        | ----- | ----------- |

        | `completed` | Include transactions that reached their final successful state. |

        | `processing` | Include transactions that are still being processed. |

        | `cancelled` | Include transactions that were cancelled before final completion. |

        | `reverted` | Include transactions that were reversed after initial creation. |


        If not provided, only `completed` transactions will be included in the report.'
    Report-Run-Csv-Settlement:
      title: Settlement report CSV
      type: object
      description: 'CSV output for `settlement_report`. Contains settled transactions associated with a Merchant account.


        The first row is a header row with column names. Subsequent rows contain transaction data, one row per transaction.


        A partial-settlement is represented by separate `SETTLEMENT` and `REFUND` rows instead of a dedicated type.


        :::note

        The actual response is a raw `text/csv` string. The object schema below is a documentation convention only: OpenAPI''s schema language (JSON Schema) describes JSON data shapes and has no native construct for typed CSV columns, so each property here corresponds to a CSV column header rather than a JSON field.

        :::'
      properties:
        transaction_id:
          type: string
          format: uuid
          description: Unique identifier of the ledger transaction in the core settlement system. Matches `transaction_id` in the payout statement report for the same event. Not the same as `payment_id` in the payments report — a payment and its resulting ledger transaction have different UUIDs. Use `order_id` to cross-reference with the payments report.
        order_id:
          type: string
          format: uuid
          description: Unique identifier of the order. An order is the top-level entity that groups one or more payment attempts against it. `order_id` is consistent across all report types and can be used to cross-reference between the payments report and the settlement or payout reports.
        original_order_id:
          type: string
          format: uuid
          description: For refunds and chargebacks, the order ID of the original payment that this transaction reverses. Refunds and chargebacks create their own order in the system, so `order_id` refers to the refund or chargeback order while `original_order_id` points back to the original payment's order. For settlement transactions, matches `order_id`.
        started_date:
          type: string
          format: date-time
          description: Date and time the row's source record was started. For payment rows, this is the payment start timestamp. For non-payment rows such as refunds and chargebacks, this is the transaction start timestamp. This displayed value is separate from the report filter timeframe.
        updated_date:
          type: string
          format: date-time
          description: Date and time the row's source record was last updated. For payment rows, this is the payment update timestamp. For non-payment rows such as refunds and chargebacks, this is the transaction update timestamp. This displayed value is separate from the report filter timeframe.
        completed_date:
          type: string
          format: date-time
          description: Date and time the row's source record was completed. For payment rows, this is the payment completion timestamp. For non-payment rows such as refunds and chargebacks, this is the transaction completion timestamp. This displayed value is separate from the report filter timeframe.
        payment_created_date:
          type: string
          format: date-time
          description: Payment authorisation or creation timestamp for rows linked to a payment, in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) UTC date-time format. Empty for refunds and non-payment-related rows where no payment timestamp applies. This displayed value is separate from the report filter timeframe.
        payment_captured_date:
          type: string
          format: date-time
          description: Payment capture timestamp for rows linked to a captured payment, in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) UTC date-time format. Empty for refunds, non-payment-related rows, or payments not captured. This displayed value is separate from the report filter timeframe.
        type:
          type: string
          description: 'Type of the settlement report row.


            A partial-settlement is represented by separate `SETTLEMENT` and `REFUND` rows instead of a dedicated type.


            | Value | Description |

            | ----- | ----------- |

            | `SETTLEMENT` | Settlement of a payment into the merchant balance. |

            | `REFUND` | Refund entry reducing the merchant balance. |

            | `CHARGEBACK` | Dispute withdrawal entry reducing the merchant balance. |

            | `CHARGEBACK_REVERSAL` | Reversal of a previous chargeback, restoring funds to the merchant balance. |'
          enum:
          - SETTLEMENT
          - REFUND
          - CHARGEBACK
          - CHARGEBACK_REVERSAL
        state:
          type: string
          description: State of the transaction.
        description:
          type: string
          description: Description of the order.
        merchant_order_ext_ref:
          type: string
          description: Merchant's order reference. The value of the `merchant_order_data.reference` field set when the order was created.
        customer_id:
          type: string
          format: uuid
          description: Unique identifier of the customer related to an order.
        amount:
          type: number
          description: Total amount of the order.
        currency:
          type: string
          description: The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code that represents the currency of the order.
          example: GBP
        settlement_amount:
          type: number
          description: Total amount settled on the merchant's account.
        settlement_currency:
          type: string
          description: The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code that represents the currency of the settled amount.
          example: GBP
        payment_method:
          type: string
          description: Type of the payment method the customer used to pay for the order.
          example: CARD
        fee_amount:
          type: number
          description: Total fee amount applied to the order, aggregated across all fee components (acquiring markup + interchange + scheme fees).
        fee_currency:
          type: string
          description: The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code that represents the currency of the total fee.
          example: GBP
        processing_fee_amount:
          type: number
          description: Acquiring markup fee only — a subset of `fee_amount`. Represents Revolut's service fee, excluding interchange and scheme fees.
        processing_fee_currency:
          type: string
          description: The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code that represents the currency of the acquiring markup fee.
          example: GBP
        browser_url:
          type: string
          format: uri
          description: The URL where the customer initiated the payment.
        location_id:
          type: string
          format: uuid
          description: Unique identifier of the location related to the transaction.
    Report-Run-Payout-Options:
      type: object
      description: Further options to customise the report.
      properties:
        timezone:
