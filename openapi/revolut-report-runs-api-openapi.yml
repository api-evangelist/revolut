        tip_amount:
          type: number
          description: Tip amount included in the transaction.
        surcharge_amount:
          type: number
          description: Surcharge amount applied to the transaction. Omitted when no surcharge applies.
        order_surcharge_amount:
          type: number
          description: Surcharge amount set at the order level.
        terminal_hardware_id:
          type: string
          description: Identifier of the card reader hardware used, for in-person payments.
        customer_name:
          type: string
          description: Name of the customer.
        customer_email:
          type: string
          format: email
          description: Email address of the customer.
        customer_card_number:
          type: string
          description: Masked card number used for the payment.
          example: 492942******5709
        customer_card_brand:
          type: string
          description: Card brand used for the payment. Derived from BIN data. Example values include `VISA`, `MASTERCARD`, `MASTERCARD_DEBIT`, `MAESTRO`, `AMEX`, `DINERS`, `DISCOVER`, `JCB`.
          example: VISA
        customer_card_type:
          type: string
          description: 'Card funding type.


            | Value | Description |

            | ----- | ----------- |

            | `DEBIT` | Debit card. |

            | `CREDIT` | Credit card. |

            | `PREPAID` | Prepaid card. |

            | `DEFERRED_DEBIT` | Deferred debit card. |

            | `CHARGE` | Charge card. |'
          enum:
          - DEBIT
          - CREDIT
          - PREPAID
          - DEFERRED_DEBIT
          - CHARGE
        customer_card_category:
          type: string
          description: 'Card commercial category.


            | Value | Description |

            | ----- | ----------- |

            | `consumer` | Personal card. |

            | `commercial` | Business or corporate card. |'
          enum:
          - consumer
          - commercial
        payment_method:
          type: string
          description: Payment method the customer used to pay for the order.
          example: CARD
        fee_amount:
          type: number
          description: Total fee amount applied to the order, aggregated across all fee components (acquiring markup + interchange + scheme fees).
        fee_currency:
          type: string
          description: The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code of the total fee.
          example: GBP
        processing_fee_amount:
          type: number
          description: Acquiring markup fee only — a subset of `fee_amount`. Represents Revolut's service fee, excluding interchange and scheme fees.
        processing_fee_currency:
          type: string
          description: The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code of the acquiring markup fee.
          example: GBP
        fx_fee_amount:
          type: number
          description: Foreign exchange fee amount, if applicable.
        fx_fee_currency:
          type: string
          description: The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code of the FX fee.
          example: GBP
        browser_url:
          type: string
          format: uri
          description: The URL where the customer initiated the payment.
        beneficiary_name:
          type: string
          description: Name of the beneficiary, for bank transfer payments.
        beneficiary_account_number:
          type: string
          description: Account number of the beneficiary, for bank transfer payments.
        location_id:
          type: string
          format: uuid
          description: Unique identifier of the location related to the transaction.
        location_name:
          type: string
          description: Name of the location related to the transaction.
        order_custom_field_name:
          type: string
          description: Name of a custom field set on the order.
        order_custom_field_value:
          type: string
          description: Value of a custom field set on the order.
        offline_payment_state:
          type: string
          description: State of an offline payment, if applicable.
        order_authorisation_type:
          type: string
          description: Authorisation type of the order, for example `FULL` or `PRE_AUTH`.
    Report-Run-Format:
      type: string
      enum:
      - csv
      description: Format of the generated report file.
      example: csv
    Report-Run-Payments-Entity-States:
      type: array
      items:
        type: string
        enum:
        - completed
        - failed
        - declined
        - cancelled
      description: 'Select payments by state to be included in the report.


        | Value | Description |

        | ----- | ----------- |

        | `completed` | Include payments that completed successfully. |

        | `failed` | Include payments that failed during processing. |

        | `declined` | Include payments rejected by the issuer or payment flow. |

        | `cancelled` | Include payments cancelled before completion. |


        If not provided, payments in all states will be included in the report.'
    Report-Run-Location-Id:
      type: string
      format: uuid
      description: 'Select transactions by location ID to be included in the report.


        :::info

        For more information, see: [Locations](https://developer.revolut.com/docs/api/merchant#tag-locations).

        :::        '
    Error-v2:
      title: Error
      type: object
      properties:
        code:
          type: string
          description: 'An identifier that can be used to determine what went wrong.


            Error codes are not globally unique, but uniqueness is guaranteed within endpoints.'
        message:
          type: string
          description: Some human readable text describing what went wrong.
        timestamp:
          type: integer
          description: The [UNIX timestamp](https://www.unixtimestamp.com/) of the date and time the error happened.
    Report-Run-Payments-Filter:
      type: object
      description: 'Filtering parameters to be applied to the report.


        :::note

        For `payments_report`, `from` and `to` are evaluated against the payment `created_date`. The `captured_date` column is returned data and does not change the filter key.

        :::'
      properties:
        from:
          $ref: '#/components/schemas/Report-Run-From'
        to:
          $ref: '#/components/schemas/Report-Run-To'
        entity_states:
          $ref: '#/components/schemas/Report-Run-Payments-Entity-States'
      required:
      - from
      - to
    Report-Run-Csv-Payments:
      title: Payments report CSV
      type: object
      description: 'CSV output for `payments_report` report type. Contains all payments including failed and declined ones.


        The first row is a header row with column names. Subsequent rows contain payment data, one row per payment.


        For failed and declined payments, `fee_amount` and `fee_currency` are omitted. For payments made without a card, card-related columns are omitted.


        :::note

        The actual response is a raw `text/csv` string. The object schema below is a documentation convention only: OpenAPI''s schema language (JSON Schema) describes JSON data shapes and has no native construct for typed CSV columns, so each property here corresponds to a CSV column header rather than a JSON field.

        :::'
      properties:
        payment_id:
          type: string
          format: uuid
          description: Unique identifier of the payment attempt in the acquiring system. Corresponds to `id` in the IC++ fee breakdown report for the same payment. Not the same as `transaction_id` in the settlement or payout reports — a payment and its resulting ledger transaction have different UUIDs. Use `order_id` to cross-reference with the settlement or payout reports.
        type:
          type: string
          description: 'Type of the payment.


            | Value | Description |

            | ----- | ----------- |

            | `PAYMENT` | A payment attempt made against the order. |

            | `REFUND` | A refund record reversing a previously completed payment. |'
          enum:
          - PAYMENT
          - REFUND
        description:
          type: string
          description: Description of the payment.
        original_payment_id:
          type: string
          format: uuid
          description: For refunds, the acquiring ID of the original payment that this record reverses. Corresponds to `payment_id` on the original payment row. Populated only when `type` is `REFUND`.
        order_id:
          type: string
          format: uuid
          description: Unique identifier of the order associated with this payment. An order can have multiple payment attempts — for example, a retry after a declined payment. Use `order_id` to cross-reference with the settlement or payout reports.
        state:
          type: string
          description: 'State of the payment.


            | Value | Description |

            | ----- | ----------- |

            | `COMPLETED` | The payment completed successfully. |

            | `FAILED` | The payment failed during processing. |

            | `DECLINED` | The payment was rejected by the issuer or payment flow. |

            | `CANCELLED` | The payment was cancelled before completion. |

            | `PROCESSING` | The payment is still being processed. |'
          enum:
          - COMPLETED
          - FAILED
          - DECLINED
          - CANCELLED
          - PROCESSING
        reason:
          type: string
          description: 'Reason code for a failed or declined payment. Present only when `state` is `FAILED` or `DECLINED`.


            Example values: `INSUFFICIENT_FUNDS`, `DO_NOT_HONOUR`, `EXPIRED_CARD`, `INVALID_CVV`, `THREE_DS_CHALLENGE_FAILED`, `SUSPECTED_FRAUD`, `LOST_CARD`, `STOLEN_CARD`, `TECHNICAL_ERROR`.'
        amount:
          type: number
          description: Total amount of the payment.
        currency:
          type: string
          description: The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code of the payment.
          example: GBP
        surcharge_amount:
          type: number
          description: Surcharge amount applied to the payment. Empty when no surcharge applies — this field is empty, not set to `0`.
        tip_amount:
          type: number
          description: Tip amount included in the payment, if any.
        refunded_amount:
          type: number
          description: Amount refunded for the payment.
        created_date:
          type: string
          format: date-time
          description: Date and time the payment was created.
        captured_date:
          type: string
          format: date-time
          description: Date and time the payment was captured, in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) UTC date-time format. Empty when the payment has not been captured.
        merchant_order_ext_ref:
          type: string
          description: Merchant's order reference. The value of the `merchant_order_data.reference` field set when the order was created.
        payment_method:
          type: string
          description: Payment method used.
          example: CARD
        location_id:
          type: string
          format: uuid
          description: Unique identifier of the location where the payment was made.
        customer_id:
          type: string
          format: uuid
          description: Unique identifier of the customer.
        customer_card_number:
          type: string
          description: Masked card number used for the payment.
          example: 492942******5709
        customer_card_country:
          type: string
          description: Country of the card used for the payment, as an [ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) code.
          example: GB
        customer_card_brand:
          type: string
          description: Card brand used for the payment. Derived from BIN data. Example values include `VISA`, `MASTERCARD`, `MASTERCARD_DEBIT`, `MAESTRO`, `AMEX`, `DINERS`, `DISCOVER`, `JCB`.
          example: VISA
        customer_card_type:
          type: string
          description: 'Card funding type.


            | Value | Description |

            | ----- | ----------- |

            | `DEBIT` | Debit card. |

            | `CREDIT` | Credit card. |

            | `PREPAID` | Prepaid card. |

            | `DEFERRED_DEBIT` | Deferred debit card. |

            | `CHARGE` | Charge card. |'
          enum:
          - DEBIT
          - CREDIT
          - PREPAID
          - DEFERRED_DEBIT
          - CHARGE
        customer_card_category:
          type: string
          description: 'Card commercial category.


            | Value | Description |

            | ----- | ----------- |

            | `consumer` | Personal card. |

            | `commercial` | Business or corporate card. |'
          enum:
          - consumer
          - commercial
        customer_email:
          type: string
          format: email
          description: Email address of the customer.
        fee_amount:
          type: number
          description: Total fee amount charged for the payment. Omitted for failed and declined payments.
        fee_currency:
          type: string
          description: The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code of the fee. Omitted for failed and declined payments.
          example: GBP
    Report-Run-Icpp-Report:
      title: IC++ fee breakdown report
      type: object
      description: A IC++ fee breakdown report contains all the query information for generating reports of fees for each IC++ transaction related to a payout.
      properties:
        filter:
          $ref: '#/components/schemas/Report-Run-Icpp-Filter'
        format:
          $ref: '#/components/schemas/Report-Run-Format'
        type:
          $ref: '#/components/schemas/Report-Run-Type'
        options:
          $ref: '#/components/schemas/Report-Run-Icpp-Options'
      required:
      - filter
      - format
      - type
    Report-Run-Settlement-Report:
      title: Settlement report
      type: object
      description: A settlement report contains all the query information for generating reports of settled transactions associated with a Merchant account.
      properties:
        filter:
          $ref: '#/components/schemas/Report-Run-Filter'
        format:
          $ref: '#/components/schemas/Report-Run-Format'
        type:
          $ref: '#/components/schemas/Report-Run-Type'
        options:
          $ref: '#/components/schemas/Report-Run-Settlement-Options'
      required:
      - filter
      - format
      - type
    Report-Run-Settlement-Options:
      type: object
      description: Further options to customise the report.
      properties:
        timezone:
          $ref: '#/components/schemas/Report-Run-Timezone'
        columns:
          type: array
          items:
            type: string
            enum:
            - transaction_id
            - order_id
            - original_order_id
            - started_date
            - updated_date
            - completed_date
            - payment_created_date
            - payment_captured_date
            - type
            - state
            - description
            - merchant_order_ext_ref
            - customer_id
            - amount
            - currency
            - settlement_amount
            - settlement_currency
            - payment_method
            - fee_amount
            - fee_currency
            - processing_fee_amount
            - processing_fee_currency
            - browser_url
            - location_id
          description: "Names of the columns to be included in the report.\n\nIf the `columns` parameter is not defined in the request, all available columns will be included in the report. An empty array will return an error.\n\nAvailable columns:\n\n  | Column name | Description |\n  | ----------- | ----------- |\n  | `transaction_id` | Unique identifier of the ledger transaction related to an order. |\n  | `order_id` | Unique identifier of the order. |\n  | `original_order_id` | Unique identifier of the original order. For refunds and chargebacks, references the order being reversed. |\n  | `started_date` | Start timestamp shown on the row. For payment rows, this is the payment start timestamp. For non-payment rows such as refunds and chargebacks, this is the transaction start timestamp. Separate from the report filter timeframe. |\n  | `updated_date` | Last update timestamp shown on the row. For payment rows, this is the payment update timestamp. For non-payment rows such as refunds and chargebacks, this is the transaction update timestamp. Separate from the report filter timeframe. |\n  | `completed_date` | Completion timestamp shown on the row. For payment rows, this is the payment completion timestamp. For non-payment rows such as refunds and chargebacks, this is the transaction completion timestamp. Separate from the report filter timeframe. |\n  | `payment_created_date` | Payment authorisation or creation timestamp for rows linked to a payment. Empty for refunds and non-payment-related rows where no payment timestamp applies. This is returned data, not the report filter key. |\n  | `payment_captured_date` | Payment capture timestamp for rows linked to a captured payment. Empty for refunds, non-payment-related rows, or payments not captured. This is returned data, not the report filter key. |\n  | `type` | Settlement report row type. A partial-settlement is represented by separate `SETTLEMENT` and `REFUND` rows, not a dedicated type. |\n  | `state` | State of the transaction. |\n  | `description` | Description of the order. |\n  | `merchant_order_ext_ref` | Merchant's order reference. The value of the `merchant_order_data.reference` field set when the order was created. |\n  | `customer_id` | Unique identifier of the customer. |\n  | `amount` | Total amount of the order. |\n  | `currency` | The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code of the order. |\n  | `settlement_amount` | Total amount settled on the merchant's account. |\n  | `settlement_currency` | The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code of the settled amount. |\n  | `payment_method` | Type of the payment method the customer used to pay for the order. |\n  | `fee_amount` | Total fee amount applied to the order, aggregated across all fee components (acquiring markup + interchange + scheme fees). |\n  | `fee_currency` | The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code of the total fee. |\n  | `processing_fee_amount` | Acquiring markup fee only — a subset of `fee_amount`. Represents Revolut's service fee, excluding interchange and scheme fees. |\n  | `processing_fee_currency` | The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code of the acquiring markup fee. |\n  | `browser_url` | The URL where the customer initiated the payment. |\n  | `location_id` | Unique identifier of the location related to the transaction. |"
          example:
          - transaction_id
          - type
          - amount
          - currency
          - settlement_amount
          - settlement_currency
  parameters:
    Authorization:
      name: Authorization
      in: header
      schema:
        type: string
        format: Bearer <yourSecretApiKey>
        example: Bearer sk_1234567890ABCdefGHIjklMNOpqrSTUvwxYZ_1234567890-Ab_cdeFGHijkLMNopq
      required: true
      description: "This parameter accepts the [Merchant API Secret key](https://business.revolut.com/settings/apis?tab=merchant-api) to authorise requests coming from the merchant's backend. \n\nIt ensures that ensures that each request is authenticated and authorised by verifying the secret key. The secret key should be included in all request headers as a `Bearer` token.\n\n:::info\nFor more information, see: [Authentication](https://developer.revolut.com/docs/api/merchant#authentication)\n:::"
    Report-Run-Id:
      name: report_run_id
      in: path
      schema:
        type: string
        format: uuid
        description: A UUID string, typically used to identify resources.
      required: true
      description: Unique ID of the report run.
  securitySchemes:
    Api-Key:
      type: apiKey
      in: header
      name: Authorization
      description: 'Each Merchant API request must contain an authorization header in the following format:


        ```

        ''Authorization: Bearer <yourSecretApiKey>''

        ```


        To use this API, you need to generate API keys from your Revolut Business account. The Secret key is used in the authorization header for all server calls, while the Public key is provided with payment methods at checkout.


        :::info

        For detailed instructions on generating your API keys, see: [Generate API keys](https://developer.revolut.com/docs/guides/merchant/get-started#generate-api-keys).

        :::'
