        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        description: 'New contacts for the card.

          :::warning

          This will **override** the existing list of contacts.

          :::'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardContacts'
            examples:
