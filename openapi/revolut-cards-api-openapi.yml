                    description: The card expiration date.
                    format: DD/MMMM
                    pattern: ^[0-9]{2}/[0-9]{4}$
                required:
                - pan
                - cvv
                - expiry
              example:
                pan: '4111111111111111'
                cvv: '123'
                expiry: 06/2030
        '400':
          description: 'Bad request


            Returned, for example, when you provide an invalid card ID in the path.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_id:
                  $ref: '#/components/examples/cardErrorBadId'
        '403':
          description: Action forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 9002
                message: This action is forbidden
        '404':
          description: Card doesn't exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 1214
                message: Card not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    CardState:
      enum:
      - created
      - pending
      - active
      - frozen
      - locked
      description: "The state that the card is in.\n\nPossible values:\n- `active`: The card is available for spending. \n  Newly created cards typically go into `active` unless subject to certain conditions, for example, spending period starting in the future.\n- `frozen`: The card has been frozen and is temporarily unavailable for spending. \n- `locked`: The card is locked, typically due to an [admin lock](https://developer.revolut.com/docs/api/business#lock-card) or spending period settings, i.e. when its `spending_period.start_date` is in the future or `spending_period.end_date` is in the past.\n  A locked card is unavailable for spending until it's [unlocked](https://developer.revolut.com/docs/api/business#unlock-card) and active.\n  :::tip\n  To see if the card can be unlocked, check the `can_be_unlocked` parameter.\n  Note that you'll still need the [necessary scope or permission](https://developer.revolut.com/docs/guides/manage-accounts/cards/manage-cards#lock-or-unlock-cards) to unlock it.\n  :::\n- `created`: The card has been created but is not yet active.\n  Used only for a specific type of cards.\n- `pending`: This status is currently not in use."
      type: string
    TransactionLimitCurrency:
      type: string
      pattern: ^[A-Z]{3}$
      description: The currency of the spending limit, provided as [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) code in upper case.
    CardProduct:
      description: 'The card product offered by the card provider for this card.

        In other words, the program that the card was issued under.


        :::note

        This property is only available to travel intermediaries using our travel solution.

        To use it, please contact [Revolut API Support](mailto:api-requests@revolut.com).

        :::'
      type: object
      properties:
        code:
          type: string
          description: The code of the card product.
      required:
      - code
    CardReference:
      description: "Reference for the card.\nOne of the name-value pairs assigned to the card for tracking.\n\n:::info\nEach time the card is used, the references are recorded in the [transaction details](https://developer.revolut.com/docs/api/business#get-transaction#response) (`card.references`), helping track transactions made with this card.\n:::\n\nThe names must be unique.\nThe references can be [amended](https://developer.revolut.com/docs/api/business#update-card-references) up to 10 times.\nReferences are only supported for cards owned by the business (i.e. [company](https://developer.revolut.com/docs/guides/manage-accounts/cards/manage-cards#different-types-of-cards) or [auto-issued cards](https://developer.revolut.com/docs/guides/manage-accounts/cards/manage-cards#different-types-of-cards)).\nThey are **not** supported for [team member cards](https://developer.revolut.com/docs/guides/manage-accounts/cards/manage-cards#different-types-of-cards) (i.e. with `holder_id` present). \n\n:::note\nThe references recorded on a transaction are those assigned to the card at the time the transaction took place.\nIf the references are amended, the new references are only applied to future transactions.\nExisting transaction are not affected.\n:::"
      type: object
      required:
      - name
      - value
      properties:
        name:
          description: 'The name of the card reference.

            Must be unique.'
          type: string
          minLength: 1
          maxLength: 30
        value:
          description: The value for this reference.
          type: string
          minLength: 1
          maxLength: 30
      example:
        name: PNR
        value: RT12345
    CardResponse:
      type: object
      properties:
        id:
          type: string
          description: The ID of the card.
          format: uuid
        holder_id:
          type: string
          description: 'The ID of the team member who is the holder of the card.

            If the card belongs to the business, this will be empty.


            For more information, see the guides: [Manage Cards - Create a virtual card](https://developer.revolut.com/docs/guides/manage-accounts/cards/manage-cards#create-a-virtual-card).'
          format: uuid
        contact_ids:
          $ref: '#/components/schemas/CardContacts'
        created_at:
          type: string
          description: The date and time the card was created in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
          format: date-time
        updated_at:
          type: string
          description: The date and time the card was last updated in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
          format: date-time
        product:
          $ref: '#/components/schemas/CardProduct'
        virtual:
          type: boolean
          description: Specifies whether the card is virtual (`true`) or physical (`false`).
        last_digits:
          type: string
          description: The last 4 digits of the card's PAN.
          pattern: ^[0-9]{4}$
        expiry:
          type: string
          format: DD/YYYY
          description: The card expiration date.
          pattern: ^[0-9]{2}/[0-9]{4}$
        label:
          type: string
          description: The label of the card.
        references:
          $ref: '#/components/schemas/CardReferences'
        state:
          $ref: '#/components/schemas/CardState'
        can_be_unlocked:
          $ref: '#/components/schemas/CardCanBeUnlocked'
        spend_program:
          $ref: '#/components/schemas/SpendProgram'
        spending_limits:
          $ref: '#/components/schemas/SpendingLimitsSchema'
        spending_period:
          description: 'The controls for the card''s spending period.


            They specify the dates when the card becomes available or unavailable for spending, and define what happens after the end date.'
          type: object
          allOf:
          - $ref: '#/components/schemas/SpendingPeriodSchema'
        categories:
          type: array
          description: The list of merchant categories that are available for card spending. If not specified, categories are not restricted.
          items:
            $ref: '#/components/schemas/BusinessMerchantCategory'
        merchant_controls:
          description: "The merchant-level controls for card spending.\n\nThey block or allow the card to only transact with specific merchants: \n- `allow`: permits only the specified merchants (cannot be used if the `categories` parameter is set)\n- `block`: blocks the specified merchants (can be used with or without `categories`)"
          type: object
          $ref: '#/components/schemas/MerchantControlsSchema'
        countries:
          description: The list of countries where the card can be used, specified as 2-letter [ISO 3166](https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes) codes.
          type: array
          items:
            type: string
            pattern: ^[A-Z]{2}$
            example: GB
        accounts:
          type: array
          description: The list of linked accounts.
          items:
            type: string
            format: uuid
      required:
      - id
      - created_at
      - updated_at
      - virtual
      - last_digits
      - expiry
      - state
      - accounts
    CardReferences:
      description: 'References for the card.

        Up to 5 name-value pairs assigned to the card for tracking.


        :::info

        Each time the card is used, the references are recorded in the [transaction details](https://developer.revolut.com/docs/api/business#get-transaction#response) (`card.references`), helping track transactions made with this card.

        :::


        The names must be unique.

        The references can be [amended](https://developer.revolut.com/docs/api/business#update-card-references) up to 10 times.


        References are only supported for cards owned by the business (i.e. [company](https://developer.revolut.com/docs/guides/manage-accounts/cards/manage-cards#different-types-of-cards) or [auto-issued cards](https://developer.revolut.com/docs/guides/manage-accounts/cards/manage-cards#different-types-of-cards)).

        They are **not** supported for [team member cards](https://developer.revolut.com/docs/guides/manage-accounts/cards/manage-cards#different-types-of-cards) (i.e. with `holder_id` present).


        :::note

        The references recorded on a transaction are those assigned to the card at the time the transaction took place.

        If the references are amended, they will only be applied to future transactions.

        Existing transaction are not affected.

        :::'
      type: array
      minItems: 1
      maxItems: 5
      uniqueItems: true
      items:
        $ref: '#/components/schemas/CardReference'
      example:
      - name: PNR
        value: RT12345
      - name: Traveller
        value: John Smith
    CardContacts:
      description: The list of contacts for a [company card](https://developer.revolut.com/docs/guides/manage-accounts/cards/manage-cards#different-types-of-cards).
      type: array
      minItems: 1
      maxItems: 5
      uniqueItems: true
      items:
        $ref: '#/components/schemas/CardContact'
    SpendingLimitPeriodic:
      type: object
      description: The limit for transactions within a given period.
      properties:
        amount:
          type: number
          format: double
          description: The value of the spending limit.
        currency:
          $ref: '#/components/schemas/TransactionLimitCurrency'
      required:
      - amount
      - currency
    MerchantControlsSchema:
      type: object
      required:
      - control_type
      - merchant_ids
      properties:
        control_type:
          type: string
          enum:
          - block
          - allow
          description: The type of control to apply.
        merchant_ids:
          type: array
          minItems: 1
          maxItems: 20
          description: 'The list of IDs of merchants to which the control applies.


            :::tip

            To find merchant IDs, check transaction details (→ `merchant.id`).

            You can fetch transaction details for a [specific transaction](https://developer.revolut.com/docs/api/business#get-transaction#response) or for [all transactions](https://developer.revolut.com/docs/api/business#get-transactions#response).

            :::'
          items:
            type: string
            format: uuid
    SpendingPeriodSchema:
      type: object
      properties:
        start_date:
          type: string
          format: date
          description: 'The start date (inclusive) of the spending period, in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format (`YYYY-MM-DD`).

            Uses the [timezone set by the business](https://business.revolut.com/settings/appearance), or defaults to `Europe/London`.'
          example: '2025-09-26'
        end_date:
          type: string
          format: date
          description: 'The end date (inclusive) of the spending period, in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format (`YYYY-MM-DD`).

            Uses the [timezone set by the business](https://business.revolut.com/settings/appearance), or defaults to `Europe/London`.'
          example: '2030-12-31'
        end_date_action:
          type: string
          enum:
          - lock
          - terminate
          description: The action to take after the end date of the spending period.
      anyOf:
      - required:
        - start_date
      - required:
        - end_date
        - end_date_action
    CardsResponse:
      type: array
      items:
        $ref: '#/components/schemas/CardResponse'
      description: A list of cards.
    SpendingLimitsSchema:
      type: object
      properties:
        single:
          description: The limit for a single transaction.
          $ref: '#/components/schemas/SpendingLimitSingleTransaction'
        day:
          description: The daily limit for transactions.
          $ref: '#/components/schemas/SpendingLimitPeriodic'
        week:
          description: The weekly limit for transactions.
          $ref: '#/components/schemas/SpendingLimitPeriodic'
        month:
          description: The monthly limit for transactions.
          $ref: '#/components/schemas/SpendingLimitPeriodic'
        quarter:
          description: The quarterly limit for transactions.
          $ref: '#/components/schemas/SpendingLimitPeriodic'
        year:
          description: The yearly limit for transactions.
          $ref: '#/components/schemas/SpendingLimitPeriodic'
        all_time:
          description: The all-time limit for transactions.
          $ref: '#/components/schemas/SpendingLimitPeriodic'
      example:
        single:
          amount: 200.22
          currency: GBP
        week:
          amount: 200.44
          currency: GBP
    SpendProgram:
      description: 'The [spend program](https://help.revolut.com/business/help/making-paymentsbusiness/spend-controls/setting-card-presets-for-my-team-members/) assigned to the card.

        :::note

        To use this property, please contact [Revolut API Support](mailto:api-requests@revolut.com).

        :::'
      type: object
      readOnly: true
      properties:
        label:
          description: The name of the spend program.
          type: string
          maxLength: 30
      required:
      - label
    Error:
      type: object
      properties:
        code:
          type: integer
          description: The error code.
        message:
          type: string
          description: The description of the error.
      required:
      - code
      - message
    SpendingLimitSingleTransaction:
      type: object
      description: The limit for a single transaction.
      properties:
        amount:
          type: number
          format: double
          description: The value of the spending limit.
        currency:
          $ref: '#/components/schemas/TransactionLimitCurrency'
      required:
      - amount
      - currency
    CardCreatedResponse:
      type: object
      properties:
        id:
          type: string
          description: The ID of the card.
          format: uuid
        holder_id:
          type: string
          description: 'The ID of the team member who is the holder of the card.

            If the card belongs to the business, this will be empty.


            For more information, see the guides: [Manage Cards - Create a virtual card](https://developer.revolut.com/docs/guides/manage-accounts/cards/manage-cards#create-a-virtual-card).'
          format: uuid
        contact_ids:
          $ref: '#/components/schemas/CardContacts'
        created_at:
          type: string
          description: The date and time the card was created in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
          format: date-time
        updated_at:
          type: string
          description: The date and time the card was last updated in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
          format: date-time
        product:
          $ref: '#/components/schemas/CardProduct'
        virtual:
          type: boolean
