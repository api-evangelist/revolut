  /counterparties/{counterparty_id}/payment-methods/{payment_method_id}:
    patch:
      summary: Update a counterparty's payment method
      operationId: updateCounterpartyPaymentMethod
      description: 'Update the **address** of a counterparty''s payment method.


        :::tip [What is a payment method?]

        A payment method is an individual account or card linked to a counterparty. When you [retrieve a counterparty](https://developer.revolut.com/docs/api/business#get-counterparty), the response includes an `accounts` array and a `cards` array — each entry in these arrays is a payment method with its own `id`.

        :::


        As only bank account payment methods have an address, you can use this endpoint to update the address of a counterparty''s bank account.


        To get the `payment_method_id` for the bank account, [retrieve the counterparty](https://developer.revolut.com/docs/api/business#get-counterparty) and use the `id` from the `accounts` array in the response.


        You must provide the full address object — all required address fields must be present in the request.

        Omitted optional fields will retain their existing values.


        For more information, see the guide: [Update a counterparty''s payment method](https://developer.revolut.com/docs/guides/manage-accounts/counterparties/update-counterparty-payment-method).'
      security:
      - AccessToken:
        - WRITE
      parameters:
      - name: counterparty_id
        in: path
        required: true
        description: The ID of the counterparty.
        schema:
          type: string
          format: uuid
      - name: payment_method_id
        in: path
        required: true
        description: The ID of the payment method to update. To get the `payment_method_id` for the bank account, [retrieve the counterparty](https://developer.revolut.com/docs/api/business#get-counterparty) and use the `id` from the `accounts` array in the response.
        schema:
          type: string
          format: uuid
      requestBody:
        description: The updated address details.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCounterpartyPaymentMethodRequest'
            examples:
              update_address:
                summary: Update a counterparty's address
                value:
                  address:
                    country: GB
                    street_line1: 7 Revolut Street
                    street_line2: Floor 3
                    city: London
                    postcode: EC2V 8PH
      responses:
        '204':
          description: The address was updated
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithId'
      tags:
      - Counterparties
components:
  schemas:
    Counterparty:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the counterparty.
        name:
          type: string
          description: The name of the counterparty.
        revtag:
          type: string
          description: The [Revtag](https://help.revolut.com/help/transfers/internal-transfers/username-payments/revtags/) of the counterparty.
        profile_type:
          $ref: '#/components/schemas/ProfileType'
        country:
          $ref: '#/components/schemas/CountryCode'
        state:
          enum:
          - created
          - draft
          - deleted
          description: Indicates the state of the counterparty.
          type: string
        created_at:
          type: string
          format: date-time
          description: The date and time the counterparty was created in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
        updated_at:
          type: string
          format: date-time
          description: The date and time the counterparty was last updated in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
        accounts:
          type: array
          description: The list of public accounts associated with this counterparty.
          items:
            $ref: '#/components/schemas/CounterpartyAccount'
        cards:
          type: array
          description: The list of cards associated with this counterparty.
          items:
            $ref: '#/components/schemas/CounterpartyCard'
      required:
      - id
      - name
      - state
      - created_at
      - updated_at
    CountryCodeCard:
      type: string
      pattern: ^[A-Z]{2}$
      description: The country of the card issuer, provided as a 2-letter [ISO 3166](https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes) code.
    UpdateCounterpartyPaymentMethodRequest:
      type: object
      description: The request body for updating a counterparty's payment method address.
      required:
      - address
      properties:
        address:
          $ref: '#/components/schemas/UpdateCounterpartyPaymentMethodAddress'
    CounterpartyRequirementsResponse:
      type: object
      description: The response containing applicable counterparty fields and their validation rules.
      properties:
        fields:
          type: array
          description: A list of applicable and conditionally required fields for the specific counterparty context.
          items:
            $ref: '#/components/schemas/CounterpartyRequirementsField'
      required:
      - fields
    CounterpartyRequirementsField:
      type: object
      description: Represents a contextual field and its rules.
      properties:
        name:
          type: string
          description: "The name of the field to be provided in the [Create a counterparty endpoint](https://developer.revolut.com/docs/api/business#add-counterparty) request body. \nMatches the field names in the Create a counterparty endpoint exactly (e.g. `first_name`, `last_name`, `tax_id`, `route`, `account_type`)."
        required:
          type: boolean
          description: Indicates whether this field must be provided when creating the counterparty.
        regex:
          $ref: '#/components/schemas/CounterpartyRequirementsFieldRegex'
        options:
          type: array
          description: 'A list of allowed values for the field (enum).

            If provided, the field value must be one of these options.'
          items:
            $ref: '#/components/schemas/CounterpartyRequirementsFieldOption'
      required:
      - name
      - required
    CounterpartyCountriesResponse:
      type: object
      description: The response containing supported bank countries and their available currencies.
      properties:
        countries:
          type: array
          description: A list of supported bank countries.
          items:
            $ref: '#/components/schemas/CounterpartyCountry'
      required:
      - countries
    AccountCurrency:
      type: string
      pattern: ^[A-Z]{3}$
      description: '[ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code in upper case.'
    UpdateCounterpartyPaymentMethodAddress:
      type: object
      description: The updated address for the counterparty's payment method. All required fields must be provided.
      properties:
        street_line1:
          type: string
          maxLength: 100
          description: Street line 1 information.
          example: 7 Revolut Street
        street_line2:
          type: string
          maxLength: 100
          description: Street line 2 information.
          example: Floor 3
        region:
          type: string
          maxLength: 50
          description: The name of the region (state or province), for example, Ontario for Canada.
          example: Greater London
        city:
          type: string
          maxLength: 50
          description: The name of the city.
          example: London
        country:
          type: string
          pattern: ^[A-Z]{2}$
          description: The country of the counterparty, provided as a 2-letter [ISO 3166](https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes) code.
          example: GB
        postcode:
          type: string
          maxLength: 15
          description: The postcode of the counterparty address.
          example: EC2V 8PH
      required:
      - country
      - street_line1
      - city
      - postcode
    ValidateAccountNameResponse:
      discriminator:
        mapping:
          UK: '#/components/schemas/ValidateAccountNameResponseUK'
          AU: '#/components/schemas/ValidateAccountNameResponseAU'
          RO: '#/components/schemas/ValidateAccountNameResponseRO'
          EUR: '#/components/schemas/ValidateAccountNameResponseEUR'
    Currency:
      type: string
      pattern: ^[A-Z]{3}$
      description: '[ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code in upper case.'
    CounterpartyAddress:
      type: object
      description: The address of the counterparty's account.
      required:
      - country
      properties:
        street_line1:
          type: string
          maxLength: 100
          description: Street line 1 information.
        street_line2:
          type: string
          maxLength: 100
          description: Street line 2 information.
        region:
          type: string
          maxLength: 50
          description: The name of the region (state or province), for example, Ontario for Canada.
        city:
          type: string
          maxLength: 50
          description: The name of the city.
        country:
          type: string
          pattern: ^[A-Z]{2}$
          description: The country of the counterparty, as a 2-letter [ISO 3166](https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes) code.
        postcode:
          type: string
          maxLength: 15
          description: The postcode of the counterparty address.
    CounterpartyAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the counterparty's account.
        name:
          type: string
          description: The name of the counterparty.
        bank_country:
          $ref: '#/components/schemas/BankCountryCode'
        currency:
          $ref: '#/components/schemas/AccountCurrency'
        type:
          enum:
          - revolut
          - external
          description: Indicates the type of account.
          type: string
        account_no:
          type: string
          description: The bank account number of the counterparty.
        iban:
          type: string
          description: The IBAN number of the counterparty's account if applicable.
        sort_code:
          type: string
          description: The sort code of the counterparty's account if applicable.
        routing_number:
          type: string
          description: The routing number of the counterparty's account if applicable.
        bic:
          type: string
          description: The BIC number of the counterparty's account if applicable.
        clabe:
          type: string
          description: The CLABE number of the counterparty's account if applicable.
        ifsc:
          type: string
          description: The IFSC number of the counterparty's account if applicable.
        bsb_code:
          type: string
          description: The BSB number of the counterparty's account if applicable.
        route:
          type: string
          enum:
          - ach
          - fedwire
          - swift
          description: Routing method for US/USD transfers. Defaults to `ach` for US-registered businesses and `fedwire` for non-US businesses.
          example: ach
        bank_number:
          type: string
          description: Brazilian bank identification code (COMPE). Returned for BR counterparties.
          example: '033'
        branch_code:
          type: string
          description: Brazilian branch (agência) code. Returned for BR counterparties.
          example: '0001'
        account_type:
          type: string
          enum:
          - checking
          - savings
          description: Bank account type. Returned for BR, CO, and CL counterparties. Defaults to `checking` for US ACH transfers.
          example: checking
        tax_id:
          type: string
          maxLength: 20
          description: "Tax identification number.\nRouted based on `bank_country` and recipient type:\n- **BR**:\n  - **Individual**: CPF (Cadastro de Pessoas Físicas). Accepted formats: `^\\d{11}$` or `^\\d{3}\\.\\d{3}\\.\\d{3}-\\d{2}$`.\n  - **Company**: CNPJ (Cadastro Nacional da Pessoa Jurídica). Accepted formats: `^\\d{14}$` or `^\\d{2}\\.\\d{3}\\.\\d{3}/\\d{4}-\\d{2}$`.\n- **CO (company)**: NIT (Número de Identificación Tributaria). Accepted format: `^\\d{10}$`.\n- **CL (individual, company)**: RUT (Rol Único Tributario)."
        national_id:
          type: string
          description: 'National identification number.

            Specifies Colombian Cédula de Ciudadanía when `bank_country` is `CO` and `profile_type` is `personal`.'
        phone:
          type: string
          maxLength: 20
          description: 'The phone number of the counterparty in [E.164](https://en.wikipedia.org/wiki/E.164) format.


            Country-specific formats:

            - **CO**: `+57` followed by 10 digits (`^\+?57\d{10}$`)

            - **LK**: `+94` followed by 10 digits (`^\+?94\d{10}$`)

            - **KR**: `+82` followed by 10 digits (`^\+?82\d{10}$`)'
          example: '+573001234567'
        business_registration_id:
          type: string
          maxLength: 64
          description: Company registration number. Used for business LK counterparties.
          example: PV12345
        recipient_charges:
          enum:
          - 'no'
          - expected
          description: 'Indicates the possibility of the recipient charges.


            :::warning

            This field is deprecated and should be disregarded.

            It is returned for legacy purposes only.

            :::'
          type: string
          deprecated: true
        address:
          $ref: '#/components/schemas/CounterpartyAddress'
      required:
      - id
      - currency
      - type
    CounterpartyCard:
      type: object
      required:
      - id
      - name
      - last_digits
      - scheme
      - country
      - currency
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the counterparty's card.
        name:
          type: string
          description: The name of the counterparty.
        last_digits:
          type: string
          description: The last four digits of the card number.
        scheme:
          type: string
          enum:
          - visa
          - mastercard
          description: The card brand.
        country:
          $ref: '#/components/schemas/CountryCodeCard'
        currency:
          $ref: '#/components/schemas/Currency'
    IndividualName:
      type: object
      description: 'The name of the counterparty, provided when the counterparty is an **individual** (personal account type) and is **not** being added via Revtag.


        If specified, `company_name` and `name` must be empty.'
      properties:
        first_name:
          type: string
          description: The first name of the individual counterparty.
        last_name:
          type: string
          description: The last name of the individual counterparty.
    ProfileType:
      type: string
      enum:
      - personal
      - business
