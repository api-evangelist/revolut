      - value
    ValidateAccountNameRequest:
      discriminator:
        mapping:
          UK: '#/components/schemas/ValidateAccountNameRequestUK'
          AU: '#/components/schemas/ValidateAccountNameRequestAU'
          RO: '#/components/schemas/ValidateAccountNameRequestRO'
          EUR: '#/components/schemas/ValidateAccountNameRequestEUR'
    BeneficiaryAddress:
      type: object
      description: The address of the counterparty.
      properties:
        street_line1:
          type: string
          description: Street line 1 information.
          example: Revolut LTD
        street_line2:
          type: string
          description: Street line 2 information.
          example: 1 Canada Square
        region:
          type: string
          description: The name of the region (state or province), for example, Ontario for Canada.
          example: Ontario
        city:
          type: string
          description: The name of the city.
          example: London
        country:
          type: string
          pattern: ^[A-Z]{2}$
          description: The country of the counterparty, as a 2-letter [ISO 3166](https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes) code.
          example: GB
        postcode:
          type: string
          description: The postcode of the counterparty address.
          example: E14 5AB
      required:
      - country
      - postcode
    CounterpartyError:
      type: object
      properties:
        code:
          type: integer
          description: The error code.
        message:
          type: string
          description: The description of the error.
        params:
          $ref: '#/components/schemas/CounterpartyErrorParams'
      required:
      - code
      - message
    CounterpartyCountry:
      type: object
      description: A supported bank country with its available currencies.
      properties:
        country:
          $ref: '#/components/schemas/BankCountryCode'
        currencies:
          type: array
          description: The currencies available for counterparty creation in this country.
          items:
            $ref: '#/components/schemas/Currency'
      required:
      - country
      - currencies
    BankCountryCode:
      type: string
      pattern: ^[A-Z]{2}$
      description: The country of the bank, provided as a 2-letter [ISO 3166](https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes) code.
      example: GB
    ErrorWithId:
      required:
      - code
      - message
      - error_id
      type: object
      properties:
        error_id:
          type: string
          description: The ID of the specific error instance. Used for traceability.
        code:
          type: integer
          description: The error code.
        message:
          type: string
          description: The description of the error.
    CreateCounterpartyRequest:
      type: object
      properties:
        profile_type:
          type: string
          enum:
          - personal
          - business
          description: 'The type of the Revolut profile.

            Indicates whether the counterparty is a personal or business account.

            Provide it when adding a Revolut counterparty via Revtag.'
        revtag:
          type: string
          description: The [Revtag](https://help.revolut.com/help/transfers/internal-transfers/username-payments/revtags/) of the counterparty to add.
        name:
          type: string
          description: 'The name of the counterparty, provided when the counterparty is being added via **Revtag**.


            If specified, `individual_name` and `company_name` must be empty.


            :::note

            The name that you provide must match or closely match the actual name associated with the account that you''re trying to add.

            Otherwise, the creation fails and a `404` error is returned.

            :::

            '
        company_name:
          type: string
          description: 'The name of the counterparty, provided when the counterparty is a **company** (business account type) and is **not** being added via Revtag.


            If specified, `individual_name` and `name` must be empty.


            :::warning

            The `company_name` must contain at least 2 letters (not just characters).

            For example, names like `12` will fail validation because they are two characters but not two letters.

            :::'
        individual_name:
          $ref: '#/components/schemas/IndividualName'
        bank_country:
          $ref: '#/components/schemas/BankCountryCode'
        currency:
          $ref: '#/components/schemas/Currency'
        account_no:
          type: string
          description: The bank account number of the counterparty.
        iban:
          type: string
          description: The IBAN number of the counterparty's account. This field is displayed for IBAN countries.
        sort_code:
          type: string
          description: The sort code of the counterparty's account. This field is required for GBP accounts.
        routing_number:
          type: string
          description: The routing number of the counterparty's account. This field is required for USD accounts.
        bic:
          type: string
          description: The BIC number of the counterparty's account. This field is required for non-SEPA IBAN/SWIFT.
        clabe:
          type: string
          description: The CLABE number of the counterparty's account. This field is required for SWIFT MX.
        ifsc:
          type: string
          description: The IFSC number of the counterparty's account. This field is required for INR accounts.
        bsb_code:
          type: string
          description: The BSB number of the counterparty's account. This field is required for AUD accounts.
        address:
          $ref: '#/components/schemas/BeneficiaryAddress'
        route:
          type: string
          enum:
          - ach
          - fedwire
          - swift
          description: "Routing method for US USD transfers. When omitted, defaults to `ach` for US-registered businesses and `fedwire` for non-US businesses. \n\nRequired when `bank_country` is `US` and the desired routing method differs from the default."
          example: ach
        bank_number:
          type: string
          minLength: 3
          maxLength: 3
          description: Brazilian bank identification code (COMPE). Required for BR counterparties.
          example: '033'
        branch_code:
          type: string
          minLength: 4
          maxLength: 4
          description: Brazilian branch (agência) code. Required for BR counterparties.
          example: '0001'
        account_type:
          type: string
          enum:
          - checking
          - savings
          description: "Bank account type. Defaults to `checking` for US ACH transfers when omitted. \n\nRequired for BR, CO, and CL counterparties."
          example: checking
        tax_id:
          type: string
          maxLength: 20
          description: "Tax identification number.\n\nRequired and routed based on `bank_country` and recipient type:\n- **BR**:\n  - **Individual**: CPF (Cadastro de Pessoas Físicas). Accepted formats: `^\\d{11}$` or `^\\d{3}\\.\\d{3}\\.\\d{3}-\\d{2}$`.\n  - **Company**: CNPJ (Cadastro Nacional da Pessoa Jurídica). Accepted formats: `^\\d{14}$` or `^\\d{2}\\.\\d{3}\\.\\d{3}/\\d{4}-\\d{2}$`.\n- **CO (company)**: NIT (Número de Identificación Tributaria). Accepted format: `^\\d{10}$`.\n- **CL (individual, company)**: RUT (Rol Único Tributario)."
        national_id:
          type: string
          description: National identification number. Required  when `bank_country` is `CO` and `profile_type` is `personal`, must specify Colombian Cédula de Ciudadanía.
        phone:
          type: string
          maxLength: 20
          description: 'The phone number of the counterparty in [E.164](https://en.wikipedia.org/wiki/E.164) format.


            - For internal (Revolut) counterparties: the recipient''s Revolut phone number used to look them up.

            - For external counterparties in CO, KR, and LK: the bank account phone number. Required when `bank_country` is `CO`, `KR`, or `LK`.


            Country-specific formats:

            - **CO**: `+57` followed by 10 digits (`^\+?57\d{10}$`)

            - **KR**: `+82` followed by 10 digits (`^\+?82\d{10}$`)

            - **LK**: `+94` followed by 10 digits (`^\+?94\d{10}$`)'
          example: '+573001234567'
        business_registration_id:
          type: string
          maxLength: 64
          description: 'Company registration number. Required for business LK counterparties (`profile_type`: `business`).'
          example: PV12345
  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
      description: "Each Business API request must contain an authorization header in the following format to make a call: `Bearer <your_access_token>`.\n\nThe access token will be obtained the first time you set up your application and has an expiration of 40 minutes. \nDuring setup, a `refresh_token` will also be obtained which allows to obtain a new `access_token`.\n\n:::danger\nNever share your client-assertion JWT (JSON web token), `access_token` and `refresh_token` with anyone, as these can be used to access your banking data and initiate transactions.\n:::\n\nAccess tokens can be issued with four security scopes and require a JWT (JSON Web Token) signature to be obtained:\n- `READ`: Permissions for `GET` operations.\n- `WRITE`: Permissions to update counterparties, webhooks, and issue payment drafts.\n- `PAY`: Permissions to initiate or cancel transactions and currency exchanges.    \n- `READ_SENSITIVE_CARD_DATA`: Permissions to retrieve sensitive card details.\n\n  :::warning\n  If you enable the `READ_SENSITIVE_CARD_DATA` scope for your access token, you must set up IP whitelisting. \n  Failing to do so will prevent you from accessing **any** Business API endpoint. \n\n  IP whitelisting means that you must specify an IP or a set of IPs which will be the only IPs from which requests to the API will be accepted. \n  To do so:\n  1. Go to the Revolut Business web app [settings](https://business.revolut.com/settings) → **APIs** → **Business API**.\n  2. Select the corresponding API certificate.\n  3. In **Production IP whitelist**, provide the IP(s) which should be whitelisted.\n      Make sure that the IPs you provide are **not** [local (i.e. private) IP addresses](https://www.okta.com/en-sg/identity-101/understanding-private-ip-ranges/). \n  4. Save the new settings.\n  :::\n\nTo configure your JWT and obtain the refresh and first access tokens, complete the following steps:\n\n  1. [Sign up for a Revolut Business account](https://developer.revolut.com/docs/guides/manage-accounts/get-started/sign-up-for-revolut-business-account)\n  2. [Prepare your Sandbox environment](https://developer.revolut.com/docs/guides/manage-accounts/get-started/prepare-sandbox-environment)\n  3. [Make your first API request](https://developer.revolut.com/docs/guides/manage-accounts/get-started/make-your-first-api-request)"
