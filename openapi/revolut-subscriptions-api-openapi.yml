components:
  schemas:
    Subscription-Plan-Variation-Id:
      type: string
      format: uuid
      description: Unique identifier for the subscription plan variation.
    Setup-Order-Id:
      type: string
      format: uuid
      description: 'The ID of the order created for handling the setup payment for the subscription.


        Use the [Retrieve an order](https://developer.revolut.com/docs/api/merchant#retrieve-order) endpoint with this ID to get order details, including the `checkout_url` for redirecting customers to the Hosted Payment Page or the `token` for widget integration.


        :::note

        The order is created in parallel to the subscription and is used to collect the initial payment and save the customer''s payment method for future billing cycles.

        :::'
    Subscription-Item-Flat:
      type: object
      description: Object structure of flat subscription item.
      properties:
        id:
          $ref: '#/components/schemas/Subscription-Item-Id'
        name:
          $ref: '#/components/schemas/Subscription-Item-Name'
        type:
          $ref: '#/components/schemas/Subscription-Item-Type'
        package_size:
          $ref: '#/components/schemas/Subscription-Item-Package-Size'
        unit:
          $ref: '#/components/schemas/Subscription-Item-Unit'
        quantity:
          $ref: '#/components/schemas/Subscription-Item-Quantity'
        amount:
          type: integer
          description: Amount in minor currency units (e.g., cents for USD).
          example: 9900
        currency:
          $ref: '#/components/schemas/Currency'
      required:
      - id
      - name
      - type
      - amount
      - currency
      - unit
      - quantity
    Subscription-Cycle-Id:
      type: string
      format: uuid
      description: Unique identifier for the subscription cycle.
    Currency:
      type: string
      format: ISO 4217
      minLength: 3
      maxLength: 3
      description: '[ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code in upper case.


        :::info

        For more information about the supported currencies, see: [Help Center](https://help.revolut.com/business/help/merchant-accounts/payments/in-which-currencies-can-i-accept-payments/).

        :::'
    Cycle-Number:
      type: integer
      minimum: 1
      description: 'The sequential cycle number within the subscription.


        Starts at `1` for the first cycle and increments with each new billing cycle.'
    Subscription-Plan-Created:
      type: string
      format: date-time
      description: The date and time the subscription plan was created in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    Subscription-Plans:
      type: object
      required:
      - subscription_plans
      properties:
        next_page_token:
          type:
          - string
          - 'null'
          description: 'Token for retrieving the next page of results.


            If not present, there are no more results to retrieve.'
        subscription_plans:
          type: array
          description: List of subscription plans.
          items:
            $ref: '#/components/schemas/Subscription-Plan'
    Subscription-Items:
      type: array
      description: A list of subscription items for this phase.
      items:
        $ref: '#/components/schemas/Subscription-Item'
    Subscription-Trial-Duration:
      type: string
      format: duration
      description: 'The trial period duration for this subscription in [ISO 8601 duration format](https://en.wikipedia.org/wiki/ISO_8601#Durations) (e.g., "P14D" for 14 days).


        ### Override plan defaults


        Subscription plans can define a default trial duration. When creating a subscription, you can use this field to override the plan''s default trial period:


        | Field value | Behaviour | Example |

        | ----------- | -------- | ------- |

        | **Not provided** | Uses the trial duration defined in the plan (if any) | Plan has `"P7D"` → subscription gets 7-day trial |

        | **Different value** | Overrides the plan''s default trial duration | Plan has `"P7D"` → set to `"P30D"` for promotional offer, or `"P3D"` to reduce |

        | **`"P0D"`** | Explicitly skips the trial period | Plan has `"P7D"` → set to `"P0D"` to skip trial entirely |


        :::note

        Only days (`D`) are allowed. Time components such as hours, minutes, or seconds are not permitted.

        :::'
      example: P14D
      pattern: ^P[0-9]+D$
    Subscription-Scheduled-Action-Cancel:
      title: Subscription-Scheduled-Action-Cancel
      type: object
      description: A cancellation scheduled to take effect at the end of the current billing cycle.
      required:
      - type
      - reason
      properties:
        type:
          $ref: '#/components/schemas/Subscription-Scheduled-Action-Type'
        reason:
          $ref: '#/components/schemas/Subscription-Change-Plan-Reason'
    Subscription-Item-Id:
      type: string
      format: uuid
      description: The unique identifier of the subscription item.
    Subscription-Trial-End-Date:
      type:
      - string
      - 'null'
      format: date-time
      description: 'The date and time when the subscription''s trial period ends in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.


        This value is automatically calculated by the system as: `start_date` + `trial_duration`


        The `trial_duration` used in the calculation comes from either:

        - The subscription''s custom `trial_duration` (if provided at creation time), or

        - The plan''s default `trial_duration` (if no override was specified)


        This field is `null` when the subscription has no trial period (e.g., when `trial_duration` is not set or is `"P0D"`).'
      example: '2025-06-19T21:00:00.036001Z'
    Subscription-Plan-Name:
      type: string
      minLength: 1
      maxLength: 1024
      description: The name of the subscription plan.
    Subscription-Scheduled-Action-Change-Plan:
      title: Subscription-Scheduled-Action-Change-Plan
      type: object
      description: A plan variation change scheduled to take effect at the end of the current billing cycle.
      required:
      - type
      - reason
      - plan_variation_id
      properties:
        type:
          $ref: '#/components/schemas/Subscription-Scheduled-Action-Type'
        reason:
          $ref: '#/components/schemas/Subscription-Change-Plan-Reason'
        plan_variation_id:
          $ref: '#/components/schemas/Subscription-Plan-Variation-Id'
        plan_variation_phase_id:
          $ref: '#/components/schemas/Subscription-Plan-Phase-Id'
    Subscription-Change-Plan-Reason:
      type: string
      description: 'The reason for the scheduled action. This field is informational and does not affect how the action is processed.


        | Value | Description |

        | ----- | ----------- |

        | `customer_request` | The action was requested by the customer. |

        | `merchant_request` | The action was initiated by the merchant. |'
      enum:
      - customer_request
      - merchant_request
      default: merchant_request
      example: customer_request
    Subscription-External-Reference:
      type: string
      maxLength: 1024
      description: 'Optional external reference for the subscription.


        Use this field to store your own system''s identifier for easy tracking and correlation.'
    Subscription-Amount:
      type: integer
      minimum: 0
      description: 'Subscription amount in minor currency units (e.g., cents for USD, pence for GBP).


        For example, `9900` in `GBP` represents £99.00.


        :::info

        Conversion between major and minor units varies by currency. For instance, `100` minor units equal £1.00 in `GBP`, whereas in `ISK` they represent 100 units. For more details, see the [ISO 4217 standard](https://en.wikipedia.org/wiki/ISO_4217).

        :::'
    Subscription-Item-Usage:
      type: object
      description: Object structure of usage subscription item.
      properties:
        id:
          $ref: '#/components/schemas/Subscription-Item-Id'
        name:
          $ref: '#/components/schemas/Subscription-Item-Name'
        type:
          $ref: '#/components/schemas/Subscription-Item-Type'
        package_size:
          $ref: '#/components/schemas/Subscription-Item-Package-Size'
        unit:
          $ref: '#/components/schemas/Subscription-Item-Unit'
        amount:
          type: integer
          description: Flat amount per unit in minor currency units. Mutually exclusive with `tiers`.
          example: 10
        currency:
          $ref: '#/components/schemas/Currency'
        tiers:
          type: array
          description: Graduated pricing tiers. Mutually exclusive with `amount`.
          items:
            $ref: '#/components/schemas/Subscription-Item-Tier'
        code:
          $ref: '#/components/schemas/Subscription-Item-Code'
        usage_aggregation_method:
          $ref: '#/components/schemas/Usage-Aggregation-Method'
      required:
      - id
      - name
      - type
      - currency
      - unit
      - code
      - usage_aggregation_method
    Subscription-Update-Renewal-Date:
      type: object
      properties:
        renewal_date:
          type: string
          format: date-time
          description: 'The new renewal date for the subscription, expressed as a UTC date-time value.


            Must be set to a date later than the current renewal date; earlier dates are rejected.'
          example: '2026-07-01T00:00:00Z'
      required:
      - renewal_date
    Subscription-Plan-Variation-Creation:
      type: object
      required:
      - phases
      properties:
        phases:
          type: array
          minItems: 1
          description: List of billing phases for this variation.
          items:
            $ref: '#/components/schemas/Subscription-Plan-Phase-Creation'
    Customer-Id:
      type: string
      format: uuid
      description: Unique identifier for the customer.
    Subscription:
      type: object
      required:
      - id
      - state
      - customer_id
      - plan_id
      - plan_variation_id
      - payment_method_type
      - created_at
      - updated_at
      - current_cycle_id
      properties:
        id:
          $ref: '#/components/schemas/Subscription-Id'
        external_reference:
          $ref: '#/components/schemas/Subscription-External-Reference'
        state:
          $ref: '#/components/schemas/Subscription-State'
        customer_id:
          $ref: '#/components/schemas/Customer-Id'
        plan_id:
          $ref: '#/components/schemas/Subscription-Plan-Id'
        plan_variation_id:
          $ref: '#/components/schemas/Subscription-Plan-Variation-Id'
        payment_method_type:
          $ref: '#/components/schemas/Subscription-Payment-Method-Type'
        payment_method_id:
          $ref: '#/components/schemas/Payment-Method-Id'
        created_at:
          $ref: '#/components/schemas/Subscription-Created'
        updated_at:
          $ref: '#/components/schemas/Subscription-Updated'
        start_date:
          $ref: '#/components/schemas/Subscription-Start-Date'
        current_cycle_id:
          $ref: '#/components/schemas/Subscription-Cycle-Id'
        trial_duration:
          $ref: '#/components/schemas/Subscription-Trial-Duration'
        trial_end_date:
          $ref: '#/components/schemas/Subscription-Trial-End-Date'
        setup_order_id:
          $ref: '#/components/schemas/Setup-Order-Id'
        scheduled_action:
          $ref: '#/components/schemas/Subscription-Scheduled-Action'
    Subscription-Start-Date:
      type:
      - string
      - 'null'
      format: date-time
      description: 'The date and time the subscription started in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.


        This field is `null` until the subscription becomes active.'
    Subscription-Plan-Trial-Duration:
      type: string
      format: duration
      description: 'The default trial period duration for this subscription plan in [ISO 8601 duration format](https://en.wikipedia.org/wiki/ISO_8601#Durations) (e.g., "P14D" for 14 days).


        This value serves as the default trial duration for all subscriptions created from this plan. Individual subscriptions can override this value at creation time.


        :::note

        Only days (`D`) are allowed. Time components such as hours, minutes, or seconds are not permitted.

        :::'
      example: P14D
      pattern: ^P[0-9]+D$
    Subscription-Item-Creation:
      title: Subscription item
      type: object
      description: A subscription item for a plan phase. Can be either a fixed-fee (flat) item or a metered (usage) item.
      discriminator:
        propertyName: type
        mapping:
          flat: '#/components/schemas/Subscription-Item-Flat-Creation'
          usage: '#/components/schemas/Subscription-Item-Usage-Creation'
      oneOf:
      - $ref: '#/components/schemas/Subscription-Item-Flat-Creation'
      - $ref: '#/components/schemas/Subscription-Item-Usage-Creation'
    Cycle-Count:
      type:
      - integer
      - 'null'
      minimum: 1
      description: 'Number of billing cycles for this phase before moving to the next phase.


        | Value | Behavior |

        | ----- | -------- |

        | `null` or omitted | Phase continues indefinitely. The subscription remains in this phase with no automatic progression. |

        | Specific number (e.g., `1`, `3`, `12`) | After completing this many billing cycles, the subscription automatically moves to the next phase as determined by the `ordinal` field. |


        **Example**: If `cycle_count=3` and `cycle_duration=P1M`, the subscription will complete 3 monthly cycles then move to the phase with the next highest `ordinal` value.


        :::note

        If no next phase exists in after a cycle with a specific `cycle_count`, the subscription will automatically stop when it completes its cycles.

        :::'
      title: Cycle-Count
    Previous-Cycle-Id:
      type:
      - string
      - 'null'
      format: uuid
      description: 'The unique identifier of the previous billing cycle.


        This field is `null` for the first cycle in a subscription.'
    Next-Page-Token:
      type:
      - string
      - 'null'
      description: 'Token for retrieving the next page of results. Use this token as the value of the `page_token` query parameter in your next request to retrieve the next page.


        If not present, there are no more results to retrieve.'
    Subscription-Plan:
      type: object
      required:
      - id
      - name
      - state
      - created_at
      - updated_at
      - variations
      properties:
        id:
          $ref: '#/components/schemas/Subscription-Plan-Id'
        name:
          $ref: '#/components/schemas/Subscription-Plan-Name'
        trial_duration:
          $ref: '#/components/schemas/Subscription-Plan-Trial-Duration'
        state:
          $ref: '#/components/schemas/Subscription-Plan-State'
        created_at:
          $ref: '#/components/schemas/Subscription-Plan-Created'
        updated_at:
          $ref: '#/components/schemas/Subscription-Plan-Updated'
        variations:
          type: array
          description: List of subscription plan variations.
          items:
            $ref: '#/components/schemas/Subscription-Plan-Variation'
    Subscription-Payment-Method-Type:
      type: string
      enum:
      - automatic
      - manual
      description: 'The type of payment method used for the subscription.


        | Type | Description |

        | ---- | ----------- |

        | `automatic` | Payments are automatically charged to the customer''s saved payment method. |

        | `manual` | Payments require manual processing by the customer. |'
    Subscription-Id:
      type: string
      format: uuid
      description: Unique identifier for the subscription.
    Subscription-Plan-Id:
      type: string
      format: uuid
      description: Unique identifier for the subscription plan.
    Order-Id:
      type: string
      format: uuid
      description: Permanent order ID used to retrieve, capture, cancel, or refund an order after authorization.
    Subscription-Item-Name:
      type: string
      description: The name of the subscription item.
      maxLength: 250
      example: Base Subscription Fee
    Subscription-Item-Unit:
      type: string
      description: The unit of measurement for the item.
      maxLength: 100
      example: subscription
    Subscription-Usage-Creation:
      type: object
      required:
      - subscription_id
      - subscription_item_code
      - usage_date
      - quantity
      properties:
        subscription_id:
          $ref: '#/components/schemas/Subscription-Id'
        subscription_item_code:
          $ref: '#/components/schemas/Subscription-Item-Code'
        usage_date:
          $ref: '#/components/schemas/Subscription-Usage-Date'
        quantity:
          $ref: '#/components/schemas/Subscription-Usage-Quantity'
        metadata:
          $ref: '#/components/schemas/Subscription-Usage-Metadata'
    Subscription-Usage-Update:
      type: object
      properties:
        quantity:
          $ref: '#/components/schemas/Subscription-Usage-Quantity'
        metadata:
          $ref: '#/components/schemas/Subscription-Usage-Metadata'
    Cycle-Duration:
      type: string
      format: duration
      description: 'The length of each billing cycle for this phase in [ISO 8601 duration format](https://en.wikipedia.org/wiki/ISO_8601#Durations).


        This determines how often the customer is billed during this phase. The total time spent in a phase is `cycle_duration × cycle_count`.


        **Common durations**:


        | Duration | Description |

        | -------- | ----------- |

        | `P1M` | 1 month |

        | `P1Y` | 1 year |

        | `P15D` | 15 days |

        | `P1W` | 1 week |

        | `PT2H` | 2 hours |


        **Example**: If `cycle_duration=P1M` and `cycle_count=12`, the customer will be billed monthly for 12 months (1 year total).'
    Subscription-Cycle:
      type: object
      required:
      - id
      - subscription_id
      - plan_variation_id
      - number
      - state
      properties:
        id:
          $ref: '#/components/schemas/Subscription-Cycle-Id'
        subscription_id:
          $ref: '#/components/schemas/Subscription-Id'
        plan_variation_id:
          $ref: '#/components/schemas/Subscription-Plan-Variation-Id'
        plan_variation_phase_id:
          $ref: '#/components/schemas/Subscription-Plan-Phase-Id'
        number:
          $ref: '#/components/schemas/Cycle-Number'
        previous_cycle_id:
          $ref: '#/components/schemas/Previous-Cycle-Id'
        state:
          $ref: '#/components/schemas/Subscription-Cycle-State'
        start_date:
          $ref: '#/components/schemas/Subscription-Cycle-Start-Date'
        end_date:
          $ref: '#/components/schemas/Subscription-Cycle-End-Date'
        usage_cutoff_date:
          $ref: '#/components/schemas/Subscription-Cycle-Usage-Cutoff-Date'
        order_id:
          $ref: '#/components/schemas/Order-Id'
        post_billing_order_id:
          $ref: '#/components/schemas/Subscription-Cycle-Post-Billing-Order-Id'
        trial:
          $ref: '#/components/schemas/Subscription-Cycle-Trial'
    Subscription-Creation:
      type: object
      required:
      - plan_variation_id
      - customer_id
      properties:
        plan_variation_id:
          $ref: '#/components/schemas/Subscription-Plan-Variation-Id'
        customer_id:
          $ref: '#/components/schemas/Customer-Id'
        external_reference:
          $ref: '#/components/schemas/Subscription-External-Reference'
        setup_order_redirect_url:
          $ref: '#/components/schemas/Setup-Order-Redirect-URL'
        trial_duration:
          $ref: '#/components/schemas/Subscription-Trial-Duration'
    Subscription-Usages:
      type: object
      properties:
        next_page_token:
          $ref: '#/components/schemas/Next-Page-Token'
        subscription_usages:
          type: array
          description: List of subscription usages.
          items:
            $ref: '#/components/schemas/Subscription-Usage'
    Subscription-Plan-Creation:
      type: object
      required:
      - name
      - variations
      properties:
        name:
          $ref: '#/components/schemas/Subscription-Plan-Name'
        trial_duration:
          $ref: '#/components/schemas/Subscription-Plan-Trial-Duration'
        variations:
          type: array
          minItems: 1
          description: List of subscription plan variations (e.g., monthly, yearly pricing options).
          items:
            $ref: '#/components/schemas/Subscription-Plan-Variation-Creation'
    Subscription-Cycle-Usage-Cutoff-Date:
      type: string
      format: date-time
      description: 'The deadline for submitting or correcting usage records for this cycle, in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.


        Set to 12 hours after the cycle''s `end_date` by default. After this time, Revolut aggregates all reported usage records and creates the `post_billing_order_id` to initiate the charge.


        :::note

        Only present for cycles that include usage-based subscription items.

        :::'
    Subscription-Item-Type:
      type: string
      description: The type of subscription item.
      enum:
      - flat
      - usage
      example: flat
    Subscription-Item-Quantity:
      type: number
      description: The quantity of the item.
      example: 1
    Payment-Method-Id:
      type: string
      format: uuid
      description: Unique identifier for the payment method.
    Subscription-Plan-Phase-Id:
      type: string
      format: uuid
      description: Unique identifier for the subscription plan phase.
    Subscription-Scheduled-Action:
      description: A pending scheduled action on the subscription, applied at the end of the current billing cycle.
      type: object
      discriminator:
        propertyName: type
        mapping:
          cancel: '#/components/schemas/Subscription-Scheduled-Action-Cancel'
          change_plan_variation: '#/components/schemas/Subscription-Scheduled-Action-Change-Plan'
      oneOf:
      - $ref: '#/components/schemas/Subscription-Scheduled-Action-Cancel'
      - $ref: '#/components/schemas/Subscription-Scheduled-Action-Change-Plan'
    Subscription-Item:
      title: Subscription item
      type: object
      description: A subscription item that defines a billing line within a plan phase. Can be either a fixed-fee (flat) item or a metered (usage) item.
      discriminator:
        propertyName: type
        mapping:
          flat: '#/components/schemas/Subscription-Item-Flat'
          usage: '#/components/schemas/Subscription-Item-Usage'
      oneOf:
      - $ref: '#/components/schemas/Subscription-Item-Flat'
      - $ref: '#/components/schemas/Subscription-Item-Usage'
    Setup-Order-Redirect-URL:
      type: string
      format: uri
      pattern: ^https?:\/{2}.+/gi
      maxLength: 2000
      description: 'The URL to which the customer is redirected after completing the setup order on the Revolut Hosted Payment Page.


        When provided, the response will include a `setup_order_id`. Use the [Retrieve an order](https://developer.revolut.com/docs/api/merchant#retrieve-order) endpoint with this `setup_order_id` to get the `checkout_url` for redirecting the customer to the Hosted Payment Page.


        :::warning

        Restrictions:

        - Must be a valid URI as defined by [RFC 3986](https://datatracker.ietf.org/doc/html/rfc3986)

        - URI scheme is required and must be either `http` or `https`

        - URI host is required and cannot be `localhost` or an IP address

        - Max length: `2000`

        - Reserved or invalid characters must be percent-encoded (for example, use `%20` instead of a space)

        :::'
    Subscription-Change-Plan:
      type: object
      properties:
        plan_variation_id:
          $ref: '#/components/schemas/Subscription-Plan-Variation-Id'
        plan_variation_phase_id:
          $ref: '#/components/schemas/Subscription-Plan-Phase-Id'
        scheduled:
          type: string
          description: 'When the plan change should take effect.


            | Value | Description |

            | ----- | ----------- |

            | `at_cycle_end` | The change is applied at the end of the current billing cycle. |'
          enum:
          - at_cycle_end
          example: at_cycle_end
        reason:
          $ref: '#/components/schemas/Subscription-Change-Plan-Reason'
      required:
      - plan_variation_id
      - scheduled
    Subscription-Item-Package-Size:
      type: number
      description: 'The number of units grouped together as a single billable package. Used to enable pricing of items that are too inexpensive to charge individually.


        For example, a `package_size` of `1000` with a unit price of 10 minor units (£0.10 in GBP) lets you sell 1000 tokens for £0.10 — effectively pricing each token at £0.0001, below the minimum chargeable amount.


        Set to `1` to price each unit individually.'
      example: 1
    Subscription-Plan-Phase-Creation:
      type: object
      properties:
        ordinal:
          $ref: '#/components/schemas/Subscription-Plan-Ordinal'
        cycle_duration:
          $ref: '#/components/schemas/Cycle-Duration'
        cycle_count:
          $ref: '#/components/schemas/Cycle-Count'
        amount:
          $ref: '#/components/schemas/Subscription-Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        subscription_items:
          $ref: '#/components/schemas/Subscription-Items-Creation'
      required:
      - ordinal
      - cycle_duration
      - amount
      - currency
    Subscription-Updated:
      type: string
      format: date-time
      description: The date and time the subscription was last updated in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    Subscription-Usage:
      type: object
      required:
      - id
      - subscription_id
      - subscription_cycle_id
      - subscription_item_code
      - usage_date
      - quantity
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Subscription-Usage-Id'
        subscription_id:
          $ref: '#/components/schemas/Subscription-Id'
        subscription_cycle_id:
          $ref: '#/components/schemas/Subscription-Cycle-Id'
        subscription_item_code:
          $ref: '#/components/schemas/Subscription-Item-Code'
        usage_date:
          $ref: '#/components/schemas/Subscription-Usage-Date'
        quantity:
          $ref: '#/components/schemas/Subscription-Usage-Quantity'
        metadata:
          $ref: '#/components/schemas/Subscription-Usage-Metadata'
        created_at:
          $ref: '#/components/schemas/Subscription-Usage-Created-Date'
        updated_at:
          $ref: '#/components/schemas/Subscription-Usage-Updated-Date'
    Subscription-Plan-Updated:
      type: string
      format: date-time
      description: The date and time the subscription plan was last updated in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    Subscription-Item-Usage-Creation:
      type: object
      description: Object structure for usage subscription item.
      properties:
        name:
          $ref: '#/components/schemas/Subscription-Item-Name'
        type:
          $ref: '#/components/schemas/Subscription-Item-Type'
        package_size:
          $ref: '#/components/schemas/Subscription-Item-Package-Size'
        unit:
          $ref: '#/components/schemas/Subscription-Item-Unit'
        amount:
          type: integer
          description: Flat amount per unit in minor currency units. Mutually exclusive with `tiers`.
          example: 10
        currency:
          $ref: '#/components/schemas/Currency'
        tiers:
          type: array
          description: Graduated pricing tiers. Mutually exclusive with `amount`.
          items:
            $ref: '#/components/schemas/Subscription-Item-Tier'
        code:
          $ref: '#/components/schemas/Subscription-Item-Code'
        usage_aggregation_method:
          $ref: '#/components/schemas/Usage-Aggregation-Method'
      required:
      - name
      - type
      - currency
      - unit
      - code
      - usage_aggregation_method
    Subscription-Scheduled-Action-Type:
      type: string
      description: 'The type of the scheduled action.


        | Value | Description |

        | ----- | ----------- |

        | `cancel` | A cancellation scheduled to take effect at the end of the current billing cycle. |

        | `change_plan_variation` | A plan variation change scheduled to take effect at the end of the current billing cycle. |'
      enum:
      - cancel
      - change_plan_variation
      example: change_plan_variation
    Subscription-Item-Code:
      type: string
      description: 'A merchant-defined identifier for a usage-based subscription item. You set this code on each usage item when creating a subscription plan, and supply it when reporting consumption on [Create a subscription usage endpoint](https://developer.revolut.com/docs/api/merchant#create-subscription-usage) to target the correct metered item.


        This allows a subscription with multiple usage items (e.g., `api_calls` and `storage_gb`) to receive consumption reports against the right item without relying on internal IDs.


        The code must be unique within a plan phase.'
      maxLength: 250
      example: api_calls
    Subscription-Cycle-End-Date:
      type: string
      format: date-time
      description: The date and time the subscription cycle ends in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    Subscription-Usage-Id:
      type: string
      format: uuid
      description: The unique identifier of the usage record.
    Subscription-Usage-Quantity:
      type: number
      description: "The quantity of consumption to record for this usage report. \n\nSupports up to 20 digits before and 20 digits after the decimal point."
      example: 100.5
      exclusiveMinimum: 0
    Subscription-State:
      type: string
      enum:
      - pending
      - active
      - overdue
      - paused
      - cancelled
      - finished
      description: 'The state of the subscription.


        | State | Description |

        | ----- | ----------- |

        | `pending` | The subscription has been created but is not yet active. This typically occurs when awaiting the first payment or setup completion. |

        | `active` | The subscription is currently active and billing cycles are processing normally. |

        | `overdue` | The subscription has a failed payment and is awaiting resolution. |

        | `paused` | The subscription has been temporarily paused and no billing will occur. |

        | `cancelled` | The subscription has been cancelled and will not renew. |

        | `finished` | The subscription has completed all billing cycles (for limited-duration subscriptions). |'
    Subscriptions:
      type: object
      required:
      - subscriptions
      properties:
        next_page_token:
          $ref: '#/components/schemas/Next-Page-Token'
        subscriptions:
          type: array
          description: List of subscriptions.
          items:
            $ref: '#/components/schemas/Subscription'
    Error-v2:
      title: Error
      type: object
      properties:
        code:
          type: string
          description: 'An identifier that can be used to determine what went wrong.


            Error codes are not globally unique, but uniqueness is guaranteed within endpoints.'
        message:
          type: string
          description: Some human readable text describing what went wrong.
        timestamp:
          type: integer
          description: The [UNIX timestamp](https://www.unixtimestamp.com/) of the date and time the error happened.
    Subscription-Cycle-State:
      type: string
      enum:
      - pending
      - active
      - finished
      description: 'The state of the subscription cycle.


        | State | Description |

        | ----- | ----------- |

        | `pending` | The cycle has been created but has not yet started. A cycle can enter this state automatically when usage is reported for a future cycle via `POST /api/subscription-usages`. |

        | `active` | The cycle is currently active and in progress. |

        | `finished` | The cycle has completed. |'
    Subscription-Plan-State:
      type: string
      enum:
      - active
      - deactivated
      description: 'The state of the subscription plan.


        | State | Description |

        | ----- | ----------- |

        | `active` | The plan is active and can be used to create new subscriptions. |

        | `deactivated` | The plan has been deactivated and cannot be used for new subscriptions. |'
    Subscription-Plan-Ordinal:
      type: integer
      minimum: 1
      description: 'The sequential order of this phase in the subscription billing lifecycle.


        Phases execute in ascending order based on this value:

        - Phase with `ordinal=1` executes first

        - Phase with `ordinal=2` executes second, and so on


        When a phase completes its `cycle_count`, the subscription automatically progresses to the phase with the next `ordinal` value.


        **Example**: A subscription with phases ordered as `ordinal=1` (trial), `ordinal=2` (regular), `ordinal=3` (discounted) will progress through them in that sequence.'
      title: Subscription-Plan-Ordinal
    Subscription-Created:
      type: string
      format: date-time
      description: The date and time the subscription was created in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    Subscription-Update:
      type: object
      properties:
        external_reference:
          $ref: '#/components/schemas/Subscription-External-Reference'
    Subscription-Item-Tier:
      type: object
      properties:
        upper_quantity_threshold:
          type:
          - number
          - 'null'
          description: The upper bound of the tier (exclusive). Null means unlimited.
          example: 100
        amount:
          type: integer
          description: Per-unit amount in minor currency units (e.g., cents for USD) charged for usage within this tier's threshold range.
          example: 500
      required:
      - amount
    Subscription-Usage-Date:
      type: string
      format: date-time
      description: 'The timestamp indicating when the consumption actually occurred.


        | Constraint | Detail |

        | ---------- | ------ |

        | Format | [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date-time string (e.g., `YYYY-MM-DDTHH:mm:ssZ`). |

        | Timezone | Must be UTC. |

        | Validation | Revolut uses this to identify the applicable billing cycle. Accepted for the active cycle (`start_date ≤ usage_date < end_date`), for a recently ended cycle before its `usage_cutoff_date`, and for the one next upcoming cycle. Other dates are rejected. |'
      example: '2026-03-01T21:00:00Z'
    Usage-Aggregation-Method:
      type: string
      description: 'The method used to aggregate usage events over a billing cycle to calculate the chargeable amount.


        | Value | Behaviour |

        | ----- | --------- |

        | `sum` | Totals all reported usage events during the cycle. Use for cumulative metrics (e.g., API calls, data transferred). |

        | `latest` | Uses the most recently reported value at the end of the cycle. If no usage is reported in a cycle, `0` is used — values do not carry over from previous cycles. Use for gauge-style metrics (e.g., active seats). |

        | `max` | Uses the peak value reported during the cycle. Use for capacity-based billing (e.g., max concurrent connections). |'
      enum:
      - sum
      - latest
      - max
      example: sum
    Subscription-Cycles:
      type: object
      required:
      - cycles
      properties:
        next_page_token:
          type:
          - string
          - 'null'
          description: 'Token for retrieving the next page of results.


            If not present, there are no more results to retrieve.'
        cycles:
          type: array
          description: List of subscription cycles.
          items:
            $ref: '#/components/schemas/Subscription-Cycle'
    Subscription-Cycle-Start-Date:
      type: string
      format: date-time
      description: The date and time the subscription cycle starts in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    Subscription-Cycle-Trial:
      type: boolean
      description: "Indicates whether this billing cycle occurs during the subscription's trial period.\n\nThis value is automatically calculated by the system based on the cycle's timing relative to the subscription's trial period. Returns `true` if the cycle is within the trial period (before `trial_end_date`), otherwise `false`. \n\nTrial cycles typically have different billing behavior, such as reduced or zero charges."
      default: false
      example: false
    Subscription-Items-Creation:
      type: array
      description: A list of subscription items for this phase.
      items:
        $ref: '#/components/schemas/Subscription-Item-Creation'
    Subscription-Plan-Variation:
      type: object
      required:
      - id
      - phases
      properties:
        id:
          $ref: '#/components/schemas/Subscription-Plan-Variation-Id'
        phases:
          type: array
          description: List of billing phases for this variation.
          items:
            $ref: '#/components/schemas/Subscription-Plan-Phase'
    Subscription-Cycle-Post-Billing-Order-Id:
      type: string
      format: uuid
      description: 'The ID of the order created after the cycle''s `usage_cutoff_date` to charge usage-based items accumulated during the cycle.


        | Scenario | Detail |

        | -------- | ------ |

        | Ongoing subscription | This order also acts as the next cycle''s `order_id`, combining usage post-billing for the current cycle with pre-billing for the next. |

        | Last cycle | A standalone finishing order is created to charge all usage from this cycle. |

        | Subscription ended with unpaid cycles | The finishing order consolidates all outstanding usage charges, including any from previous cycles where payment failed. |


        :::note

        Only present for cycles that include usage-based subscription items.

        :::'
    Subscription-Usage-Metadata:
      type: object
      description: 'Key-value pairs you can attach to a usage record for your own tracking and reporting purposes.


        | Constraint | Detail |

        | ---------- | ------ |

        | Keys | Maximum 50 keys per record. |

        | Value types | String, number, or boolean only. |

        | Number precision | Up to 20 digits before and 20 digits after the decimal point. |'
      example:
        user_id: '12345'
        api_version: v2
        usage_rate: 1.5
        is_trial: true
      additionalProperties:
        anyOf:
        - type: string
        - type: number
        - type: boolean
      maxProperties: 50
