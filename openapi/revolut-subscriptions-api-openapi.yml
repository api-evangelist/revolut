  /api/subscription-usages:
    parameters:
    - $ref: '#/components/parameters/Authorization'
    - $ref: '#/components/parameters/Revolut-Api-Version'
    servers:
    - description: Production server (uses live data)
      url: https://merchant.revolut.com
    post:
      summary: Create a subscription usage
      operationId: createSubscriptionUsage
      description: 'Report a unit of consumption against a usage-based subscription item. Revolut accumulates reported records throughout the billing cycle and processes the charge after the cycle''s `usage_cutoff_date`.


        ### Resolve the billing cycle


        Revolut automatically identifies the applicable billing cycle from the `usage_date` you provide. The following submission windows are accepted:


        | Window | Rule |

        | ------ | ---- |

        | Active cycle | `usage_date` falls within the current cycle (`start_date ≤ usage_date < end_date`). |

        | Past cycle correction | `usage_date` falls within a recently ended cycle, and the request is made before that cycle''s `usage_cutoff_date` (12 hours after `end_date` by default). |

        | Next upcoming cycle | `usage_date` falls within the one next future cycle. Revolut creates a `pending` cycle to hold the record until it becomes active. |


        Any `usage_date` outside these windows causes the request to be rejected.


        ### How Revolut calculates the charge


        After the `usage_cutoff_date` passes, all records for each usage item are aggregated using the method defined on the subscription plan:


        | Method | Behaviour |

        | ------ | --------- |

        | `sum` | Totals all reported values during the cycle. Use for cumulative metrics (e.g., total GB transferred). |

        | `latest` | Uses the most recently reported value at the `usage_cutoff_date`. If no usages are reported during the cycle, the charge is 0. Use for gauge-style metrics (e.g., active seat count at month-end). |

        | `max` | Uses the highest value reported during the cycle. Use for capacity-based billing (e.g., peak concurrent connections). |


        The aggregated total is multiplied by the unit price to produce the final charge.


        :::warning

        The `Idempotency-Key` header is **required** for this endpoint. Providing a unique idempotency key ensures that duplicate requests due to retries or network issues do not result in duplicate usage records.

        :::'
      tags:
      - Subscriptions
      parameters:
      - $ref: '#/components/parameters/Idempotency-Key-Required'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subscription-Usage-Creation'
            examples:
              report_usage:
                $ref: '#/components/examples/Req-Subscription-Usage'
      responses:
        '201':
          description: Usage reported successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription-Usage'
              examples:
                usage_record:
                  $ref: '#/components/examples/Res-Subscription-Usage'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error-v2'
              examples:
                item_code_not_found:
                  summary: Subscription item code not found
                  value:
                    code: subscription_item_code_not_found
                    message: Subscription item code 'api_calls' not found for phase
                    timestamp: 1743465600
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error-v2'
        '422':
          description: Unprocessable entity (business rule violation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error-v2'
              examples:
                subscription_finished:
                  summary: Subscription is finished
                  value:
                    code: subscription_finished
                    message: Cannot add usage to a finished subscription
                    timestamp: 1743465600
                usage_after_last_cycle:
                  summary: Usage date after last cycle
                  value:
                    code: subscription_usage_after_last_cycle
                    message: Usage date is after the last cycle
                    timestamp: 1743465600
                usage_before_start:
                  summary: Usage date before subscription start
                  value:
                    code: subscription_usage_before_subscription_start
                    message: Usage date is before the subscription start date
                    timestamp: 1743465600
                future_cycle_limit_exceeded:
                  summary: Future cycle limit exceeded
                  value:
                    code: subscription_usage_future_cycle_limit_exceeded
                    message: Cannot add usage for cycles too far in the future
                    timestamp: 1743465600
                usage_locked:
                  summary: Cycle is past the usage cutoff date
                  value:
                    code: subscription_usage_locked
                    message: Cannot modify usage for a locked cycle
                    timestamp: 1743465600
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error-v2'
      security:
      - Api-Key: []
    get:
      summary: Retrieve a subscription usage list
      operationId: retrieveSubscriptionUsageList
      description: "Retrieve all usage records for the merchant account. Results are ordered by `usage_date`, unlike other list endpoints which order by `created_at`. You can use the query parameters for:\n\n  | Filtering | Pagination |\n  | --------- | ---------- |\n  | Filter the usage records that you want to retrieve, for example, only retrieve records for a specific subscription or billing cycle. <br/><br/>Parameters used for filtering:<br/><ul><li>`subscription_id`</li><li>`subscription_cycle_id`</li><li>`from_usage_date`</li><li>`to_usage_date`</li></ul> | View usage records without loading all of them at once, for example, return a specified number of records per page. <br/><br/>Parameters used for pagination:<br/><ul><li>`limit`</li><li>`page_token`</li></ul> |"
