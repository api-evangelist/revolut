  parameters:
    Usage-Id:
      name: usage_id
      in: path
      schema:
        type: string
        format: uuid
        description: A UUID string, typically used to identify resources.
      required: true
      description: The ID of the usage record.
    Idempotency-Key-Required:
      name: Idempotency-Key
      in: header
      schema:
        type: string
      required: true
      description: 'The `Idempotency-Key` ensures that requests are processed only once, preventing multiple executions of the same operation due to retries or duplicate requests.


        This header is required. It can accept any unique string value the merchant uses.


        A recommended practice is to use a unique identifier from your system (such as the entity''s ID or a request UUID) as the idempotency key. This facilitates tracking and managing requests effectively.'
    From-Usage-Date:
      name: from_usage_date
      in: query
      schema:
        type: string
        format: date-time
      description: Filter usage records with a `usage_date` on or after this date and time.
      required: false
    Revolut-Api-Version:
      name: Revolut-Api-Version
      in: header
      schema:
        type: string
        format: date
        example: '2026-04-20'
        enum:
        - '2023-09-01'
        - '2024-05-01'
        - '2024-09-01'
        - '2025-10-16'
        - '2025-12-04'
        - '2026-03-12'
        - '2026-04-20'
      required: true
      description: 'The version of the Merchant API, specified in `YYYY-MM-DD` format.


        If not specified, you will receive an error.



        :::info

        For more information about API versioning, see: [API versions](https://developer.revolut.com/docs/guides/merchant/reference/versioning/api-versions).

        :::'
      x-config-always-visible-in-example: true
    Idempotency-Key:
      name: Idempotency-Key
      in: header
      schema:
        type: string
      required: false
      description: 'The `Idempotency-Key` ensures that requests are processed only once, preventing multiple executions of the same operation due to retries or duplicate requests.


        This header is optional and can accept any unique string value the merchant uses.


        A recommended practice is to use a unique identifier from your system (such as the entity''s ID or a request UUID) as the idempotency key. This facilitates tracking and managing requests effectively.'
    Subscription-Id:
      name: subscription_id
      in: path
      schema:
        type: string
        format: uuid
        description: A UUID string, typically used to identify resources.
      required: true
      description: The ID of the subscription.
    Authorization:
      name: Authorization
      in: header
      schema:
        type: string
        format: Bearer <yourSecretApiKey>
        example: Bearer sk_1234567890ABCdefGHIjklMNOpqrSTUvwxYZ_1234567890-Ab_cdeFGHijkLMNopq
      required: true
      description: "This parameter accepts the [Merchant API Secret key](https://business.revolut.com/settings/apis?tab=merchant-api) to authorise requests coming from the merchant's backend. \n\nIt ensures that ensures that each request is authenticated and authorised by verifying the secret key. The secret key should be included in all request headers as a `Bearer` token.\n\n:::info\nFor more information, see: [Authentication](https://developer.revolut.com/docs/api/merchant#authentication)\n:::"
    To-Usage-Date:
      name: to_usage_date
      in: query
      schema:
        type: string
        format: date-time
      description: Filter usage records with a `usage_date` before this date and time.
      required: false
    Page-Token:
      name: page_token
      in: query
      schema:
        type: string
      description: "Token for retrieving the next page of results. Used for **pagination**.\n\nTo paginate through results:\n\n  1. Make an initial request with the desired `limit`.\n  1. The response will include a `next_page_token` if more results are available.\n  1. Use that token in the `page_token` parameter of your next request.\n  1. Repeat until `next_page_token` is not present.\n\n:::note\nWhen using `page_token`, you must include all query parameters from the initial request (such as `from`, `to`, or other filter parameters) to maintain consistent filtering across pages.\n:::"
      required: false
    Cycle-Id:
      name: cycle_id
      in: path
      schema:
        type: string
        format: uuid
        description: A UUID string, typically used to identify resources.
      required: true
      description: The ID of the subscription cycle.
    Subscription-Id-Query:
      name: subscription_id
      in: query
      schema:
        type: string
        format: uuid
      description: Filter usages by the ID of the subscription.
      required: false
    Subscription-Plan-Id:
      name: subscription_plan_id
      in: path
      schema:
        type: string
        format: uuid
        description: A UUID string, typically used to identify resources.
      required: true
      description: The ID of the subscription plan.
    Subscription-Cycle-Id-Query:
      name: subscription_cycle_id
      in: query
      schema:
        type: string
        format: uuid
      description: Filter usages by the ID of the subscription cycle.
      required: false
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
      description: Maximum number of records to return. Used for **pagination**.
      required: false
    From:
      name: from
      in: query
      schema:
        type: string
        format: date-time
      description: Filter records created from this date/time. Used for **filtering**.
      required: false
    To:
      name: to
      in: query
      schema:
        type: string
        format: date-time
      description: Filter records created until this date/time. Used for **filtering**.
      required: false
  securitySchemes:
    Api-Key:
      type: apiKey
      in: header
      name: Authorization
      description: 'Each Merchant API request must contain an authorization header in the following format:


        ```

        ''Authorization: Bearer <yourSecretApiKey>''

        ```


        To use this API, you need to generate API keys from your Revolut Business account. The Secret key is used in the authorization header for all server calls, while the Public key is provided with payment methods at checkout.


        :::info

        For detailed instructions on generating your API keys, see: [Generate API keys](https://developer.revolut.com/docs/guides/merchant/get-started#generate-api-keys).

        :::'
