                      updated_at: '2026-03-11T17:03:25.570937Z'
                      default_tax_rate_id: 6a83d8d8-f5a5-405d-aafd-729786569c2d
                    - id: b37c42c8-1d42-4ee1-aa7e-348dd06ea69f
