components:
  schemas:
    TaxRateResponse:
      type: object
      required:
      - id
      - name
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: The unique ID of the tax rate.
          readOnly: true
        name:
          type: string
          description: The name of the tax.
          minLength: 1
          maxLength: 20
        created_at:
          type: string
          format: date-time
          description: The date and time the tax rate was created in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: The date and time the tax rate was last updated in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
          readOnly: true
        percentage:
          type: number
          format: double
          description: "The tax rate percentage applied to the taxable amount. For example, `23` for 23%.\n\n:::note\nYou cannot create negative tax rates manually. \nHowever, negative tax rates might be synced from your accounting software, if integrated. \n:::"
          minimum: -100
          maximum: 100
    CreateTaxRateRequest:
      allOf:
      - $ref: '#/components/schemas/AccountingTaxRate'
      - description: The tax rate to create.
        required:
        - name
