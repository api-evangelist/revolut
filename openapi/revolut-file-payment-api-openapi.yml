          $ref: '#/components/schemas/OBWriteDataFileConsent2'
    Amount:
      pattern: ^\d{1,13}\.\d{1,5}$
      type: string
      description: The amount of money.
    OBReportFileResponse:
      required:
      - Payments
      type: object
      properties:
        Payments:
          type: array
          description: 'The list of payments included in the file payment.

            Each element in the list corresponds to a single payment and contains the amount, reference, and status of that individual payment.'
          items:
            type: object
            description: Detailes for a single payment.
            required:
            - Amount
            - Reference
            - Status
            properties:
              Amount:
                required:
                - Amount
                - Currency
                type: object
                description: The amount of money paid. Specifies the amount and the currency.
                properties:
                  Amount:
                    $ref: '#/components/schemas/Amount'
                  Currency:
                    $ref: '#/components/schemas/Currency'
              Reference:
                maxLength: 100
                minLength: 1
                type: string
                description: The unique reference assigned to the payment.
              Status:
                $ref: '#/components/schemas/PaymentStatus'
    Currency:
      pattern: ^[A-Z]{3}$
      type: string
      description: '[ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code in upper case.'
    OBWriteDataFileResponse2:
      required:
      - ConsentId
      - CreationDateTime
      - FilePaymentId
      - Initiation
      - Status
      - StatusUpdateDateTime
      type: object
      properties:
        FilePaymentId:
          maxLength: 40
          minLength: 1
          type: string
          description: The unique ID that the [ASPSP](https://developer.revolut.com/docs/guides/build-banking-apps/glossary) assigns to identify the file payment resource.
        ConsentId:
          maxLength: 128
          minLength: 1
          type: string
          description: The unique ID that the [ASPSP](https://developer.revolut.com/docs/guides/build-banking-apps/glossary) assigns to identify the consent resource.
        CreationDateTime:
          type: string
          description: 'The date and time when the message was created.


            All dates in the JSON payloads are represented in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date-time format.

            All date-time fields in responses must include the timezone.


            For example: `2017-04-05T10:43:07+00:00`.'
          format: date-time
        Status:
          $ref: '#/components/schemas/OBExternalStatus1Code'
        StatusUpdateDateTime:
          type: string
          description: 'The date and time when the consent resource status was updated.


            All dates in the JSON payloads are represented in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date-time format.

            All date-time fields in responses must include the timezone.


            For example: `2017-04-05T10:43:07+00:00`.'
          format: date-time
        Initiation:
          $ref: '#/components/schemas/OBFileInitiationResponse'
    OBWriteFileResponse2:
      required:
      - Data
      - Links
      - Meta
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/OBWriteDataFileResponse2'
        Links:
          $ref: '#/components/schemas/Links'
        Meta:
          $ref: '#/components/schemas/Meta'
    OBWriteDataFileConsent2:
      required:
      - Initiation
      type: object
      properties:
        Initiation:
          $ref: '#/components/schemas/OBFile2'
    OBFileInitiationResponse:
      type: object
      description: The initiation payload that the initiating party sends to the [ASPSP](https://developer.revolut.com/docs/guides/build-banking-apps/glossary), which is used to request movement of funds using a payment file.
      allOf:
      - $ref: '#/components/schemas/OBFileBase'
      - type: object
        properties:
          DebtorAccount:
            $ref: '#/components/schemas/OBCashAccountDebtorResponse'
      - type: object
        required:
        - FileHash
        - FileType
        - DebtorAccount
  securitySchemes:
    AccessToken:
      type: apiKey
      description: 'Each Open Banking API must contain an authorization header in the following format to make a call: `Bearer <yourAccessToken>`.


        Before you start, ensure that you''ve got an access token with the correct `scope` using the `/token` endpoint.

        You need to get the authorization code first and exchange it for an access token.


        For more information, see [Tutorial: Get account and transaction information](https://developer.revolut.com/docs/guides/build-banking-apps/tutorials/get-account-and-transaction-information) and [Tutorial: Initiate your first payment](https://developer.revolut.com/docs/guides/build-banking-apps/tutorials/initiate-your-first-payment) as examples.'
      name: Authorization
      in: header
    JWS:
      type: apiKey
      description: 'Open Banking API Payment requests additionally require a JSON Web Signature (JWS) which needs to be added to the header of the request.

        The JWS signature must be obtained using the full content of the payload.'
      name: x-jws-signature
      in: header
