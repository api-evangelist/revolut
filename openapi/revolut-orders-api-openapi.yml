  /orders/active:
    get:
      tags:
      - Orders
      summary: Get active orders
      operationId: getActiveOrders
      description: 'Get active crypto exchange orders for the requesting user.

        The user is resolved by the provided API key.'
      parameters:
      - $ref: '#/components/parameters/XRevxTimestamp'
      - $ref: '#/components/parameters/XRevxSignature'
      - name: symbols
        in: query
        description: Filter active orders by specific currency pairs (comma-separated).
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        example: BTC-USD,ETH-USD
      - name: order_states
        in: query
        description: Filter orders by one or more specific states.
        schema:
          type: array
          items:
            type: string
            enum:
            - pending_new
            - new
            - partially_filled
        style: form
        explode: false
        example: new,partially_filled
      - name: order_types
        in: query
        description: Filter orders by specific types (comma-separated).
        schema:
          type: array
          items:
            type: string
            enum:
            - limit
            - conditional
            - tpsl
        style: form
        explode: false
        example: limit,conditional
      - name: side
        in: query
        description: Filter by order direction (Buy or Sell).
        schema:
          type: string
          enum:
          - buy
          - sell
        example: buy
      - name: cursor
        in: query
        description: Pagination cursor obtained from the [`metadata.next_cursor`](https://developer.revolut.com/docs/api/revolut-x-crypto-exchange#get-active-orders#response) property of the previous response.
        schema:
          type: string
          example: ZGF0ZT0xNzY0OTMxNTAyODU0O2lkPTM3YjExMWJlLTcwMzYtNGYzNC1hYWYyLTM4ZDVjYTEyN2M1Yw==
      - name: limit
        in: query
        description: Maximum number of records to return.
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 300
          default: 300
          example: 100
      responses:
        '200':
          description: 'OK


            The list of active orders.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveOrdersPaginatedResponse'
              examples:
                ActiveOrdersPaginatedResponse:
                  summary: Active orders paginated response
                  $ref: '#/components/examples/ActiveOrdersPaginatedResponseExample'
                ActiveTpslOrdersPaginatedResponse:
                  summary: Active orders paginated response with tpsl order
                  $ref: '#/components/examples/ActiveTpslOrdersPaginatedResponseExample'
                ActiveConditionalOrdersPaginatedResponse:
                  summary: Active orders paginated response with conditional order
                  $ref: '#/components/examples/ActiveConditionalOrdersPaginatedResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        5XX:
          $ref: '#/components/responses/ServerError'
  /orders/historical:
    get:
      tags:
      - Orders
      summary: Get historical orders
      operationId: getHistoricalOrders
      description: 'Get historical crypto exchange orders for the requesting user.

        The user is resolved by the provided API key.'
      parameters:
      - $ref: '#/components/parameters/XRevxTimestamp'
      - $ref: '#/components/parameters/XRevxSignature'
      - name: symbols
        in: query
        description: Filter historical orders by specific currency pairs (comma-separated).
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        example: BTC-USD,ETH-USD
      - name: order_states
        in: query
        description: Filter orders by one or more specific states.
        schema:
          type: array
          items:
            type: string
            enum:
            - filled
            - cancelled
            - rejected
            - replaced
        style: form
        explode: false
        example: filled,rejected
      - name: order_types
        in: query
        description: Filter orders by specific types (comma-separated).
        schema:
          type: array
          items:
            type: string
            enum:
            - market
            - limit
            - conditional
            - tpsl
        style: form
        explode: false
        example: market,limit
      - $ref: '#/components/parameters/StartDateQueryParam'
      - $ref: '#/components/parameters/EndDateQueryParam'
      - name: cursor
        in: query
        description: Pagination cursor obtained from the [`metadata.next_cursor`](https://developer.revolut.com/docs/api/revolut-x-crypto-exchange#get-historical-orders#response) property of the previous response.
        schema:
          type: string
          example: ZGF0ZT0xNzY0OTMxNTAyODU0O2lkPTM3YjExMWJlLTcwMzYtNGYzNC1hYWYyLTM4ZDVjYTEyN2M1Yw==
      - name: limit
        in: query
        description: Maximum number of records to return.
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 1900
          default: 1900
          example: 1000
      responses:
        '200':
          description: 'OK


            The list of historical orders.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalOrdersPaginatedResponse'
              examples:
                HistoricalOrdersPaginatedResponse:
                  summary: Historical orders paginated response
                  $ref: '#/components/examples/HistoricalOrdersPaginatedResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        5XX:
          $ref: '#/components/responses/ServerError'
  /orders/{venue_order_id}:
    get:
      tags:
      - Orders
      summary: Get order by ID
      operationId: getOrder
      description: 'Retrieve specific order details by ID.

        The user context is resolved based on the provided API key.'
      parameters:
      - $ref: '#/components/parameters/XRevxTimestamp'
      - $ref: '#/components/parameters/XRevxSignature'
      - name: venue_order_id
        in: path
        required: true
        description: Unique identifier (UUID) of the venue order.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK - Order details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrderDetails'
                required:
                - data
              examples:
                OrderResponse:
                  $ref: '#/components/examples/OrderDetails'
                TpslOrderResponse:
                  $ref: '#/components/examples/TpslOrder'
                ConditionalOrderResponse:
                  $ref: '#/components/examples/ConditionalOrder'
                TriggeredOrderResponse:
                  $ref: '#/components/examples/TriggeredOrder'
                OrderWithOnFillResponse:
                  $ref: '#/components/examples/OrderWithOnFill'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        5XX:
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
      - Orders
      summary: Cancel order by ID
      operationId: cancelOrder
      description: Cancel an active order by its Venue ID.
      parameters:
      - $ref: '#/components/parameters/XRevxTimestamp'
      - $ref: '#/components/parameters/XRevxSignature'
      - name: venue_order_id
        in: path
        required: true
        description: Unique identifier (UUID) of the venue order.
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: OK - Order deleted successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        5XX:
          $ref: '#/components/responses/ServerError'
    put:
      tags:
      - Orders
      summary: Replace order
      operationId: replaceOrder
      description: 'Replace an existing order.

        The user is resolved by the provided API key.


        :::note

        Venue order id of the order will be updated as well.

        :::'
      parameters:
      - $ref: '#/components/parameters/XRevxTimestamp'
      - $ref: '#/components/parameters/XRevxSignature'
      - name: venue_order_id
        in: path
        required: true
        description: Unique identifier (UUID) of the venue order to replace.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        description: Order replacement details.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderReplacementRequest'
            examples:
              ReplaceOrderExample:
                summary: Order replace with multiple params
                $ref: '#/components/examples/ReplaceOrderExample'
              ReplaceOrderExampleSingleParam:
                summary: Order replace with single param
                $ref: '#/components/examples/ReplaceOrderExampleSingleParam'
      responses:
        '200':
          description: 'OK


            The successfully replaced order details.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReplacementResponse'
              examples:
                OrderPlacementResponse:
                  summary: Order replacement response
                  $ref: '#/components/examples/OrderReplacementResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        5XX:
          $ref: '#/components/responses/ServerError'
  /orders/fills/{venue_order_id}:
    get:
      tags:
      - Orders
      summary: Get fills of order by ID
      operationId: getOrderFills
      description: 'Retrieves the fills (trades) associated with a specific order belonging to the client.

        The user context is resolved based on the provided API key.'
      parameters:
      - $ref: '#/components/parameters/XRevxTimestamp'
      - $ref: '#/components/parameters/XRevxSignature'
      - name: venue_order_id
        in: path
        required: true
        description: Unique identifier (UUID) of the venue order
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK - Order fills retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClientTrade'
                required:
                - data
              examples:
                OrderFillsResponse:
                  summary: Order fills Response
                  $ref: '#/components/examples/OrderFillsResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        5XX:
          $ref: '#/components/responses/ServerError'
components:
  schemas:
    Payment-Retrieval:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Payment-Id'
        order_id:
          $ref: '#/components/schemas/Order-Id'
        payment_method:
          type: object
          description: The payment method used to pay for the order.
          discriminator:
            propertyName: type
            mapping:
              revolut_pay: '#/components/schemas/Revolut-Pay'
              card: '#/components/schemas/Card-For-Payment-Details'
              sepa_direct_debit: '#/components/schemas/Sepa-Direct-Debit'
          oneOf:
          - $ref: '#/components/schemas/Revolut-Pay'
          - $ref: '#/components/schemas/Card-For-Payment-Details'
          - $ref: '#/components/schemas/Sepa-Direct-Debit'
        token:
          $ref: '#/components/schemas/Payment-Token'
        amount:
          $ref: '#/components/schemas/Payment-Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        state:
          $ref: '#/components/schemas/Payment-State-v2'
        decline_reason:
          $ref: '#/components/schemas/Decline-Reason-v2'
        authentication_challenge:
          $ref: '#/components/schemas/Authentication-Challenge'
      required:
      - id
      - order_id
      - payment_method
    Full-Name:
      type: string
      description: The full name of the customer.
    Merchant-Order-Url:
      type: string
      format: uri
      pattern: ^https?:\/{2}.+/gi
      maxLength: 2000
      description: 'The URL of the order stored in the merchant''s order management system.


        This URL will be included in the order confirmation email for payments made via Revolut Pay. If specified, this URL will override the default link to the merchant''s **Business website** configured in the Revolut Business account.


        :::warning

        Restrictions:

        - Must be a valid URI as defined by [RFC 3986](https://datatracker.ietf.org/doc/html/rfc3986)

        - URI scheme is required and must be either `http` or `https`

        - URI host is required and cannot be `localhost` or an IP address

        - Max length: `2000`

        - Reserved or invalid characters must be percent-encoded (for example, use `%20` instead of a space)

        :::'
    Marketplace-v3:
      type: object
      description: 'This object is required by Mastercard and Visa for merchants operating as marketplaces under the Merchant Category Code (MCC) `5262`. The marketplace object ensures compliance with the card schemes'' regulations by providing detailed information about the seller involved in the transaction.


        :::info

        These are the specific data field requirements for merchants who must provide marketplace data.


        ```

        seller.id

        seller.name

        seller.website

        seller.phone

        seller.address

        ```

        :::'
      properties:
        seller:
          type: object
          description: Information about the subseller on the marketplace platform.
          properties:
            id:
              type: string
              description: The ID of the seller in the merchant's internal system.
              minLength: 1
              maxLength: 15
            name:
              type: string
              description: The business or legal name of the seller.
              minLength: 1
              maxLength: 50
            website:
              type: string
              format: uri
              pattern: ^https?:\/{2}.+/gi
              maxLength: 255
              description: 'The URL of the website of the seller.


                :::warning

                Restrictions:

                - Must be a valid URI as defined by [RFC 3986](https://datatracker.ietf.org/doc/html/rfc3986)

                - URI scheme is required and must be either `http` or `https`

                - URI host is required and cannot be `localhost` or an IP address

                - Max length: `255`

                - Reserved or invalid characters must be percent-encoded (for example, use `%20` instead of a space)

                :::'
            phone:
              type: string
              description: The phone number of the seller.
            address:
              $ref: '#/components/schemas/Address-v4'
          required:
          - id
          - name
          - website
          - phone
          - address
      required:
      - seller
    Revolut-Pay-Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 'ID of the saved payment method.


            :::note

            The `id` parameter is only returned when the payment method is saved.

            :::'
        type:
          $ref: '#/components/schemas/Payment-Method-Type'
        fingerprint:
          $ref: '#/components/schemas/Fingerprint'
      required:
      - type
    Sepa-Direct-Debit:
      type: object
      description: 'Object containing details of a SEPA Direct Debit payment.


        :::info

        For more information, see: [SEPA Direct Debit server-to-server integration](https://developer.revolut.com/docs/guides/merchant/accept-payments/payment-methods/sepa-direct-debit/server-to-server)

        :::'
      properties:
        id:
          type: string
          format: uuid
          description: 'ID of the saved payment method.


            :::note

            The `id` parameter is only returned when the payment method is saved for the merchant.

            :::'
        type:
          $ref: '#/components/schemas/Payment-Method-Type'
        debtor_iban_last_four:
          $ref: '#/components/schemas/Sepa-Direct-Debit-Debtor-Iban-Last-Four'
        debtor_name:
          $ref: '#/components/schemas/Sepa-Direct-Debit-Debtor-Name'
        mandate_reference:
          $ref: '#/components/schemas/Sepa-Direct-Debit-Mandate-Reference'
      required:
      - type
    Customer-v2:
      type: object
      description: "Object containing information about a customer.\n\nIf you have it, we strongly advise providing at least either `id`, `phone`, or `email`.\n\nUsing the [Customers operations](https://developer.revolut.com/docs/api/merchant#tag-customers), you can manage customer instances.\n\nThe following behaviours apply to different use cases:\n\n  | Use case | API behavior |\n  | -------- | ------------ |\n  | Existing customer | If `id` was provided, we ignore other customer details and associate the customer with the order.<br/><br/>If either `email`, `phone`, or `full_name` was provided (without an existing customer's `id`), we always create a new customer, irrespective of another, existing customer object having the same details. |\n  | New customer | If either `email`, `phone`, or `full_name` was provided, we create a new customer, irrespective of another customer object having the same details. <br/><br/>If `id` of a non-existent customer was provided, we return a `404` error, irrespective of other details provided. |\n\n:::note\nTo avoid unintentional duplication of customer records, search for an existing customer by email or phone using the [List customers](https://developer.revolut.com/docs/api/merchant#retrieve-customer-list) endpoint first, then provide `customer.id` in the order.\n:::"
      properties:
        id:
          type: string
          format: uuid
          description: 'Permanent ID of a customer used to retrieve, update, delete a customer. This ID can also be used to link customer to an order.


            :::note

            If you provide the customer''s ID during order creation, no other customer data is required, they will be parsed automatically from the referenced customer object.

            :::'
        full_name:
          $ref: '#/components/schemas/Full-Name'
        phone:
          $ref: '#/components/schemas/Phone'
        email:
          $ref: '#/components/schemas/Email'
        date_of_birth:
          $ref: '#/components/schemas/Date-Of-Birth'
    Card-Checks-v2:
      type: object
      description: The details of the check for card payment. Only for orders with successful payments.
      properties:
        three_ds:
          type: object
          description: 'The details of the 3D Secure check. Only for orders with successful payments.


            :::note

            Not returned for Apple Pay and Google Pay payments.

            :::'
          properties:
            eci:
              type: string
              description: The Electronic Commerce Indicator (ECI) value corresponds to the authentication result and indicates the level of security used when the payment information was provided.
            state:
              type: string
              description: The result of 3D Secure check.
              enum:
              - verified
              - failed
              - challenge
            version:
              type: integer
              description: The 3D Secure version.
        cvv_verification:
          type: string
          description: 'The result of CVV verification.


            | Parameter value | Description |

            | ----- | ----------- |

            | `match` | CVV matches the card''s CVV |

            | `not_match` | CVV does not match the card''s CVV |

            | `incorrect` | CVV format is incorrect for this type of card |

            | `not_processed` | CVV verification was not performed |'
          enum:
          - match
          - not_match
          - incorrect
          - not_processed
        address:
          type: string
          description: The result of address verification.
          enum:
          - match
          - not_match
          - n_a
          - invalid
        postcode:
          type: string
          description: The result of postcode verification.
          enum:
          - match
          - not_match
          - n_a
          - invalid
        cardholder:
          type: string
          description: The result of cardholder verification.
          enum:
          - match
          - not_match
          - n_a
          - invalid
    Payment-Updated:
      type: string
      format: date-time
      description: The date and time the payment was last updated.
    Decline-Reason-v2:
      type: string
      description: 'The reason for a `failed` or `declined` payment.


        A failed or declined payment can result from multiple reasons. To learn more, check our [failure reasons](https://developer.revolut.com/docs/guides/merchant/reference/error-codes/decline-reasons).'
      enum:
      - 3ds_challenge_abandoned
      - 3ds_challenge_failed_manually
      - cardholder_name_missing
      - customer_challenge_abandoned
      - customer_challenge_failed
      - customer_name_mismatch
      - do_not_honour
      - expired_card
      - high_risk
      - insufficient_funds
      - invalid_address
      - invalid_amount
      - invalid_card
      - invalid_country
      - invalid_cvv
      - invalid_email
      - invalid_expiry
      - invalid_merchant
      - invalid_phone
      - invalid_pin
      - issuer_not_available
      - pick_up_card
      - rejected_by_customer
      - restricted_card
      - suspected_fraud
      - technical_error
      - transaction_not_allowed_for_cardholder
      - unknown_card
      - withdrawal_limit_exceeded
    OrderReplacementRequest:
      type: object
      description: 'Request to replace an existing open order with a new one, atomically cancelling the original.

        Only the fields provided in the request are updated; omitted fields are inherited from the original order

        (with the exception of sizes, which may be recalculated to preserve the counter-side amount — see field docs).'
      required:
      - client_order_id
      properties:
        client_order_id:
          type: string
          format: uuid
          description: 'Client-generated unique identifier for the replacement request, used to guarantee idempotency.

            Retries with the same value will not create duplicate replacements.'
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        base_size:
          type: string
          format: decimal
          description: 'New amount of base currency for the replacement order.

            If only the price is provided, without the quantity or amount, this parameter will stay the same for SELL orders and be recalculated for BUY orders.'
          example: '0.1'
        quote_size:
          type: string
          format: decimal
          description: 'New amount of quote currency for the replacement order.

            If only the price is provided, without the quantity or amount, this parameter will stay the same for BUY orders and be recalculated for SELL orders.'
          example: '0.1'
        price:
          type: string
          format: decimal
          description: 'New limit price for the replacement order.

            If omitted, the original order''s price is preserved.'
          example: '50000.50'
        time_in_force:
          type: string
          enum:
          - gtc
          - ioc
          description: 'New time in force for the replacement order.

            If omitted, the original order''s time in force is preserved.'
        execution_instructions:
          type: array
          description: 'Execution instructions applied to the replacement order, overriding those of the original.

            Pass an empty array `[]` to explicitly clear all instructions.

            If the field is omitted entirely, the original order''s instructions are preserved.'
          minItems: 0
          items:
            type: string
            enum:
            - allow_taker
            - post_only
          example:
          - allow_taker
    Three-Ds-Fingerprint:
      title: three_ds_fingerprint
      type: object
      description: Information about the 3DS fingerprint challenge.
      properties:
        type:
          $ref: '#/components/schemas/Authentication-Challenge-Type'
        fingerprint_url:
          type: string
          format: url
          description: The URL of the fingerprint. (Used only internally by Revolut.)
        fingerprint_data:
          type: string
          format: JSON
          description: 'Data about the fingerprint used for authentication. (Used only internally

            by Revolut.)'
      required:
      - type
      - fingerprint_url
      - fingerprint_data
    Payment-Risk-Level:
      type: string
      description: 'The risk level of the card.


        If the risk level is `high`, the payment might be declined.'
      enum:
      - low
      - high
    MarketOrderConfiguration:
      type: object
      description: Market order configuration. Must contain exactly one of 'base_size' or 'quote_size'.
      properties:
        base_size:
          type: string
          format: decimal
          description: Amount of base currency.
          example: '0.1'
        quote_size:
          type: string
          format: decimal
          description: Amount of quote currency.
          example: '0.1'
    Fees:
      type: array
      description: The details of the order fee.
      items:
        $ref: '#/components/schemas/Fee'
    Order-Creation-v7:
      type: object
      description: Object schema containing information about order creation body request parameters.
      properties:
        amount:
          $ref: '#/components/schemas/Order-Amount-v2'
        currency:
          $ref: '#/components/schemas/Currency'
        settlement_currency:
          $ref: '#/components/schemas/Settlement-Currency'
        description:
          $ref: '#/components/schemas/Order-Description'
        customer:
          $ref: '#/components/schemas/Customer-v2'
        enforce_challenge:
          $ref: '#/components/schemas/Enforce-Challenge-v2'
        line_items:
          $ref: '#/components/schemas/Line-Items'
        shipping:
          $ref: '#/components/schemas/Shipping'
        capture_mode:
          $ref: '#/components/schemas/Capture-Mode-v2'
        authorisation_type:
          $ref: '#/components/schemas/Authorisation-Type'
        cancel_authorised_after:
          $ref: '#/components/schemas/Cancel-Authorised-After-v2'
        expire_pending_after:
          $ref: '#/components/schemas/Expire-Pending-After'
        location_id:
          $ref: '#/components/schemas/Location-Id'
        metadata:
          $ref: '#/components/schemas/Metadata'
        industry_data:
          $ref: '#/components/schemas/Industry-Data-v3'
        merchant_order_data:
          $ref: '#/components/schemas/Merchant-Order-Data'
        upcoming_payment_data:
          $ref: '#/components/schemas/Upcoming-Payment'
        redirect_url:
          $ref: '#/components/schemas/Redirect-Url'
        statement_descriptor_suffix:
          $ref: '#/components/schemas/Statement-Descriptor-Suffix'
      required:
      - amount
      - currency
    Lodging-Category:
      type: string
      enum:
      - bed_and_breakfast
      - hostel
      - hotel
      - short_term_rental
      - other
      description: The type of the accommodation associated with the booking.
    Journey-Legs:
      type: array
