        :::'
    Incremental-Authorisations:
      type: array
      description: 'History of incremental authorisation attempts for this order.


        Only present for orders with `authorisation_type: pre_authorisation`.


        Contains all increment attempts in chronological order.'
      items:
        $ref: '#/components/schemas/Incremental-Authorisation'
