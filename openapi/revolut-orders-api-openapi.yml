      required:
      - type
    Upcoming-Payment:
      type: object
      description: Object containing information about upcoming payments associated with the order.
      properties:
        date:
          type: string
          format: date-time
          description: The date and time in [ISO 8601 format](https://en.wikipedia.org/wiki/ISO_8601) when the upcoming payment is scheduled to be executed.
        payment_method_id:
          type: string
          description: "The unique ID of the customer's payment method used to complete the scheduled payment.\n\n:::info\nFor more information about operations related to customer's payment methods, see:\n  - [Retrieve payment method list of a customer](https://developer.revolut.com/docs/api/merchant#retrieve-payment-method-list)\n  - [Retrieve a customer's payment method](https://developer.revolut.com/docs/api/merchant#retrieve-payment-method)\n  - [Update a customer's payment method](https://developer.revolut.com/docs/api/merchant#update-payment-method)\n  - [Delete a customer's payment method](https://developer.revolut.com/docs/api/merchant#delete-payment-method)\n:::"
      required:
      - date
      - payment_method_id
    Fee:
      type: object
      properties:
        type:
          type: string
          description: The type of the order fee.
          enum:
          - fx
          - acquiring
        amount:
          type: integer
          description: The amount of the payment fee (minor currency unit). For example, enter `7034` for €70.34 in the field.
        currency:
          type: string
          description: 'The currency of the payment fee. [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code in upper case.


            :::info

            For more information about the supported currencies, see: [Help Center](https://help.revolut.com/business/help/merchant-accounts/payments/in-which-currencies-can-i-accept-payments/).

            :::'
    Shipment:
      type: object
      description: Details of an individual shipment.
      properties:
        shipping_company_name:
          type: string
          maxLength: 250
          description: Name of the company handling the shipment.
        tracking_number:
          type: string
          maxLength: 500
          description: Unique tracking number for the shipment.
        estimated_delivery_date:
          type: string
          format: date-time
          description: "Estimated delivery date and time for the shipment. \nThe time should also include the customer's timezone."
        tracking_url:
          type: string
          format: uri
          pattern: ^https?:\/{2}.+/gi
          maxLength: 2000
          description: 'An HTTP/HTTPS URL where the shipment can be tracked.


            :::warning

            Restrictions:

            - Must be a valid URI as defined by [RFC 3986](https://datatracker.ietf.org/doc/html/rfc3986)

            - URI scheme is required and must be either `http` or `https`

            - URI host is required and cannot be `localhost` or an IP address

            - Max length: `2000`

            - Reserved or invalid characters must be percent-encoded (for example, use `%20` instead of a space)

            :::'
      required:
      - shipping_company_name
      - tracking_number
    ActiveOrdersPaginatedResponse:
      type: object
      required:
      - data
      - metadata
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        metadata:
          type: object
          required:
          - timestamp
          properties:
            timestamp:
              type: integer
              format: int64
              description: Timestamp in Unix epoch milliseconds.
            next_cursor:
              type: string
              description: 'Cursor used to retrieve the next page of results.


                To continue paginating through the results, make a new request and pass this value in the [`cursor`](https://developer.revolut.com/docs/api/revolut-x-crypto-exchange#get-active-orders#request) query parameter.'
    Tax:
      type: object
      description: Details about a tax applied to the line item, including its name and the corresponding amount.
      properties:
        name:
          type: string
          description: The specific name or designation of the tax applied to the line item.
          maxLength: 100
        amount:
          type: integer
          format: int64
          description: The monetary value of the tax in minor currency units (e.g., cents for EUR).
          minimum: 0
      required:
      - name
      - amount
    Lodging-Booking-Type:
      type: string
      enum:
      - fixed
      - flexible
      description: 'Indicates whether the booking terms are fixed or flexible.


        | Parameter value | Description |

        | --------------- | ----------- |

        | `fixed`         | Non-modifiable once confirmed. |

        | `flexible`      | Allows modifications or cancellations under specified conditions.'
    Order-Token:
      type: string
      description: 'Temporary ID for the order, which expires when the payment is authorised.


        The order `token` is used for [token-based initialisation](https://developer.revolut.com/docs/sdks/merchant-web-sdk/initialisation/token-based), and is returned by the `createOrder` callback in the following payment methods:


        - [Embedded Checkout](https://developer.revolut.com/docs/sdks/merchant-web-sdk/payment-methods/embedded-checkout#embedded-checkout-options-interface)

        - [Revolut Pay](https://developer.revolut.com/docs/sdks/merchant-web-sdk/payment-methods/revolut-pay#widget-payments-revolut-pay-options)

        - [Apple Pay and Google Pay](https://developer.revolut.com/docs/sdks/merchant-web-sdk/payment-methods/apple-pay-google-pay#payment-request-options-interface)

        - [Pay by Bank](https://developer.revolut.com/docs/sdks/merchant-web-sdk/payment-methods/pay-by-bank#pay-by-bank-options-interface)'
    Guest:
      type: object
      properties:
        first_name:
          type: string
          description: Guest's first name.
        last_name:
          type: string
          description: Guest's last name.
      required:
      - first_name
      - last_name
    Order-Capture-v2:
      type: object
      description: 'Order capture request parameters.


        You can optionally provide line items when capturing an order. This is useful when you need to adjust the final order details at capture time (for example, when doing partial captures with specific items, or when the final delivered items differ from the initial authorisation).


        :::warning

        If you provide `line_items` when capturing, they will **overwrite** the original line items that were provided during order creation or update. Make sure to include all the items you want to be associated with the captured order.

        :::'
      properties:
        amount:
          $ref: '#/components/schemas/Order-Capture-Amount'
        line_items:
          $ref: '#/components/schemas/Line-Items'
    Payment-Id:
      type: string
      format: uuid
      description: The ID of the payment.
    Payment-State-v2:
      type: string
      description: The status of the payment.
      enum:
      - pending
      - authentication_challenge
      - authentication_verified
      - authorisation_started
      - authorisation_passed
      - authorised
      - capture_started
      - captured
      - refund_validated
      - refund_started
      - cancellation_started
      - declining
      - completing
      - cancelling
      - failing
      - completed
      - declined
      - soft_declined
      - cancelled
      - failed
    Events-v2:
      type: object
      description: 'Object containing booking information for a list of event tickets associated with the order.


        :::info

        These are the specific data field requirements for merchants who must provide event data. Note that these requirements can be extended on a case by case basis as decided by Revolut.


        ```

        booking_id

        events[].start_date

        events[].end_date

        events[].supplier

        events[].tickets[].id

        ```

        :::'
      properties:
        booking_id:
          $ref: '#/components/schemas/Booking-Id'
        events:
          type: array
          description: A list of events associated with the booking.
          items:
            $ref: '#/components/schemas/Event'
      required:
      - booking_id
    Order-Update-v7:
      type: object
      description: Object schema containing information about order update body request parameters.
      properties:
        amount:
          $ref: '#/components/schemas/Order-Amount-v2'
        currency:
          $ref: '#/components/schemas/Currency'
        settlement_currency:
          $ref: '#/components/schemas/Settlement-Currency'
        description:
          $ref: '#/components/schemas/Order-Description'
        customer:
          $ref: '#/components/schemas/Customer-v2'
        enforce_challenge:
          $ref: '#/components/schemas/Enforce-Challenge-v2'
        line_items:
          $ref: '#/components/schemas/Line-Items'
        shipping:
          $ref: '#/components/schemas/Shipping'
        capture_mode:
          $ref: '#/components/schemas/Capture-Mode-v2'
        cancel_authorised_after:
          $ref: '#/components/schemas/Cancel-Authorised-After-v2'
        expire_pending_after:
          $ref: '#/components/schemas/Expire-Pending-After'
        metadata:
          $ref: '#/components/schemas/Metadata'
        industry_data:
          $ref: '#/components/schemas/Industry-Data-v3'
        merchant_order_data:
          $ref: '#/components/schemas/Merchant-Order-Data'
        upcoming_payment_data:
          $ref: '#/components/schemas/Upcoming-Payment'
        redirect_url:
          $ref: '#/components/schemas/Redirect-Url'
        statement_descriptor_suffix:
          $ref: '#/components/schemas/Statement-Descriptor-Suffix'
    Refund-Amount:
      type: integer
      description: The amount to be refunded, specified in the smallest currency unit (e.g., cents for USD, pence for GBP).
      example: 100
    ExecutionInstructions:
      type: array
      description: 'List of execution instructions for the order.

        Can be provided as an empty array `[]` if no specific instructions are required.'
      minItems: 0
      items:
        type: string
        enum:
        - allow_taker
        - post_only
      example: []
      default:
      - allow_taker
    OrderPlacementRequest:
      type: object
      required:
      - client_order_id
      - symbol
      - order_configuration
      - side
      properties:
        client_order_id:
          type: string
          format: uuid
          description: Unique identifier for idempotency.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        symbol:
          type: string
          description: The trading pair symbol.
          example: BTC-USD
        side:
          $ref: '#/components/schemas/Side'
        order_configuration:
          type: object
          description: Configuration for the order. Must contain exactly one of 'limit' or 'market'.
          properties:
            limit:
              description: Limit order configuration. Must contain exactly one of 'base_size' or 'quote_size'.
              $ref: '#/components/schemas/LimitOrderConfiguration'
            market:
              description: Market order configuration. Must contain exactly one of 'base_size' or 'quote_size'.
              $ref: '#/components/schemas/MarketOrderConfiguration'
    Terminal-Hardware-Id:
      type: string
      description: 'The hardware identifier of the Revolut Terminal device used to process the payment.


        :::note

        Only present for card-present transactions processed via Revolut Terminal.

        :::'
    Three-Ds-Fingerprint-v2:
      title: three_ds_fingerprint
      type: object
      description: Information about the 3DS fingerprint challenge.
      properties:
        type:
          $ref: '#/components/schemas/Authentication-Challenge-Type'
        fingerprint_html:
          type: string
          format: byte
          description: 'Base64-encoded HTML string for the 3DS fingerprint challenge. This HTML is fully

            constructed by Revolut — no modifications are needed.


            Decode this value using a `base64` decoder and render the resulting HTML in your

            front-end application. Revolut automatically moves the payment to the full 3DS

            challenge if the fingerprint is not handled within 15 seconds.'
      required:
      - type
      - fingerprint_html
    Lodging-v3:
      type: object
      description: 'Object containing details of a lodging booking.


        :::info

        These are the specific data field requirements for merchants who must provide lodging data. Note that these requirements can be extended on a case by case basis as decided by Revolut.


        ```

        booking_id

        lodgings[].check_in_date

        lodgings[].check_out_date

        lodgings[].supplier.payment_date

        ```

        :::'
      properties:
        booking_id:
          $ref: '#/components/schemas/Booking-Id'
        lodgings:
          type: array
          description: List of lodging entries associated with this booking.
          items:
            $ref: '#/components/schemas/Lodging-Item'
      required:
      - booking_id
    Revolut-Pay:
      discriminator:
        propertyName: subtype
        mapping:
          revolut_pay_account: '#/components/schemas/RPay-Account'
          revolut_pay_card: '#/components/schemas/RPay-Card'
      oneOf:
      - $ref: '#/components/schemas/RPay-Account'
      - $ref: '#/components/schemas/RPay-Card'
    Authentication-Challenge-Type:
      type: string
      enum:
      - three_ds
      - three_ds_fingerprint
      description: Type of the authentication challenge the payment triggers.
    Google-Pay:
      type: object
      description: Object containing details of a card used via Google Pay.
      properties:
        id:
          type: string
          format: uuid
          description: 'ID of the saved payment method.


            :::note

            The `id` parameter is only returned when the payment method is saved.

            :::'
        type:
          $ref: '#/components/schemas/Payment-Method-Type'
        card_brand:
          type: string
          description: The type of the card.
          enum:
          - visa
          - mastercard
          - american_express
        funding:
          type: string
          description: The type of card funding.
          enum:
          - credit
          - debit
          - prepaid
        card_country_code:
          type: string
          description: The 2-letter country code of the country where the card was issued.
        card_bin:
          type: string
          description: The BIN of the card.
          minLength: 6
          maxLength: 6
        card_last_four:
          type: string
          description: The last four digits of the card number.
          minLength: 4
          maxLength: 4
        card_expiry:
          type: string
          format: MM/YY
          description: The expiry date of the card in the format of MM/YY.
        cardholder_name:
          type: string
          description: The name of the cardholder.
        checks:
          $ref: '#/components/schemas/Card-Checks-v2'
        authorisation_code:
          $ref: '#/components/schemas/Authorisation-Code'
        arn:
          $ref: '#/components/schemas/Arn'
        capture_deadline:
          $ref: '#/components/schemas/Capture-Deadline'
        terminal_hardware_id:
          $ref: '#/components/schemas/Terminal-Hardware-Id'
        fingerprint:
          $ref: '#/components/schemas/Fingerprint'
        network_transaction_id:
          $ref: '#/components/schemas/Network-Transaction-Id'
      required:
      - type
    Order-Customer-v2:
      title: Order customer
      type: object
      description: 'A lightweight customer object embedded in an order.


        This is a simplified representation intended for the order context. For the full customer object including all payment methods, use the [Retrieve a customer](https://developer.revolut.com/docs/api/merchant#retrieve-customer) endpoint.'
      properties:
        id:
          $ref: '#/components/schemas/Customer-Id'
        email:
          $ref: '#/components/schemas/Email'
        phone:
          $ref: '#/components/schemas/Phone'
        full_name:
          $ref: '#/components/schemas/Full-Name'
        date_of_birth:
          $ref: '#/components/schemas/Date-Of-Birth'
      required:
      - id
    Subscription-Active-Cycle-Id:
      type: string
      format: uuid
      description: 'The unique identifier of the active (pre-paid) subscription cycle that this order collects payment for.


        This is the current billing cycle whose recurring charges are being collected in advance by this order. For example, if a subscription cycle covers 1-31 July and the order is generated on 1 July, this field identifies that July cycle.'
    Authorisation-Type:
      type: string
      description: 'The type of authorisation for the order. Used with manual capture mode. If omitted, `final` is used by default.


        ### Pre-authorisation


        Pre-authorisation allows you to reserve funds on a customer''s card without immediately capturing them. This is useful for scenarios like:


        - Hotel bookings where the final amount may vary

        - Car rentals where additional charges may apply

        - Deposits that need to be held temporarily


        | Parameter value | Description |

        | --------------- | ----------- |

        | `final` | Standard authorisation for immediate or near-immediate capture. |

        | `pre_authorisation` | Reserve funds for later capture, used with manual capture mode. |


        :::note

        Pre-authorisation must be used with `capture_mode: manual`. For more information, see [Capture an order](https://developer.revolut.com/docs/api/merchant#capture-order).

        :::'
      default: final
      enum:
      - final
      - pre_authorisation
    Crypto-Transactions-v3:
      type: object
      description: 'Object containing information about crypto transactions associated with the order.


        :::info

        Processing crypto on-ramp transactions with Revolut has additional compliance requirements. Please reach out to your account executive for additional details.


        **Required data fields for crypto services:**


        ```

        transactions[].id

        transactions[].status

        transactions[].recipient_wallet_id

        seller.id

        seller.name

        seller.website

        seller.phone

        seller.address

        seller.mcc

        customer.full_name

        customer.date_of_birth

        ```


        Note that these requirements can be extended on a case by case basis as decided by Revolut.

        :::'
      properties:
        transactions:
          type: array
          description: Array of crypto transaction data associated with the order.
          items:
            $ref: '#/components/schemas/Crypto-Transaction'
          minItems: 1
        seller:
          type: object
          description: 'Information about the crypto conversion affiliate.


            This should be provided when a customer completes a payment on a subseller''s website rather than directly on the merchant''s website, providing insight into the type of business conducted by the subseller.


            :::note

            This needs to be provided only by crypto on-ramp providers for payments they are processing for conversion affiliates.


            For their own payments, `seller` can be omitted.

            :::'
          properties:
            mcc:
              type: string
              description: A string representing the four-digit [Merchant Category Code (MCC)](https://en.wikipedia.org/wiki/Merchant_category_code) of the conversion affiliate.
              maxLength: 4
              minLength: 4
              pattern: ^\d{4}$
            id:
              type: string
              description: The ID of the seller in the merchant's internal system.
              minLength: 1
              maxLength: 15
            name:
              type: string
              description: The business or legal name of the seller.
              minLength: 1
              maxLength: 50
            website:
              type: string
              format: uri
              pattern: ^https?:\/{2}.+/gi
              maxLength: 255
              description: 'The URL of the website of the seller.


                :::warning

                Restrictions:

                - Must be a valid URI as defined by [RFC 3986](https://datatracker.ietf.org/doc/html/rfc3986)

                - URI scheme is required and must be either `http` or `https`

                - URI host is required and cannot be `localhost` or an IP address

                - Max length: `255`

                - Reserved or invalid characters must be percent-encoded (for example, use `%20` instead of a space)

                :::'
            phone:
              type: string
              description: The phone number of the seller.
            address:
              $ref: '#/components/schemas/Address-v4'
          required:
          - id
          - name
          - website
          - phone
          - address
          - mcc
      required:
      - transactions
    Subscription-Settled-Cycle-Id:
      type: string
      format: uuid
      description: 'The unique identifier of the settled (post-paid) subscription cycle whose usage-based charges this order collects.


        This is the previous billing cycle whose usage is being settled by this order. For example, if a subscription cycle covers usage from 1-30 June and the order is generated on 10 July, this field identifies that June cycle.'
    Order-Capture-Amount:
      type: integer
      description: 'Specify an amount to capture, in minor currency units. The amount must not exceed the authorised amount.


        An order can only be captured once. Partial capture is supported by sending an amount lower than the authorised amount. The uncaptured amount will be voided.


        If you resend a capture request for an order that is already captured, no additional capture is performed. Resending with the same amount returns the current order state, while resending with a different amount returns an error.


        If not provided, it defaults to the authorised amount (full capture will be executed).'
    Payment-v3:
      type: object
      description: 'Represents a payment for an order.


        For pre-authorised payments, the `authorised_amount` field tracks the currently authorised amount, which may differ from `amount` during incremental authorisation processing.'
      properties:
        id:
          $ref: '#/components/schemas/Payment-Id'
        state:
          $ref: '#/components/schemas/Payment-State-v2'
        decline_reason:
          $ref: '#/components/schemas/Decline-Reason-v2'
        bank_message:
          $ref: '#/components/schemas/Bank-Message'
        created_at:
          $ref: '#/components/schemas/Payment-Created'
        updated_at:
          $ref: '#/components/schemas/Payment-Updated'
        token:
          $ref: '#/components/schemas/Payment-Token'
        amount:
          $ref: '#/components/schemas/Payment-Amount'
        authorised_amount:
          $ref: '#/components/schemas/Payment-Authorised-Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        settled_amount:
          $ref: '#/components/schemas/Payment-Settled-Amount'
        settled_currency:
          $ref: '#/components/schemas/Payment-Settled-Currency'
        payment_method:
          $ref: '#/components/schemas/Payment-Method-v2'
        authentication_challenge:
          $ref: '#/components/schemas/Authentication-Challenge-v2'
        billing_address:
          $ref: '#/components/schemas/Address-v2'
        risk_level:
          $ref: '#/components/schemas/Payment-Risk-Level'
        fees:
          $ref: '#/components/schemas/Fees'
        payer:
          $ref: '#/components/schemas/Payer'
      required:
      - id
      - state
      - created_at
      - updated_at
      - amount
    Capture-Mode-v2:
      type: string
      description: 'The capture mode of the order. `automatic` is used by default.


        | Parameter value | Description |

        | --------------- | ----------- |

        | `automatic` | The order is captured automatically after payment authorisation. |

        | `manual` | The order is not captured automatically. You must manually capture the order later. |


        :::info

        For more information, see [Capture an order](https://developer.revolut.com/docs/api/merchant#capture-order).

        :::'
      default: automatic
      enum:
      - automatic
      - manual
    Subscription-Data:
      title: Subscription data
      type: object
      required:
      - subscription_id
      - billing_reason
      description: 'Subscription details linked to the order. Use this object to match an order with its underlying subscription and understand the billing context in which the order was created.


        Only present on orders created by a subscription.'
      properties:
        subscription_id:
          $ref: '#/components/schemas/Subscription-Id'
        active_cycle_id:
          $ref: '#/components/schemas/Subscription-Active-Cycle-Id'
        settled_cycle_id:
          $ref: '#/components/schemas/Subscription-Settled-Cycle-Id'
        billing_reason:
          $ref: '#/components/schemas/Subscription-Order-Billing-Reason'
    Metadata:
      type: object
      description: 'Additional information to track your orders in your system, by providing custom metadata using `"<key>" : "<value>"` pairs.


        :::warning

        **Restrictions:**


        - Both keys and values must be `string`s

        - Values cannot be `null`.

        - Max number of key-value pairs: `50`

        - Max length of values: `500` characters

        - Format of keys: Must start with a letter and contain only letters, digits, and underscores. Max 40 characters. Pattern: `^[a-zA-Z][a-zA-Z\\d_]{0,39}$`

        :::'
      maxProperties: 50
      additionalProperties:
        type: string
        maxLength: 500
        description: Additional metadata value provided with the corresponding metadata key.
      example:
        order_reference: ORD-12345
        customer_segment: premium
        internal_note: VIP customer - priority handling
    Car-Rental-v2:
      type: object
      description: 'Object containing additional information about a car rental booking associated with the order.


        :::info

        These are the specific data field requirements for merchants offering car rental. Note that these requirements can be extended on a case by case basis as decided by Revolut.


        ```

        booking_id

        drop_off_date

        refundability

        ```

        :::'
      properties:
        booking_id:
          $ref: '#/components/schemas/Booking-Id'
        pick_up_date:
          type: string
          format: date-time
          description: The UTC date and time of the pick-up.
        pick_up_location:
          $ref: '#/components/schemas/Address-v2'
        drop_off_date:
          type: string
          format: date-time
          description: The UTC date and time of the drop-off.
        drop_off_location:
          $ref: '#/components/schemas/Address-v2'
        refundability:
          $ref: '#/components/schemas/Refundability'
        distance_limit:
          type: object
          description: Object containing distance limit information.
          properties:
            limit:
              type: integer
              description: The maximum distance allowed.
            unit:
              type: string
              description: The unit of distance.
              enum:
              - miles
              - km
            additional_distance_cost:
              type: object
              description: Cost for exceeding the distance limit.
              properties:
                amount:
                  type: integer
                  description: The amount of the cost in minor currency units. For example, enter `7034` for €70.34.
                currency:
                  $ref: '#/components/schemas/Currency'
      required:
      - booking_id
      - drop_off_date
    Network-Transaction-Id:
      type: string
      description: 'The Network Transaction ID (NTI) is a unique identifier assigned by the card scheme (e.g., Visa or Mastercard) to a card transaction.


        It can be used to trace the transaction across the payment network, link recurring or instalment payments to the original authorisation, and support dispute resolution.'
    LimitOrderConfiguration:
      type: object
      required:
      - price
      properties:
        base_size:
          type: string
          format: decimal
          description: Amount of base currency.
          example: '0.1'
        quote_size:
          type: string
          format: decimal
          description: Amount of quote currency.
          example: '0.1'
        price:
          type: string
          format: decimal
          description: The limit price.
          example: '50000.50'
        time_in_force:
          type: string
          enum:
          - gtc
          - ioc
          description: "Time in force for limit orders.\nIndicates how long the order should remain active before it's either executed or cancelled.\nPossible values:\n\n- `gtc`: Good till cancelled.\n  Means that the order stays active until it's either completely filled or it's manually cancelled by the user who created the order.\n- `ioc`: Immediate or cancel.\n  Means that any portion of the order that cannot be filled immediately will be cancelled."
        execution_instructions:
          $ref: '#/components/schemas/ExecutionInstructions'
    OnFill:
      type: object
      description: 'Details of the Take Profit/Stop Loss exit strategy order linked to the current order.

        The linked TPSL order will be submitted once the current order is filled.'
      properties:
        take_profit:
          description: 'Details of the associated Take Profit trigger.

            At least one of `stop_loss` or `take_profit` will be present.'
          $ref: '#/components/schemas/OrderTrigger'
        stop_loss:
          description: 'Details of the associated Stop Loss trigger.

            At least one of `stop_loss` or `take_profit` will be present.'
          $ref: '#/components/schemas/OrderTrigger'
        id:
          type: string
          format: uuid
          description: 'ID of the linked TPSL order.

            Present only when the current order has been filled.'
    Statement-Descriptor-Suffix:
      type: string
      description: "You can set a dynamic statement descriptor for your orders by providing a custom suffix. \n\nA statement descriptor is the text shown on cardholders' bank or card statements, helping them recognise a transaction or merchant. This field can be used to send extra information with the statement descriptor for card transactions.\n\nThe complete descriptor is built using the following format: `{base}*{suffix}`, where:\n  \n  - **`{base}`** is the existing descriptor configured in the Revolut Business dashboard (**Settings > Business account > Merchant profile > Statement descriptor**).  \n  - **`{suffix}`** is defined by the `statement_descriptor_suffix` field.\n\n:::note\n- If the combined descriptor's length (base + suffix) exceeds the character limits of card scheme providers, the final value will be truncated. For example if the limit is 22 characters, the base descriptor is `\"base\"` and the suffix is `\"testdescriptorsuffix\"`, the final descriptor becomes `\"base*testdescriptorsuf\"`.\n- The final statement descriptor shown on a cardholder's statement may vary by issuing bank, as some banks apply their own custom formatting or truncation rules.\n:::"
      minLength: 1
      maxLength: 19
      pattern: ^[^*\n\r\\]+$
    Line-Items:
      type: array
      maxItems: 250
      description: 'An array of line items included in the order. Each line item represents an individual product or service, along with its quantity, price, taxes, and discounts.


        :::info

        Required for merchants collecting payment for one or multiple products/services in one transaction. Omitting this information may trigger additional scrutiny and risk mitigation actions by Revolut.

        :::'
      items:
        $ref: '#/components/schemas/Line-Item'
    Fingerprint:
      type: string
      minLength: 44
      maxLength: 44
      description: "A unique identifier for a payment method, always 44 characters long. This fingerprint can be used to uniquely identify various payment methods.\n\n#### Fingerprint generation\n\n| Payment method | Description |\n| -------- | ----------- |\n| **All payment methods** | A fingerprint is generated for all payment methods, including cards, Revolut Pay (card, account-to-account payments), Apple Pay, and Google Pay. |\n| **Cards (Revolut Pay & Card Gateway)** | For cards, the fingerprint is based on the PAN. Cards processed via Revolut Pay and our card gateway will share the same fingerprint. Renewed cards (new expiry/CVV) retain the same fingerprint for efficient blocking. |\n| **Apple Pay & Google Pay** | Since Apple Pay and Google Pay provide us Device PANs (DPAN), the fingerprint is based on the DPAN provided by Apple/Google, not the connected card's PAN. This means that a new DPAN (and fingerprint) is generated for cards in case they are re-added to the customer's digital wallet, or added to different devices. |\n\n#### Detecting duplicate payment methods\n\nFingerprints are a valuable tool for detecting duplicate payment methods by identifying if a payment method has been seen before. This capability, in turn, helps in preventing various types of misuse (e.g., exploitation of free trials, or association with known problematic accounts, which can be a form of fraud). To effectively use fingerprints for this purpose, you will need to create and maintain your own lists (e.g., blocklists of known problematic fingerprints, allowlists for trusted customers, or tracking frequently used fingerprints). \n\nThe ideal way to utilise fingerprints is by combining them with a manual capture process. While automatic capture with subsequent refunds for problematic payments is possible, manual capture based on fingerprint validation is recommended.\n\nDuring your manual capture workflow, after a payment was authorised:\n  \n  - Check the fingerprint status by comparing it against your maintained lists and internal business rules.\n  - If you decide to proceed with the payment (e.g., the fingerprint is not on a blocklist, or matches a trusted customer's previous payment method): [Capture the order](https://developer.revolut.com/docs/api/merchant#capture-order).\n  - If you decide not to proceed with the payment (e.g., the fingerprint matches a known fraudulent fingerprint, or exhibits suspicious patterns): [Cancel the order](https://developer.revolut.com/docs/api/merchant#cancel-order)."
      example: 1JAllfQY4POhBV8DaddAQ4LC5RbMP8LMLvUdJW4s5JY=
    Authentication-Challenge:
      type: object
      description: 'Details about the authentication challenge that should be performed to complete the authentication process. For more information about Revolut''s 3DS solution, see: [3D Secure overview](https://developer.revolut.com/docs/guides/merchant/reference/3d-secure).


        Only returned if the payment''s state is `authentication_challenge`.'
      discriminator:
        propertyName: type
        mapping:
          three_ds: '#/components/schemas/Three-Ds'
          three_ds_fingerprint: '#/components/schemas/Three-Ds-Fingerprint'
      oneOf:
      - $ref: '#/components/schemas/Three-Ds'
      - $ref: '#/components/schemas/Three-Ds-Fingerprint'
    Order-Type-v2:
      type: string
      description: The type of the order.
      enum:
      - payment
      - payment_request
      - refund
      - chargeback
      - chargeback_reversal
      - credit_reimbursement
    Checkout-Url:
      type: string
      description: Link to a checkout page hosted by Revolut.
      format: uri
    Lodging-Check-In-Date:
      type: string
      format: date-time
      description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date and time of the check-in.'
    ErrorResponse:
      type: object
      description: Standard error response structure
      required:
      - error_id
      - message
      - timestamp
      properties:
        error_id:
          type: string
          format: uuid
          description: Unique identifier for this specific error occurrence.
        message:
          type: string
          description: Human-readable description of the error.
        timestamp:
          type: integer
          format: int64
          description: The time the error occurred in Unix epoch milliseconds.
    Orders-v2:
      type: object
      required:
      - orders
      properties:
        orders:
          type: array
          description: List of orders.
          items:
            $ref: '#/components/schemas/Order-Simplified-v2'
    Airline-Data-v2:
      type: object
      description: "Object containing additional information about an airline booking associated with the order.\n\nUse this object to provide required data to enable **Revolut Flight Alerts**. This feature allows users to receive real-time flight updates such as check-in reminders, boarding alerts, and notifications for cancellations or delays in the Revolut app.\n\nTo enable **Revolut Flight Alerts** functionalities in the Revolut app, the following fields are **required** on order creation or update, before capturing the order:\n  ```\n  tickets_purchase,\n  journey_legs,\n  booking_url\n  ```\n\n:::note\nThese are the specific data field requirements for merchants who must provide airline data. Note that these requirements can be extended on a case by case basis as decided by Revolut.\n\n| Required for airline/charter merchants | Required for OTA merchants |\n| -------------------------------------- | -------------------------- |\n| <ul><li>`booking_id`</li><li>`fulfillment_date`</li><li>`passengers[].first_name`</li><li>`passengers[].last_name`</li><li>`journey_legs[].pnr`</li><li>`journey_legs[].sequence`</li><li>`journey_legs[].flight_number`</li><li>`journey_legs[].travel_date`</li><li>`journey_legs[].airline_code`</li><li>`journey_legs[].departure_airport_code`</li><li>`journey_legs[].arrival_airport_code`</li></ul> | <ul><li>`booking_id`</li><li>`fulfillment_date`</li><li>`passengers[].first_name`</li><li>`passengers[].last_name`</li><li>`journey_legs[].pnr`</li><li>`journey_legs[].arrival_airport_code`</li></ul> |\n:::"
      properties:
        booking_id:
          $ref: '#/components/schemas/Booking-Id'
        fulfillment_date:
          type: string
          format: date-time
          description: "The UTC date and time of the final journey leg.\n\n:::warning\nThe following limitations apply:\n  - When creating or updating an order, `fulfillment_date` cannot be set to a date in the past.\n  - When updating an order, if the current `fulfillment_date` value is already in the past, it cannot be modified. The date must remain as is to maintain data integrity for completed transactions.\n:::"
        tickets_purchase:
          type: boolean
          description: 'Flag indicating whether the order includes actual ticket purchases. Set to `true` if the order contains ticket purchases, and `false` if it does not (e.g., it **only** contains seat reservations, or baggage upgrades).


            :::info

            This field is required for activating **Revolut Flight Alerts** functionalities within the Revolut app.


            Provide the info on order creation or update, before capturing the order.

            :::'
        ticket_type:
          type: string
          enum:
          - fixed
          - flexible
          description: 'The type of the ticket.


            | Parameter value | Description |

            | --------------- | ----------- |

            | `fixed`         | Non-modifiable once confirmed. |

            | `flexible`      | Allows modifications or cancellations under specified conditions. |'
        crs_code:
          type: string
          maxLength: 4
          description: The code of the Computer Reservation System (CRS) used to make the booking and purchase the ticket.
        ticket_change_indicator:
          type: string
          enum:
          - new
          - modification
          description: Parameter indicating whether this order is related to a new ticket reservation or a modification of an existing one.
        refundability:
          $ref: '#/components/schemas/Refundability'
        passengers:
          $ref: '#/components/schemas/Passengers'
        journey_legs:
          $ref: '#/components/schemas/Journey-Legs'
        booking_url:
          type: string
          format: uri
          pattern: ^https?:\/{2}.+/gi
          maxLength: 2000
          description: 'URL to the online portal for managing the airline booking, which includes check-in functionality. This URL may be a personalised, pre-populated check-in link specific to the user or a generic link, and it is essential for enabling direct access to booking details within the Revolut app.


            :::info

            This field is required for activating **Revolut Flight Alerts** functionalities within the Revolut app.


            Provide the info on order creation or update, before capturing the order.

            :::


            :::warning

            Restrictions:

            - Must be a valid URI as defined by [RFC 3986](https://datatracker.ietf.org/doc/html/rfc3986)

            - URI scheme is required and must be either `http` or `https`

            - URI host is required and cannot be `localhost` or an IP address

            - Max length: `2000`

            - Reserved or invalid characters must be percent-encoded (for example, use `%20` instead of a space)

            :::'
      required:
      - booking_id
    Passengers:
      type: array
      description: Array containing information of passengers associated with the booking.
      items:
        $ref: '#/components/schemas/Passenger'
    Merchant-Order-External-Reference:
      type: string
      description: 'Merchant order ID for external reference.


        Use this field to set the ID that your own system can use to easily track orders.'
    Side:
      type: string
      description: The direction of the order.
      enum:
      - buy
      - sell
      example: buy
    Payment-Method-v2:
      type: object
      description: The details of the payment method used to make the payment.
      discriminator:
        propertyName: type
        mapping:
          apple_pay: '#/components/schemas/Apple-Pay'
          card: '#/components/schemas/Card'
          google_pay: '#/components/schemas/Google-Pay'
          revolut_pay_card: '#/components/schemas/Revolut-Pay-Card'
          revolut_pay_account: '#/components/schemas/Revolut-Pay-Account'
          sepa_direct_debit: '#/components/schemas/Sepa-Direct-Debit'
      oneOf:
      - $ref: '#/components/schemas/Apple-Pay'
      - $ref: '#/components/schemas/Card'
      - $ref: '#/components/schemas/Google-Pay'
      - $ref: '#/components/schemas/Revolut-Pay-Card'
      - $ref: '#/components/schemas/Revolut-Pay-Account'
      - $ref: '#/components/schemas/Sepa-Direct-Debit'
    Lodging-Item:
      type: object
      description: Object containing details of an individual lodging entry.
      properties:
        check_in_date:
          $ref: '#/components/schemas/Lodging-Check-In-Date'
        check_out_date:
          $ref: '#/components/schemas/Lodging-Check-Out-Date'
        category:
          $ref: '#/components/schemas/Lodging-Category'
        supplier:
          $ref: '#/components/schemas/Lodging-Supplier'
        booking_type:
          $ref: '#/components/schemas/Lodging-Booking-Type'
        refundability:
          $ref: '#/components/schemas/Refundability'
        location:
          $ref: '#/components/schemas/Lodging-Location'
        guests:
          $ref: '#/components/schemas/Guests'
    Enforce-Challenge-v2:
      type: string
      description: 'The enforce challenge mode. `automatic` is used by default.


        | Parameter value | Description |

        | --------------- | ----------- |

        | `automatic` | The payments created for an order will have challenge requirement calculated by our fraud mechanisms. Not all payments will trigger a 3DS challenge. |

        | `forced` | The payments created for an order will always require a 3DS challenge. Currently only supported for card payments. |'
      default: automatic
      enum:
      - automatic
      - forced
    Image-Url:
      type: string
      format: uri
      pattern: ^https?:\/{2}.+/gi
      maxLength: 2000
      description: 'URL to an image associated with the line item.


        :::warning

        Restrictions:

        - Must be a valid URI as defined by [RFC 3986](https://datatracker.ietf.org/doc/html/rfc3986)

        - URI scheme is required and must be either `http` or `https`

        - URI host is required and cannot be `localhost` or an IP address

        - Max length: `2000`

        - Reserved or invalid characters must be percent-encoded (for example, use `%20` instead of a space)

        :::'
    Three-Ds:
      title: three_ds
      type: object
      description: Information about the 3DS challenge.
      properties:
        type:
          $ref: '#/components/schemas/Authentication-Challenge-Type'
        acs_url:
          type: string
          format: url
          description: The URL of the authentication challenge.
      required:
      - type
      - acs_url
    Order-Description:
      type: string
      description: The description of the order.
    Merchant-Order-Data:
      type: object
      description: 'Object for providing additional information stored in the merchant''s order management system. '
      properties:
        url:
          $ref: '#/components/schemas/Merchant-Order-Url'
        reference:
          $ref: '#/components/schemas/Merchant-Order-External-Reference'
    Order-State:
      type: string
      description: 'The state of the order in its lifecycle.


        | State | Description |

        |-------|-------------|

        | `pending` | Order created, awaiting payment |

        | `processing` | Payment is being processed |

        | `authorised` | Payment authorised but not yet captured (for manual capture) |

        | `completed` | Payment successfully captured and settled |

        | `cancelled` | Order was cancelled |

        | `failed` | Payment failed |


        :::info

        For more information, see: [Order and payment lifecycle](https://developer.revolut.com/docs/guides/merchant/reference/order-lifecycle)

        :::'
      enum:
      - pending
      - processing
      - authorised
      - completed
      - cancelled
      - failed
      example: authorised
    OrderDetails:
      type: object
      description: The requested order details.
      properties:
        id:
          type: string
          format: uuid
          description: ID of the order.
        previous_order_id:
          type: string
          format: uuid
          description: 'ID of the previous/replaced order.

            Present only if this order has replaced another one.'
        client_order_id:
          type: string
          format: uuid
          description: ID of the order assigned by the client when creating the order.
        symbol:
          type: string
          description: Symbol of the asset for which this order has been created.
        side:
          type: string
          enum:
          - buy
          - sell
          description: 'Side of the order.

            Indicates whether the order was to acquire (buy) or dispose of (sell) an asset.'
        type:
          type: string
          enum:
          - market
          - limit
          - conditional
          - tpsl
          description: 'Type of the order.


            A market order is executed immediately at the current market price.

            A limit order is executed only if the asset reaches a specified price set by the trader.

            A conditional order is submitted only once a specific trigger price is reached.

            A tpsl order sets or adjusts the Take Profit and Stop Loss settings for a position.'
        quantity:
          type: string
          description: 'The quantity of the order expressed in the base currency.


            For sell orders, this is the exact, initial locked balance amount to be sold.

            For buy orders, this represents the estimated or projected total quantity to be received upon completion (as the exact quantity depends on the final execution prices).'
        filled_quantity:
          type: string
          description: 'The exact quantity of the order that has been successfully executed, expressed in the base currency.


            For buy orders, this represents the exact total quantity of base currency received so far (gross, before fees are deducted).

            For sell orders, this represents the exact total quantity of base currency spent so far.'
        leaves_quantity:
          type: string
          description: 'The remaining quantity of the order that has not yet been executed, expressed in the base currency.


            This represents the portion of the requested `quantity` that is still waiting to be filled, or the portion that was cancelled.'
        amount:
          type: string
          description: 'The amount of the order expressed in quote currency.


            For buy orders, this is the initial locked balance amount.

            For sell orders, this represents the estimated or projected total value to be received upon completion.'
        filled_amount:
          type: string
          description: 'The exact amount of the order that has been successfully executed, expressed in the quote currency.


            For buy orders, this represents the exact total amount of quote currency spent so far.

            For sell orders, this represents the exact total amount of quote currency received so far (gross, before fees are deducted).'
        price:
          type: string
          description: 'The worst price for the client at which an order will be filled.


            This is the worst price at which the user is willing to trade.

            For buy orders, it''s the maximum price for the order; for sell orders, it''s the minimum price.'
        average_fill_price:
          type: string
          description: 'Quantity-weighted average fill price of the order.


            This is the average price at which the order has been executed so far.

            If the order is filled in parts at different prices, this indicates the overall average price for the order.'
        status:
          type: string
          enum:
          - pending_new
          - new
          - partially_filled
          - filled
          - cancelled
          - rejected
          - replaced
          description: 'Status of the order:


            - `pending_new`: Accepted by a matching engine but not yet working.

            - `new`: Working order.

            - `partially_filled`: Partially filled order.

            - `filled`: Fully filled order.

            - `cancelled`: Cancelled order.

            - `rejected`: Rejected order.

            - `replaced`: Replaced order.'
        reject_reason:
          type: string
          description: Reason for rejecting the order, present only for `status=rejected`.
        time_in_force:
          type: string
          enum:
          - gtc
          - ioc
          - fok
          description: "Time in force of the order.\nIndicates how long the order should remain active before it’s either executed or canceled.\nPossible values:\n\n- `gtc`: Good till cancelled.\n  Means that the order stays active until it’s either completely filled or it's manually cancelled by the user who created the order.\n- `ioc`: Immediate or cancel.\n  Means that any portion of the order that cannot be filled immediately will be cancelled.\n- `fok`: Fill or kill.\n  Means that the order must be filled immediately and in its entirety, or it will be cancelled (no partial fills allowed)."
        execution_instructions:
          $ref: '#/components/schemas/ExecutionInstructions'
        conditional:
          description: 'Details regarding the trigger conditions.

            Present only when the order `type` is `conditional`.'
          $ref: '#/components/schemas/OrderTrigger'
        take_profit:
          description: 'Details of the associated Take Profit trigger.

            Present when the order `type` is `tpsl`. At least one of `stop_loss` or `take_profit` will be present.'
          $ref: '#/components/schemas/OrderTrigger'
        stop_loss:
          description: 'Details of the associated Stop Loss trigger.

            Present when the order `type` is `tpsl`. At least one of `stop_loss` or `take_profit` will be present.'
          $ref: '#/components/schemas/OrderTrigger'
        created_date:
          type: integer
          format: int64
          description: Timestamp in Unix epoch milliseconds.
        updated_date:
          type: integer
          format: int64
          description: Timestamp in Unix epoch milliseconds.
        total_fee:
          type: string
          format: decimal
          description: The total fee for the order.
          example: '0.01'
        fee_currency:
          type: string
          description: The currency in which the fee is charged.
        triggered_by:
          description: 'Details of the trigger order that submitted the current order.

            Present when the current order was created as a result of a conditional or Take Profit/Stop Loss trigger being met.'
          $ref: '#/components/schemas/TriggeredBy'
        on_fill:
          description: 'Details of the Take Profit/Stop Loss exit strategy order linked to the current order.

            Present when a TPSL order is attached to this order and will be submitted once the current order is filled.'
          $ref: '#/components/schemas/OnFill'
      required:
      - id
      - client_order_id
      - symbol
      - side
      - type
      - quantity
      - filled_quantity
      - leaves_quantity
      - price
      - status
      - time_in_force
      - execution_instructions
      - created_date
      - updated_date
    Contact:
      type: object
      description: 'Contact details for someone responsible for the shipment.


        :::warning

        At least `email` or `phone` is required.

        :::'
      properties:
        name:
          type: string
          description: Full name of the contact person.
          maxLength: 250
        email:
          type: string
          format: email
          description: Email address of the contact person.
        phone:
          type: string
          description: Phone number of the contact person.
    Order-Amount-v2:
      type: integer
      description: 'The order total expressed in minor currency units, according to the [ISO 4217 standard](https://en.wikipedia.org/wiki/ISO_4217). For example, `7034` in `EUR` corresponds to €70.34.


        :::info

        - Conversion between major and minor units varies by currency. For instance, `100` minor units equal £1.00 in `GBP`, whereas in `ISK` they represent 100 units. For more details, see the [ISO 4217 standard](https://en.wikipedia.org/wiki/ISO_4217).

        - If `line_items` are provided, the order `amount` must equal the sum of all line items'' `total_amount`.

        - For card payments with a non-zero amount, the order `amount` must be at least **$0.005** (or equivalent in different currencies, calculated using Revolut''s exchange rate on the payment date). Otherwise, card payments can''t be performed.

        :::'
    Subscription-Id:
      type: string
      format: uuid
      description: Unique identifier for the subscription.
    Arn:
      type: string
      description: 'Acquirer Reference Number (ARN) of the payment.


        :::note

        Only returned for refund payments made by a card.

        :::'
      example: '74839572049583726403928'
      minLength: 23
      maxLength: 23
    Location-Id:
      type: string
      format: uuid
      description: 'Unique ID representing the location where merchants sells products.


        :::info

        For more information, see: [Locations](https://developer.revolut.com/docs/api/merchant#tag-locations).

        :::        '
    Discount:
      type: object
      description: Details of a discount applied to the line item, including its name and monetary value.
      properties:
        name:
          type: string
          maxLength: 100
          description: The specific name or label of the discount applied to the line item.
        amount:
          type: integer
          format: int64
          minimum: 0
          description: 'The monetary value of the discount. '
      required:
      - name
      - amount
    Cancel-Authorised-After-v2:
      type: string
      format: duration
      description: "Automatic cancellation period for uncaptured orders, specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.\n\nAfter this period, the authorised payment is automatically cancelled and the order is cancelled.\n\nMaximum period depends on the order's `authorisation_type`:\n- `pre_authorisation`: 30 days = `P30D`\n- `final`: 7 days = `P7D`\n\n:::note\nThe following limitations apply:\n  - Cannot be a negative value.\n  - Cannot be updated if the new value is less than or equal to the elapsed time since authorisation.\n\n    **Failing scenario:**\n      - Original value: 7 days\n      - Time since authorisation: 3 days\n      - Update value: 2 days\n\n    In this scenario, an error is returned.\n\n    **Successful scenario:**\n      - Original value: 7 days\n      - Time since authorisation: 3 days\n      - Update value: 4 days\n\n    In this scenario, the parameter can be updated.\n\n  - Cannot be updated if cancellation is ≤ 30 minutes away.\n\n    **Failing scenario:**\n      - Original value: 12 hours\n      - Time since authorisation: 11 hours 40 minutes\n\n    In this scenario, an error is returned.\n\n    **Successful scenario:**\n      - Original value: 12 hours\n      - Time since authorisation: 11 hours 20 minutes\n\n    In this scenario, the parameter can be updated.\n:::"
    Supplier-Payment-Date:
      type: string
      format: date-time
      description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date and time when the funds are released to merchants.'
    Phone:
      type: string
      description: The phone number of the customer in [E.164 format](https://en.wikipedia.org/wiki/E.164).
    Refunded-Amount:
      type: integer
      description: "The amount that was refunded from the order (in minor currency units). For example, `7034` represents €70.34. \n\nThis applies to orders that have been refunded (i.e., orders of type `payment` that have a related `refund` order)."
    TriggeredBy:
      type: object
      description: 'Details of the trigger order that submitted the current order.

        The current order was created when the trigger condition of a parent conditional or Take Profit/Stop Loss (TPSL) order was met.'
      properties:
        conditional:
          description: 'Details of the conditional trigger.

            Present when `reason` is `conditional`.'
          $ref: '#/components/schemas/OrderTrigger'
        take_profit:
          description: 'Details of the Take Profit trigger.

            Present when `reason` is `take_profit` or `stop_loss`.

            At least one of `stop_loss` or `take_profit` will be present.'
          $ref: '#/components/schemas/OrderTrigger'
        stop_loss:
          description: 'Details of the Stop Loss trigger.

            Present when `reason` is `take_profit` or `stop_loss`.

            At least one of `stop_loss` or `take_profit` will be present.'
          $ref: '#/components/schemas/OrderTrigger'
        reason:
          type: string
          enum:
          - conditional
          - take_profit
          - stop_loss
          description: 'The type of trigger that caused the current order to be submitted.

            - `conditional`: The order was triggered by a conditional order.

            - `take_profit`: The order was triggered by a Take Profit condition being met.

            - `stop_loss`: The order was triggered by a Stop Loss condition being met.'
    OrderTrigger:
      type: object
      required:
      - trigger_price
      - type
      - trigger_direction
      - time_in_force
      - execution_instructions
      properties:
        trigger_price:
          type: string
          format: decimal
          description: 'The price level that activates the order.

            When the market price reaches this value according to the `trigger_direction`, the order is submitted.'
        type:
          type: string
          enum:
          - market
          - limit
          description: Type of the order.
        trigger_direction:
          type: string
          enum:
          - ge
          - le
          description: 'The price comparison operator used to trigger the order.

            * `ge`: Greater than or equal to the trigger price.

            * `le`: Less than or equal to the trigger price.'
        limit_price:
          type: string
          format: decimal
          description: 'The specific price at which the order should be executed.

            Required for limit orders.'
        time_in_force:
          type: string
          enum:
          - gtc
          - ioc
          description: "Time in force of the order.\nIndicates how long the order should remain active before it's either executed or canceled.\nPossible values:\n\n- `gtc`: Good till cancelled.\n  Means that the order stays active until it's either completely filled or it's manually cancelled by the user who created the order.\n- `ioc`: Immediate or cancel.\n  Means that any portion of the order that cannot be filled immediately will be cancelled."
        execution_instructions:
          $ref: '#/components/schemas/ExecutionInstructions'
    Settlement-Currency:
      type: string
      description: "[ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code in upper case. \n\nIf `settlement_currency` is different from the value of `currency`, the money will be exchanged when the amount is settled to your merchant account. In case of a refund or chargeback, the money will be exchanged to the order's initial `currency`.\n\nIf `settlement_currency` is not specified, this value is taken from `currency`.\n\n:::info\nFor more information about the supported currencies, see: [Help Center](https://help.revolut.com/business/help/merchant-accounts/payments/in-which-currencies-can-i-accept-payments/).\n:::"
    Address-v4:
      type: object
      description: Details of a physical address.
      properties:
        street_line_1:
          type: string
          description: Primary address line.
          maxLength: 100
        street_line_2:
          type: string
          description: Secondary address line, such as floor and apartment number.
          maxLength: 100
        region:
          type: string
          description: State or province of the address.
          maxLength: 100
        city:
          type: string
          description: City of the address.
          maxLength: 100
        country_code:
          type: string
          pattern: ^[A-Z]{2}$
          description: ISO 2-letter country code.
          minLength: 2
          maxLength: 2
        country_subdivision_code:
          type: string
          pattern: ^[A-Z]{2}-[A-Z0-9]{1,3}$
          description: "The subdivision code represents the state, province, or region within the country, following the [ISO 3166-2](https://en.wikipedia.org/wiki/ISO_3166-2) standard. This code uniquely identifies subdivisions within a country. \n\nFor example, for London in the United Kingdom, use `GB-LND`.\n\n:::warning\nThe parameter is required for countries listed on the [ISO 3166-2](https://en.wikipedia.org/wiki/ISO_3166-2) page.\n:::"
          minLength: 5
          maxLength: 6
        postcode:
          type: string
          description: Postal code of the address.
          maxLength: 100
      required:
      - street_line_1
      - city
      - country_code
      - postcode
    Subscription-Order-Billing-Reason:
      type: string
      enum:
      - cycle_billing
      - final_settlement
      - setup_intent
      description: 'The reason this subscription order was created.


        | Value | Description |

        | ----- | ----------- |

        | `cycle_billing` | The order was automatically generated to collect payment for an ongoing subscription cycle. `active_cycle_id` is present; `settled_cycle_id` is present if the previous cycle included usage-based products. |

        | `final_settlement` | The order was automatically generated after the subscription ended to collect outstanding usage-based charges. `active_cycle_id` is absent; `settled_cycle_id` is present. |

        | `setup_intent` | The order was manually created by the merchant or customer to update the payment method on file. `active_cycle_id` is absent; `settled_cycle_id` is absent. |'
    Industry-Data-v3:
      type: object
      description: "Object containing industry-specific information associated with the order.\n\nYou can provide data for one or multiple industries in a single order.\n\n:::info\nIn the following cases, industry-specific info is required. Omitting this information may trigger additional scrutiny and risk mitigation actions by the Revolut risk team.\n\n  | Transaction type | Required for |\n  | ---------------- | ----------- |\n  | `airline`        | Airlines and Online Travel Agencies (OTAs). |\n  | `car_rental`     | Car Rental Merchants and Online Travel Agencies (OTAs). |\n  | `crypto`         | Crypto merchants. |\n  | `marketplace`    | Marketplace merchants. |\n  | `event`          | Event ticket sellers. |\n  | `lodging`        | Lodging providers. |\n:::"
      properties:
        airline:
          $ref: '#/components/schemas/Airline-Data-v2'
        car_rental:
          $ref: '#/components/schemas/Car-Rental-v2'
        crypto:
          $ref: '#/components/schemas/Crypto-Transactions-v3'
        marketplace:
          $ref: '#/components/schemas/Marketplace-v3'
        event:
          $ref: '#/components/schemas/Events-v2'
        lodging:
          $ref: '#/components/schemas/Lodging-v3'
    Sepa-Direct-Debit-Debtor-Name:
      type: string
      description: The full name of the debtor as provided in the mandate.
    Sepa-Direct-Debit-Debtor-Iban-Last-Four:
      type: string
      description: The last four digits of the debtor's IBAN.
      minLength: 4
      maxLength: 4
    Payer:
      title: Payer
      type: object
      description: 'The person who made the payment. This object is present when an email or phone number is provided during the payment flow.


        Capturing payer details lets you identify exactly who authorised the charge, reach the right person for receipts or refund queries, and support compliance or fraud-review workflows where the paying identity matters.'
      properties:
        email:
          $ref: '#/components/schemas/Email'
          description: The email of the person who made the payment.
        phone:
          $ref: '#/components/schemas/Phone'
          description: The phone number of the payer in [E.164 format](https://en.wikipedia.org/wiki/E.164).
    Increment-Amount:
      type: integer
      minimum: 1
      description: 'The new total amount to be authorised (in minor units, e.g., cents).


        This should be the **full new amount**, not the increment value.

        For example, if the current authorised amount is `500` and you want to add 100, pass `600`.


        :::warning

        - Must be greater than or equal to the current authorised amount (incrementing with same amount allowed to extend capture deadline for Mastercard)

        - The sum of all increment amounts cannot exceed 5x the initial authorised amount (e.g., initial amount £100 allows up to £500 in total increments)

        :::'
      example: 600
    Refund-Currency:
      type: string
      format: ISO 4217
      minLength: 3
      maxLength: 3
      description: '[ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code in upper case.


        **Must match the `currency` of the original order to be refunded.**


        :::info

        For more information about the supported currencies, see: [Help Center](https://help.revolut.com/business/help/merchant-accounts/payments/in-which-currencies-can-i-accept-payments/).

        :::'
    ClientTrade:
      type: object
      description: A single trade.
      properties:
        tdt:
          type: integer
          format: int64
          description: Trade date and time, expressed in Unix epoch milliseconds.
          example: 3318215482991
        aid:
          type: string
          description: Crypto-asset ID code.
          example: BTC
        anm:
          type: string
          description: Crypto-asset full name.
          example: Bitcoin
        p:
          type: string
          description: Price in major currency units. For example, for USD, `116243.32` represents 116243.32 dollars.
          example: '116243.32'
        pc:
          type: string
          description: Price currency.
          example: USD
        pn:
          type: string
          description: Price notation.
          example: MONE
        q:
          type: string
          description: Quantity.
          example: '0.24521000'
        qc:
          type: string
          description: Quantity currency.
          example: BTC
        qn:
          type: string
          description: Quantity notation.
          example: UNIT
        ve:
          type: string
          description: Venue of execution. Always equals `REVX`.
          example: REVX
        pdt:
          type: integer
          format: int64
          description: Publication date and time, expressed in Unix epoch milliseconds.
          example: 3318215482991
        vp:
          type: string
          description: Venue of publication. Always equals `REVX`.
          example: REVX
        tid:
          type: string
          description: Transaction identification code.
          example: 5ef9648f658149f7ababedc97a6401f8
        oid:
          type: string
          format: uuid
          description: Unique identifier for the order associated with the trade.
          example: 2affb2ac-4cf7-4bbf-b7b2-fc1e885bdc2c
        s:
          type: string
          enum:
          - buy
          - sell
          description: Indicates the trade direction of the order.
          example: buy
        im:
          type: boolean
          description: Indicates whether the trade was a maker (true) or taker (false).
          example: true
      required:
      - tdt
      - aid
      - anm
      - p
      - pc
      - pn
      - q
      - qc
      - qn
      - ve
      - pdt
      - vp
      - tid
      - oid
      - im
    Error-v2:
      title: Error
      type: object
      properties:
        code:
          type: string
          description: 'An identifier that can be used to determine what went wrong.


            Error codes are not globally unique, but uniqueness is guaranteed within endpoints.'
        message:
          type: string
          description: Some human readable text describing what went wrong.
        timestamp:
          type: integer
          description: The [UNIX timestamp](https://www.unixtimestamp.com/) of the date and time the error happened.
    Payment-Method-Type:
      type: string
      enum:
      - apple_pay
      - card
      - google_pay
      - revolut_pay_card
      - revolut_pay_account
      - sepa_direct_debit
      description: 'The type of payment method used to pay for the order.


        Available values:


        | Payment method `type` | Description |

        | --------------------- | ----------- |

        | `apple_pay` | The customer paid the order using Apple Pay. |

        | `card` | The customer paid the order using their credit or debit card. |

        | `google_pay` | The customer paid the order using Google Pay. |

        | `revolut_pay_card` | The customer paid the order via Revolut Pay using their credit or debit card. |

        | `revolut_pay_account` | The customer paid the order via Revolut Pay using their Revolut account. |

        | `sepa_direct_debit` | The customer paid the order using SEPA Direct Debit. |'
    Payment-Settled-Currency:
      type: string
      description: 'The currency of the settled payment. [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code in upper case.


        :::info

        For more information about the supported currencies, see: [Help Center](https://help.revolut.com/business/help/merchant-accounts/payments/in-which-currencies-can-i-accept-payments/).

        :::'
    Authentication-Challenge-v2:
      type: object
      description: 'Details about the authentication challenge that should be performed to complete the authentication process. For more information about Revolut''s 3DS solution, see: [3D Secure overview](https://developer.revolut.com/docs/guides/merchant/reference/3d-secure).


        Only returned if the payment''s state is `authentication_challenge`.'
      discriminator:
        propertyName: type
        mapping:
          three_ds: '#/components/schemas/Three-Ds'
          three_ds_fingerprint: '#/components/schemas/Three-Ds-Fingerprint-v2'
      oneOf:
      - $ref: '#/components/schemas/Three-Ds'
      - $ref: '#/components/schemas/Three-Ds-Fingerprint-v2'
    Address-v2:
      type: object
      description: Object containing address details.
      properties:
        street_line_1:
          type: string
          description: Street line 1 information.
          maxLength: 100
        street_line_2:
          type: string
          description: Street line 2 information.
          maxLength: 100
        region:
          type: string
          description: The region associated with the address.
          maxLength: 100
        city:
          type: string
          description: The city associated with the address.
          maxLength: 100
        country_code:
          type: string
          description: The 2-letter country code of the country associated with the address.
          maxLength: 2
        postcode:
          type: string
          description: The postcode associated with the address.
          maxLength: 100
      required:
      - country_code
      - postcode
    Ticket:
      type: object
      description: Object containing information about a ticket associated with the booking.
      properties:
        id:
          type: string
          description: A unique identifier provided by the merchant associated with the ticket.
        transferable:
          type: boolean
          description: Indicates whether the ticket is transferable to another buyer.
        refundability:
          $ref: '#/components/schemas/Refundability'
      required:
      - id
    Quantity:
      type: object
      description: Object representing the quantity details of a line item, including the amount and its associated unit of measurement.
      properties:
        value:
          type: number
          format: double
          minimum: 0
          description: The number of units of the line item.
        unit:
          type: string
          maxLength: 100
          description: The measurement unit for the quantity, such as `cm`, or `kg`.
      required:
      - value
    Order-Simplified-v2:
      title: Simplified order
      type: object
      description: 'A simplified order object returned in list responses.


        To get the full details of an order, use the [Retrieve an order](https://developer.revolut.com/docs/api/merchant#retrieve-order) endpoint.'
      properties:
        id:
          $ref: '#/components/schemas/Order-Id'
        token:
          $ref: '#/components/schemas/Order-Token'
        type:
          $ref: '#/components/schemas/Order-Type-v2'
        state:
          $ref: '#/components/schemas/Order-State'
        created_at:
          type: string
          format: date-time
          description: The date and time the order was created.
        updated_at:
          type: string
          format: date-time
          description: The date and time the order was last updated.
        amount:
          $ref: '#/components/schemas/Order-Amount-v2'
        currency:
          $ref: '#/components/schemas/Currency'
        outstanding_amount:
          $ref: '#/components/schemas/Outstanding-Amount'
        capture_mode:
          $ref: '#/components/schemas/Capture-Mode-v2'
        enforce_challenge:
          $ref: '#/components/schemas/Enforce-Challenge-v2'
        authorisation_type:
          $ref: '#/components/schemas/Authorisation-Type'
        description:
          $ref: '#/components/schemas/Order-Description'
        metadata:
          $ref: '#/components/schemas/Metadata'
        related_order_id:
          $ref: '#/components/schemas/Related-Order-Id'
        subscription_data:
          $ref: '#/components/schemas/Subscription-Data'
        customer:
          $ref: '#/components/schemas/Order-Customer-v2'
        line_items:
          $ref: '#/components/schemas/Line-Items'
        merchant_order_data:
          $ref: '#/components/schemas/Merchant-Order-Data'
        location_id:
          $ref: '#/components/schemas/Location-Id'
        redirect_url:
          $ref: '#/components/schemas/Redirect-Url'
        cancel_authorised_after:
          $ref: '#/components/schemas/Cancel-Authorised-After'
        statement_descriptor_suffix:
          $ref: '#/components/schemas/Statement-Descriptor-Suffix'
      required:
      - id
      - type
      - state
      - created_at
      - updated_at
      - amount
      - currency
      - outstanding_amount
      - capture_mode
      - enforce_challenge
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID of the order.
        previous_order_id:
          type: string
          format: uuid
          description: 'ID of the previous/replaced order.

            Present only if this order has replaced another one.'
        client_order_id:
          type: string
          format: uuid
          description: ID of the order assigned by the client when creating the order.
        symbol:
          type: string
          description: Symbol of the asset for which this order has been created.
        side:
          type: string
          enum:
          - buy
          - sell
          description: 'Side of the order.

            Indicates whether the order was to acquire (buy) or dispose of (sell) an asset.'
        type:
          type: string
          enum:
          - market
          - limit
          - conditional
          - tpsl
          description: 'Type of the order.


            A market order is executed immediately at the current market price.

            A limit order is executed only if the asset reaches a specified price set by the trader.

            A conditional order is submitted only once a specific trigger price is reached.

            A tpsl order sets or adjusts the Take Profit and Stop Loss settings for a position.'
        quantity:
          type: string
          description: 'The quantity of the order expressed in the base currency.


            For sell orders, this is the exact, initial locked balance amount to be sold.

            For buy orders, this represents the estimated or projected total quantity to be received upon completion (as the exact quantity depends on the final execution prices).'
        filled_quantity:
          type: string
          description: 'The exact quantity of the order that has been successfully executed, expressed in the base currency.


            For buy orders, this represents the exact total quantity of base currency received so far (gross, before fees are deducted).

            For sell orders, this represents the exact total quantity of base currency spent so far.'
        leaves_quantity:
          type: string
          description: 'The remaining quantity of the order that has not yet been executed, expressed in the base currency.


            This represents the portion of the requested `quantity` that is still waiting to be filled, or the portion that was cancelled.'
        amount:
          type: string
          description: 'The amount of the order expressed in quote currency.


            For buy orders, this is the initial locked balance amount.

            For sell orders, this represents the estimated or projected total value to be received upon completion.'
        filled_amount:
          type: string
          description: 'The exact amount of the order that has been successfully executed, expressed in the quote currency.


            For buy orders, this represents the exact total amount of quote currency spent so far.

            For sell orders, this represents the exact total amount of quote currency received so far (gross, before fees are deducted).'
        price:
          type: string
          description: 'The worst price for the client at which an order will be filled.


            This is the worst price at which the user is willing to trade.

            For buy orders, it''s the maximum price for the order; for sell orders, it''s the minimum price.'
        average_fill_price:
          type: string
          description: 'Quantity-weighted average fill price of the order.


            This is the average price at which the order has been executed so far.

            If the order is filled in parts at different prices, this indicates the overall average price for the order.'
        status:
          type: string
          enum:
          - pending_new
          - new
          - partially_filled
          - filled
          - cancelled
          - rejected
          - replaced
          description: 'Status of the order:


            - `pending_new`: Accepted by a matching engine but not yet working.

            - `new`: Working order.

            - `partially_filled`: Partially filled order.

            - `filled`: Fully filled order.

            - `cancelled`: Cancelled order.

            - `rejected`: Rejected order.

            - `replaced`: Replaced order.'
        reject_reason:
          type: string
          description: Reason for rejecting the order, present only for `status=rejected`.
        time_in_force:
          type: string
          enum:
          - gtc
          - ioc
          - fok
          description: "Time in force of the order.\nIndicates how long the order should remain active before it’s either executed or canceled.\nPossible values:\n\n- `gtc`: Good till cancelled.\n  Means that the order stays active until it’s either completely filled or it's manually cancelled by the user who created the order.\n- `ioc`: Immediate or cancel.\n  Means that any portion of the order that cannot be filled immediately will be cancelled.\n- `fok`: Fill or kill.\n  Means that the order must be filled immediately and in its entirety, or it will be cancelled (no partial fills allowed)."
        execution_instructions:
          $ref: '#/components/schemas/ExecutionInstructions'
        conditional:
          description: 'Details regarding the trigger conditions.

            Present only when the order `type` is `conditional`.'
          $ref: '#/components/schemas/OrderTrigger'
        take_profit:
          description: 'Details of the associated Take Profit trigger.

            Present when the order `type` is `tpsl`. At least one of `stop_loss` or `take_profit` will be present.'
          $ref: '#/components/schemas/OrderTrigger'
        stop_loss:
          description: 'Details of the associated Stop Loss trigger.

            Present when the order `type` is `tpsl`. At least one of `stop_loss` or `take_profit` will be present.'
          $ref: '#/components/schemas/OrderTrigger'
        created_date:
          type: integer
          format: int64
          description: Timestamp in Unix epoch milliseconds.
        updated_date:
          type: integer
          format: int64
          description: Timestamp in Unix epoch milliseconds.
      required:
      - id
      - client_order_id
      - symbol
      - side
      - type
      - quantity
      - filled_quantity
      - leaves_quantity
      - price
      - status
      - time_in_force
      - execution_instructions
      - created_date
      - updated_date
    OrderPlacementResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          description: Wrapper object containing the order details.
          required:
          - client_order_id
          - venue_order_id
          - state
          properties:
            venue_order_id:
              type: string
              format: uuid
              description: ID of the order generated by the system.
            client_order_id:
              type: string
              format: uuid
              description: Client order ID provided by the client.
            state:
              type: string
              description: Order state after submitting it.
              enum:
              - pending_new
              - new
              - partially_filled
              - filled
              - cancelled
              - rejected
              - replaced
    Payment-Token:
      type: string
      format: uuid
      description: "Temporary token of the payment used to fetch the reward offer during checkout and link user registrations to the given offers. \n\nThe token is only valid for a limited time."
    Saved-Payment-Method:
      type: object
      properties:
        saved_payment_method:
          type: object
          description: Object containing information about the saved payment method used to pay for the order.
          properties:
            type:
              type: string
              enum:
              - card
              - revolut_pay
              description: Type of saved payment method.
              example: card
            id:
              type: string
              description: Saved payment method ID.
            initiator:
              type: string
              description: "Indicates who is allowed to initiate the payment. \n\n:::note\nUsing this endpoint, only merchant initiated payments are supported with Revolut Pay.\n:::"
              enum:
              - customer
              - merchant
              example: customer
            environment:
              $ref: '#/components/schemas/Environment'
          required:
          - type
          - id
          - initiator
          - environment
      required:
      - saved_payment_method
    Authorisation-Code:
      type: string
      description: 'The authorisation code (or auth code) is a short, alphanumeric code returned by the cardholder''s issuing bank to the merchant''s terminal or payment gateway.


        It serves as confirmation that the transaction has been approved and funds are available.'
      example: T483XF
      pattern: ^[a-zA-Z0-9]{2,6}$
      minLength: 2
      maxLength: 6
    Sepa-Direct-Debit-Mandate-Reference:
      type: string
      description: The unique mandate reference generated by Revolut. Include this in pre-debit notifications sent to your customers.
    Browser-Environment:
      type: object
      description: Browser environment
      properties:
        type:
          type: string
          enum:
          - browser
          example: browser
          description: Type of environment where the payment was made.
        time_zone_utc_offset:
          type: integer
          example: 180
          description: Defines the offset to UTC in minutes.
        color_depth:
          type: integer
          example: 32
          description: The browser's available colour depth.
        screen_width:
          type: integer
          example: 1920
          description: The browser's screen width in pixels.
        screen_height:
          type: integer
          example: 1080
          description: The browser's screen height in pixels.
        java_enabled:
          type: boolean
          example: false
          description: Indicates if the browser has Java enabled.
        challenge_window_width:
          type: integer
          example: 640
          description: Defines the width of the pop-up window where the authentication challenge appears.
        browser_url:
          type: string
          format: url
          example: https://business.revolut.com
          description: The URL of the page where the payment was initiated.
      required:
      - type
      - time_zone_utc_offset
      - color_depth
      - screen_width
      - screen_height
      - java_enabled
    Shipping:
      type: object
      description: 'Details about the shipping related to the order, including address, contact information, and individual shipments.


        :::info

        Required for merchants shipping physical goods. Omitting this information may trigger additional scrutiny and risk mitigation actions by Revolut.

        :::'
      properties:
        address:
          $ref: '#/components/schemas/Address-v3'
        contact:
          $ref: '#/components/schemas/Contact'
        shipments:
          $ref: '#/components/schemas/Shipments'
    Journey-Leg:
      type: object
      properties:
        sequence:
          type: integer
          description: "Sequence of the journey legs. Increment by 1 for each flight included in the ticket.\n\nFor example: For a `FRA > LHR > DUB > LHR > FRA` journey the sequence will be assigned as:\n  - `FRA > LHR`: 1\n  - `LHR > DUB`: 2\n  - `DUB > LHR`: 3\n  - `LHR > FRA`: 4"
        departure_airport_code:
          type: string
          description: The [IATA](https://www.iata.org/en/services/codes) 3-letter airport code for the departure airport.
        arrival_airport_code:
          type: string
          description: The [IATA](https://www.iata.org/en/services/codes) 3-letter airport code for the arrival airport.
        flight_number:
          type: string
          description: The flight identifier, without airline code.
        fare_base_code:
          type: string
          description: The fare base code for the given journey leg.
        travel_date:
          type: string
          format: date-time
          description: The UTC date and time of the flight departure for the given journey leg.
        airline_name:
          type: string
          description: The name of the airline associated with the journey leg.
        airline_code:
          type: string
          description: The IATA 2-letter accounting code identifying the airline associated with the journey leg.
        pnr:
          type: string
          format: alphanumeric
          pattern: ^[a-zA-Z0-9]*$
          maxLength: 20
          description: "The Passenger Name Record (PNR) for the journey leg issued by the airline. \n\nPNR is a unique identifier for the booking, acting as a digital certificate allowing passengers to retrieve or manage their booking details.\n\n:::warning\nThis is a required field for OTAs.\n:::"
      required:
      - sequence
      - departure_airport_code
      - arrival_airport_code
      - travel_date
      - airline_name
      - airline_code
    Booking-Id:
      type: string
      description: "A unique identifier provided by the merchant associated with the order. \n\nThis `booking_id` is used to reference and correlate booking information with the Merchant API and the merchant's internal system."
    HistoricalOrdersPaginatedResponse:
      type: object
      required:
      - data
      - metadata
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        metadata:
          type: object
          required:
          - timestamp
          properties:
            timestamp:
              type: integer
              format: int64
              description: Timestamp in Unix epoch milliseconds.
            next_cursor:
              type: string
              description: 'Cursor used to retrieve the next page of results.


                To continue paginating through the results, make a new request and pass this value in the [`cursor`](https://developer.revolut.com/docs/api/revolut-x-crypto-exchange#get-historical-orders#request) query parameter.'
    Payment-Amount:
      type: integer
      format: int64
      minimum: 0
      description: 'The payment amount in minor units (e.g., cents). The value of this field depends on the payment type and state.


        | Payment type | State | Amount value |

        |--------------|-------|--------------|

        | Standard payment | Any | Total payment amount |

        | Pre-authorised payment | `authorisation_started` | New amount being authorised (during increment processing) |

        | Pre-authorised payment | `authorised` | Currently authorised amount (equals `authorised_amount`) |


        :::info

        For pre-authorised payments, see the `authorised_amount` field for tracking the currently authorised amount separately.

        :::'
      example: 600
    Lodging-Supplier:
      type: object
      description: Object containing supplier information about the lodging provider.
      properties:
        id:
          type: string
          description: Unique identifier of the lodging supplier.
        name:
          type: string
          description: Legal name of the lodging supplier.
        payment_date:
          $ref: '#/components/schemas/Supplier-Payment-Date'
    Line-Item:
      type: object
      properties:
        name:
          type: string
          maxLength: 250
          description: Name of the line item.
        type:
          type: string
          enum:
          - physical
          - service
          description: Type of the line item.
        quantity:
          $ref: '#/components/schemas/Quantity'
        unit_price_amount:
          type: integer
          format: int64
          minimum: 0
          description: The unit price of the line item.
        total_amount:
          type: integer
          format: int64
          description: The total amount to be paid for the line item, including taxes and discounts.
        external_id:
          type: string
          maxLength: 250
          description: Unique identifier of line item in the merchant's system.
        discounts:
          type: array
          maxItems: 50
          description: A list of discounts applied to the line item. Each discount should be subtracted from the total amount payable for the item.
          items:
            $ref: '#/components/schemas/Discount'
        taxes:
          type: array
          maxItems: 50
          description: A list of taxes applied to the line item. Each tax should be added to the total amount payable for the item.
          items:
            $ref: '#/components/schemas/Tax'
        image_urls:
          type: array
          maxItems: 50
          description: A list of URLs pointing to images related to the line item. These images can provide visual details or representations of the item.
          items:
            $ref: '#/components/schemas/Image-Url'
        description:
          type: string
          maxLength: 1024
          description: Description of the line item.
        url:
          type: string
          format: uri
          pattern: ^https?:\/{2}.+/gi
          maxLength: 2000
          description: 'An HTTP/HTTPS URL that links to more information about the line item, such as a product page or details.


            :::warning

            Restrictions:

            - Must be a valid URI as defined by [RFC 3986](https://datatracker.ietf.org/doc/html/rfc3986)

            - URI scheme is required and must be either `http` or `https`

            - URI host is required and cannot be `localhost` or an IP address

            - Max length: `2000`

            - Reserved or invalid characters must be percent-encoded (for example, use `%20` instead of a space)

            :::'
      required:
      - name
      - unit_price_amount
      - total_amount
      - quantity
      - type
    Bank-Message:
      type: string
      description: The reason for a `failed` or `declined` payment, sent by the financial institution processing the payment.
