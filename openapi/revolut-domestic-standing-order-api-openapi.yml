        required:
        - CreditorAccount
        - FirstPaymentAmount
        - FirstPaymentDateTime
        - Frequency
        - DebtorAccount
    OBWriteDomesticStandingOrderConsent2:
      required:
      - Data
      - Risk
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/OBWriteDataDomesticStandingOrderConsent2'
        Risk:
          $ref: '#/components/schemas/OBRisk1'
    Meta:
      title: MetaData
      type: object
      properties:
        TotalPages:
          type: integer
          description: Used for pagination. Indicates how many pages of results are available.
          format: int32
      description: Meta data relevant to the payload.
    OBExternalAccountIdentification4Code:
      type: string
      description: The name of the identification scheme.
      enum:
