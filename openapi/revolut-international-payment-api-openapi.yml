                    CurrencyOfTransfer: EUR
                    EndToEndIdentification: E2E1234
                    InstructionIdentification: Reference1234
                  ExchangeRateInformation:
                    UnitCurrency: EUR
                    RateType: Indicative
                    ExchangeRate: '1.0000'
                Risk:
