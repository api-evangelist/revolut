aid: revolut
name: Revolut
description: >-
  Revolut is a global financial technology company providing banking, payments, cards, foreign
  exchange, savings, and crypto services to retail and business customers. Its developer platform
  publishes several distinct REST APIs: the Business API (accounts, transfers, payments,
  counterparties, cards, webhooks), the Merchant API (online card acquiring, orders, captures,
  refunds, subscriptions), the Open Banking API (UK Open Banking / PSD2 account information and
  payment initiation, FAPI-secured with detached JWS), the Crypto Ramp API (fiat-to-crypto on/off
  ramp for partners), and the Revolut X crypto exchange API (balances, orders, trades, market
  data). Revolut publishes official OpenAPI specifications and Agent Skills on GitHub.
