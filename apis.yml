- aid: revolut:revolut-accounting-api
  name: Revolut Accounting API
  description: >-
    Manage [accounting settings](https://business.revolut.com/settings/accounting) for your business that
    can be assigned to your financial records such as [expenses](https://developer.revolut.com/docs/guides/manage-accounts/accounts-and-transactions/retrieve-expenses)
    or bills*.


    Create, retrieve, update, and delete settings such as accounting categories, tax rates, and labels.


    For more information, see the guides: [Manage accounting settings](https://developer.revolut.com/docs/guides/manage-accounts/accounting/manage-accounting-settings),
    [Manage accounting categories](https://developer.revolut.com/docs/guides/manage-accounts/accounting/manage-accounting-categories),
    [Manage tax rates](https://developer.revolut.com/docs/guides/manage-accounts/accounting/manage-tax-rates)
    and [Manage labels and label groups](https://developer.revolut.com/docs/guides/manage-accounts/accounting/manage-labels-and-label-groups),
    .


    See also the Revolut Help Centre: [Expenses](https://help.revolut.com/business/help/managing-my-business/expenses/)
    and [BillPay](https://help.revolut.com/business/help/integrating-with-external-apps/introduction-to-billpay/).


    _*<small>Some settings are not supported for certain types of financial records.

    For example, labels cannot be applied to bills.

    Check the guides for details.

    </small>_
