- aid: revolut:revolut-subscriptions-api
  name: Revolut Subscriptions API
  description: >-
    The Subscriptions API provides a complete solution for creating and managing recurring billing for
    your customers.


    You can automatically charge customers on flexible billing cycles, manage sophisticated subscription
    plans, and track the entire billing history for every subscriber.


    ## How it works?


    A subscription's billing structure is defined by a **Subscription plan**. This model gives you granular
    control:


    - **Plans** contain one or more **variations** (e.g., a "Gold" plan could have "Monthly" and "Yearly"
    variations).

    - **Variations** can have multiple **phases** (e.g., a 7-day free trial followed by a regular billing
    phase).


    This powerful structure allows you to build complex pricing models, including free trials, introductory
    offers, and tiered pricing.


    ## Key features


    - **Flexible pricing models:** Create plans with multiple variations and phases to support any billing
    scenario.

    - **Automated charging:** Automatically charge a customer's saved payment method at the start of each
    billing cycle.

    - **Hosted onboarding:** For new customers, generate a setup order with a redirect URL to Revolut's
    Hosted Payment Page, allowing them to securely add a payment method.

    - **Lifecycle tracking:** Monitor each billing cycle's state, view all associated orders, and access
    complete payment histories.

    - **Full subscription management:** Easily update customer payment methods, cancel subscriptions,
    and view a complete billing history.
  humanURL: https://developer.revolut.com/docs/business/business-api
  baseURL: https://b2b.revolut.com/api/1.0
  tags:
  - Subscription
  tags_raw:
  - Subscriptions
  properties:
  - type: OpenAPI
    url: openapi/revolut-subscriptions-api-openapi.yml
