- aid: revolut:revolut-webhooks-v1-deprecated-api
  name: Revolut Webhooks (v1) (deprecated) API
  description: ":::warning\nThis is the v1 of the Webhooks API. This version is deprecated. For the latest\
    \ version of the API, see [Webhooks (v2)](https://developer.revolut.com/docs/api/business#tag-webhooks-v2).\n\
    :::\n\nA webhook (also called a web callback) allows your system to receive updates about your account\
    \ to an HTTPS endpoint that you provide. \nWhen a supported event occurs, a notification is posted\
    \ via HTTP `POST` method to the specified endpoint. \n\nIf the receiver returns an HTTP error response,\
    \ Revolut will retry the webhook event two more times.\n\nThe following events are supported:\n\n\
    - `TransactionCreated`\n- `TransactionStateChanged`\n\nYou cannot choose which event type to subscribe\
    \ to. When you create a webhook, you automatically subscribe to all supported events."
