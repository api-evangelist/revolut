- aid: revolut:revolut-locations-api
  name: Revolut Locations API
  description: "The Locations API is designed to help merchants manage multiple points of sale, including both **online storefronts** and **physical\
    \ stores**. Registering locations lets you differentiate and group your orders from different stores. You can also introduce custom business\
    \ logic for each location, such as different inventory management, pricing, or shipping rules.\n\nTo start using locations, follow the relevant\
    \ use case for your business:\n\n### Online locations\n\n  1. Register an online location using the [Create a location](https://developer.revolut.com/docs/api/merchant#create-location)\n\
    endpoint, setting the `type` to `online`.\n  1. Configure your custom processes on your backend for each registered location (e.g., grouping\n\
    orders, custom pricing, etc.).\n  1. Send the `location_id` parameter in the request body during [order creation](https://developer.revolut.com/docs/api/merchant#create-order)\n\
    to assign the order to a specific location.\n### Physical locations\n\n  1. Register a physical location using the [Create a location](https://developer.revolut.com/docs/api/merchant#create-location)\n\
    endpoint, setting the `type` to `physical`.\n  1. In case of Revolut POS, our system handles order creation including `location_id` to associate\n\
    the order with your location.\n## Fast checkout for multiple storefronts\n\nLocations are particularly useful for tailoring the user experience\
    \ on each of your online storefronts, especially when using features like [**Fast checkout**](https://developer.revolut.com/docs/guides/merchant/optimise-checkout/fast-checkout).\n\
    \nFor example, if you operate two online stores with different shipping rules, you can register two separate `online` locations. By then using\
    \ the `location_id` to [register a distinct address validation endpoint](https://developer.revolut.com/docs/api/merchant#register-address-validation-endpoint)\
    \ for each one, your backend can apply the correct shipping logic and pricing for the specific storefront a customer is buying from."
  humanURL: https://developer.revolut.com/docs/business/business-api
  baseURL: https://merchant.revolut.com
  tags:
  - Location
  tags_raw:
