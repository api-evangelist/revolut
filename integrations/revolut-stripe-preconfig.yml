arazzo: 1.0.1
info:
  title: 'revolut through stripe: PostPaymentMethods preconfigured with revolut'
  summary: Calls stripe's PostPaymentMethods with `revolut` preset, the way revolut is used inside stripe.
  description: 'A PRECONFIGURATION, not an orchestration: revolut is a banking-partner inside stripe, so the integration
    is stripe''s own operation with revolut''s enum value set. Derived from stripe''s contract (stripe-payment-methods-api-openapi.yml);
    required properties are inputs.'
  version: 1.0.0
x-integration:
  partner: stripe
  relationship: banking-partner
  preconfig: true
  edge_evidence: https://github.com/api-evangelist/stripe/blob/main/openapi/stripe-payment-methods-api-openapi.yml
  edge_type: contract
  preset:
    ideal.bank: revolut
  method: derived
  generated: '2026-10-12'
  generator: build-integration-preconfigs.py
sourceDescriptions:
- name: stripePaymentMethodsApiOpenapi
  url: https://raw.githubusercontent.com/api-evangelist/stripe/refs/heads/main/openapi/stripe-payment-methods-api-openapi.yml
  type: openapi
workflows:
- workflowId: revolut-via-stripe-postpaymentmethods
  summary: PostPaymentMethods with revolut preset
  inputs:
    type: object
    required: []
    properties: {}
  steps:
  - stepId: call-with-preset
    operationId: $sourceDescriptions.stripePaymentMethodsApiOpenapi.PostPaymentMethods
    requestBody:
      contentType: application/x-www-form-urlencoded
      payload:
        ideal:
          bank: revolut
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      id: $response.body#/id
  outputs:
    id: $steps.call-with-preset.outputs.id
